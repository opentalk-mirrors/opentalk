services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: ["core", "standard", "full", "keycloak"]
    restart: always
    build: .
    environment:
      KC_DOMAIN: $OT_DOMAIN
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: password
      KC_REALM_ID: ${KC_REALM_ID:-opentalk}
      KC_REALM_NAME: ${KC_REALM_NAME:-opentalk}
      KC_REALM_DISPLAYNAME: ${KC_REALM_DISPLAYNAME:-opentalk}
      KEYCLOAK_CLIENT_SECRET_CONTROLLER: ${KEYCLOAK_CLIENT_SECRET_CONTROLLER:-}
      KEYCLOAK_CLIENT_SECRET_OBELISK: ${KEYCLOAK_CLIENT_SECRET_OBELISK:-}
      KEYCLOAK_CLIENT_SECRET_RECORDER: ${KEYCLOAK_CLIENT_SECRET_RECORDER:-}
      KC_TESTUSER_ENABLE: ${KC_TESTUSER_ENABLE:-true}
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
          /opt/keycloak/bin/kc.sh build
          /opt/keycloak/bin/kc.sh start --import-realm --optimized --verbose
    user: 0:0
    volumes:
      - ./config:/opt/keycloak/conf:Z
      - ./data/kc_data:/opt/keycloak/data/:Z
      - ./data/kc_provider:/opt/keycloak/providers:Z
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`${OT_DOMAIN}`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.priority=50"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/auth/health/ready -o - | grep UP"]
      start_period: 15s
      interval: 30s
      retries: 5
      timeout: 10s
    depends_on:
      cforge:
        condition: service_completed_successfully
      keycloak-db:
        condition: service_healthy