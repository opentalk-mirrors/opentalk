[package]
name = "opentalk-types-common-identifiers"
description = "Common identifier types for OpenTalk crates"
documentation = "https://docs.rs/opentalk-types-common-identifiers"
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
diesel = ["dep:diesel", "dep:opentalk-diesel-newtype", "serde"]
serde = ["dep:serde", "dep:serde_with"]
typescript = ["dep:ts-rs"]
utoipa = ["dep:serde_json", "dep:utoipa", "serde"]

[dependencies]
derive_more = { workspace = true, features = ["display"] }
diesel = { workspace = true, optional = true, features = ["with-deprecated"] }
opentalk-diesel-newtype = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
snafu.workspace = true
ts-rs = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
