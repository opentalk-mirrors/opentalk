[package]
name = "opentalk-service-auth"
description = "Authorize internal services using API-Tokens"
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
actix = ["dep:actix-web", "dep:futures", "opentalk-types-api-common/actix"]
axum = ["dep:axum", "dep:futures", "dep:tower", "opentalk-types-api-common/axum"]
default = ["jsonwebtoken/aws_lc_rs"]

[dependencies]
actix-web = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
jsonwebtoken = { workspace = true }
opentalk-types-api-common = { workspace = true, optional = true, features = ["http"] }
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
tower = { workspace = true, optional = true }

[dev-dependencies]
config.workspace = true
toml.workspace = true
