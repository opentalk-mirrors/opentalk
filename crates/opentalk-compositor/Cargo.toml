[package]
name = "opentalk-compositor"
description = "Compositor for the OpenTalk Recorder and Obelisk"
documentation = "https://docs.rs/opentalk-compositor"
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["gstreamer"]
gstreamer = ["dep:glib", "dep:gstreamer-app", "dep:gstreamer-base", "dep:gstreamer"]

[dependencies]
ab_glyph.workspace = true
anyhow.workspace = true
chrono.workspace = true
ezk.workspace = true
ezk-audio.workspace = true
ezk-audio-nodes.workspace = true
ezk-image = { workspace = true, features = ["I420", "RGBA", "RGB", "multi-thread", "resize"] }
futures.workspace = true
glib = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-base = { workspace = true, optional = true }
image = { workspace = true, features = ["png"] }
livekit.workspace = true
livekit-api.workspace = true
log.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
resvg.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
env_logger.workspace = true
livekit-api = { workspace = true, features = ["signal-client"] }
