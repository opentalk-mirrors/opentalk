[package]
name = "opentalk-client-signaling"
description = "OpenTalk Client for conference Signaling API"
documentation = "https://docs.rs/opentalk-client-signaling"
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[features]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
jsonwebtoken.workspace = true
log.workspace = true
openidconnect = { workspace = true, features = ["reqwest"] }
opentalk-roomserver-client.workspace = true
opentalk-roomserver-types.workspace = true
opentalk-roomserver-types-livekit.workspace = true
opentalk-roomserver-types-moderation.workspace = true
opentalk-roomserver-types-raise-hands.workspace = true
opentalk-roomserver-types-recording.workspace = true
opentalk-roomserver-types-transcription.workspace = true
opentalk-service-auth.workspace = true
opentalk-tracing.workspace = true
opentalk-types = { workspace = true, features = ["api", "serde", "signaling"] }
opentalk-types-api-internal.workspace = true
rand.workspace = true
reqwest12 = { workspace = true, features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
