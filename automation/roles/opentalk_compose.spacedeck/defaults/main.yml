---
# defaults file for opentalk_compose.spacedeck

spacedeck_docker_compose_project_name: "{{ compose_project_name | default('opentalk') }}"
spacedeck_docker_compose_services_state: "{{ compose_service_spacedeck_state | default('present') }}"
spacedeck_docker_compose_services_dir: "{{ services_dir }}"
spacedeck_docker_compose_project_src: "{{ deploy_dir }}"

spacedeck_docker_compose_ulimits_nofile_soft: 16384
spacedeck_docker_compose_ulimits_nofile_hard: 32768
spacedeck_docker_compose_ulimits_nproc: 4096

spacedeck_docker_image_src: registry.heinlein.group/opentalk/spacedeck

spacedeck_docker_extra_hosts: []

spacedeck_docker_environment_sd_host: 0.0.0.0
spacedeck_docker_environment_sd_port: 9666
spacedeck_docker_environment_sd_endpoint: "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}"
spacedeck_docker_environment_sd_api_token: /run/secrets/spacedeck_api_secret
spacedeck_docker_environment_sd_invite_code: /run/secrets/spacedeck_invite_secret
spacedeck_docker_environment_prefix: /whiteboard

spacedeck_docker_ports: []

spacedeck_docker_labels_traefik_enable: true
