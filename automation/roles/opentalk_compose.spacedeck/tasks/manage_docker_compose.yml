---
- name: Spacedeck Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - spacedeck include {mark}"
    block: |
      - path:
          - services/spacedeck/compose.yml
    state: "{{ 'present' if compose_service_spacedeck_enabled | bool else 'absent' }}"
  when: compose_service_spacedeck_enabled | bool


- name: Render Spacedeck compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ spacedeck_docker_compose_services_dir }}/spacedeck/compose.yml"

- name: Check if all compose includes exist
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../roles/opentalk_compose.docker_env/tasks/check_compose_includes.yml"

- name: Manage Spacedeck Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ spacedeck_docker_compose_project_src }}"
    project_name: "{{ spacedeck_docker_compose_project_name }}"
    services:
      - spacedeck
    files:
      - compose.yml
    state: "{{ spacedeck_docker_compose_services_state }}"
  when: compose_includes_ready | default(false)
