---
# handlers file for opentalk_compose.opentalk_obelisk
- name: "Restart Docker Service OpenTalk Obelisk"
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/opentalk-obelisk"
    files:
      - compose.yml
      - "{{ deploy_dir }}/common.yml"
    recreate: never
    state: restarted
  tags:
    - obelisk