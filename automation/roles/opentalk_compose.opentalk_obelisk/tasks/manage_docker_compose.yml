---
- name: OpenTalk Obelisk Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - opentalk-obelisk include {mark}"
    block: |
      - path:
          - services/opentalk-obelisk/compose.yml
    state: "{{ 'present' if compose_service_opentalk_obelisk_enabled | bool else 'absent' }}"
  when: compose_service_opentalk_obelisk_enabled | bool

- name: Render Obelisk compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ obelisk_docker_compose_services_dir }}/opentalk-obelisk/compose.yml"

- name: Manage OpenTalk Obelisk Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ obelisk_docker_compose_project_src }}"
    project_name: "{{ obelisk_docker_compose_project_name }}"
    services:
      - obelisk
    files:
      - compose.yml
    state: "{{ obelisk_docker_compose_services_state }}"
  when: compose_service_opentalk_obelisk_enabled | bool