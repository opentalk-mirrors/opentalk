---
# defaults file for opentalk_compose.livekit_server
livekit_server_docker_compose_project_name: "{{ compose_project_name | default('opentalk') }}"
livekit_server_docker_compose_services_state: "{{ compose_service_livekit_server_state | default('present') }}"
livekit_server_docker_compose_services_dir: "{{ services_dir }}"
livekit_docker_compose_project_src: "{{ deploy_dir }}"

livekit_docker_image_src: livekit/livekit-server

livekit_port: 7880
livekit_rtc_tcp_port: 7881
livekit_rtc_port_range_start: 50000
livekit_rtc_port_range_end: 64535
livekit_rtc_use_external_ip: "true"
livekit_rtc_enable_loopback_candidate: "false"
livekit_api_key_controller: "{{ LIVEKIT_API_SECRET }}"
