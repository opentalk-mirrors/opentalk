---
# handlers file for opentalk_compose.livekit_server

- name: "Restart Docker service LiveKit"
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/livekit-server"
    files:
      - compose.yml
      - "{{ deploy_dir }}/common.yml"
    recreate: never
    state: restarted