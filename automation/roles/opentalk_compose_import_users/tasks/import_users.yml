---
# Read users from file and create them in Keycloak.

# Load users from CSV
- name: Read users from CSV file
  community.general.read_csv:
    path: "{{ import_users_file }}"
  register: _import_users_csv
  when: _import_users_format == '.csv'

- name: Set user list from CSV
  ansible.builtin.set_fact:
    _import_users_list: "{{ _import_users_csv.list }}"
  when: _import_users_format == '.csv'

# Load users from JSON
- name: Read users from JSON file
  ansible.builtin.slurp:
    src: "{{ import_users_file }}"
  register: _import_users_json_raw
  when: _import_users_format == '.json'

- name: Set user list from JSON
  ansible.builtin.set_fact:
    _import_users_list: "{{ _import_users_json_raw.content | b64decode | from_json }}"
  when: _import_users_format == '.json'

# Wait for Keycloak
- name: Wait for Keycloak token endpoint to be ready
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/realms/{{ keycloak_auth_realm }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ keycloak_auth_username }}"
      password: "{{ keycloak_auth_password }}"
    status_code:
      - 200
      - 401
    return_content: false
    validate_certs: false
    timeout: 5
  register: _import_users_kc_probe
  until: _import_users_kc_probe.status in [200, 401]
  retries: 20
  delay: 5

# Fetch admin token
- name: Get Keycloak admin token
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/realms/{{ keycloak_auth_realm }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ keycloak_auth_username }}"
      password: "{{ keycloak_auth_password }}"
    return_content: true
    validate_certs: false
  register: _import_users_kc_token
  no_log: true

# Fetch user profile to get live tariff_id allowed values
- name: Fetch Keycloak user profile for realm '{{ import_users_realm }}'
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ import_users_realm }}/users/profile"
    method: GET
    headers:
      Authorization: "Bearer {{ _import_users_kc_token.json.access_token }}"
    return_content: true
    validate_certs: false
  register: _kc_user_profile

- name: Extract allowed tariff_id values from Keycloak user profile
  ansible.builtin.set_fact:
    _import_tariff_id_allowed: >-
      {{
        (
          _kc_user_profile.json.attributes
          | selectattr('name', 'equalto', 'tariff_id')
          | list
          | first
          | default({'validations': {'options': {'options': []}}})
        ).validations.options.options | default([])
      }}

# Summary
- name: Show import summary
  ansible.builtin.debug:
    msg: "Importing {{ _import_users_list | length }} user(s) into realm '{{ import_users_realm }}'."

# Pre-flight: validate tariff_id values against live Keycloak user profile
- name: Validate tariff_id values against Keycloak user profile
  ansible.builtin.assert:
    that:
      - item.tariff_id | default('') | length == 0 or item.tariff_id in _import_tariff_id_allowed
    fail_msg: >
      Invalid tariff_id '{{ item.tariff_id }}' for user '{{ item.username }}'.
      Allowed values (from Keycloak realm '{{ import_users_realm }}'): {{ _import_tariff_id_allowed | join(', ') }}.
  loop: "{{ _import_users_list }}"
  loop_control:
    label: "{{ item.username }}"
  when: _import_tariff_id_allowed | length > 0

# Enrich user list: resolve password_reset_email flag and auto-generate missing passwords.
# Users with password_reset_email=true receive a Keycloak email to set their own password;
# no initial password is set for them.
- name: Enrich user list (resolve passwords and email-flag)
  ansible.builtin.set_fact:
    _import_users_enriched: >-
      {{
        _import_users_enriched | default([]) + [
          item | combine({
            '_send_email': (true if (import_users_force_password_reset_email | default(false) | bool) else (item.password_reset_email | default(false) | bool)),
            '_password':
              item.password
              if (item.password | default('') | length > 0)
              else (
                import_users_default_password
                if (import_users_default_password | default('') | length > 0)
                else lookup('password', '/dev/null length=' ~ (import_users_password_length | default(20) | string) ~ ' chars=ascii_letters,digits')
              )
          })
        ]
      }}
  loop: "{{ _import_users_list }}"
  loop_control:
    label: "{{ item.username }}"

- name: Show auto-generated passwords for users without a password in the import file
  ansible.builtin.debug:
    msg: "Generated password for '{{ item.username }}': {{ item._password }}"
  loop: "{{ _import_users_enriched }}"
  loop_control:
    label: "{{ item.username }}"
  when: item.password | default('') | length == 0 and not item._send_email

# Create users
# - credentials and emailVerified are omitted for password_reset_email users
# - requiredActions is omitted for normal users
- name: "Create user in Keycloak"
  community.general.keycloak_user:
    auth_keycloak_url: "{{ keycloak_base_url }}"
    auth_realm: "{{ keycloak_auth_realm }}"
    auth_username: "{{ keycloak_auth_username }}"
    auth_password: "{{ keycloak_auth_password }}"
    realm: "{{ import_users_realm }}"
    username: "{{ item.username }}"
    email: "{{ item.email }}"
    firstName: "{{ item.firstName }}"
    lastName: "{{ item.lastName }}"
    enabled: "{{ item.enabled | default(import_users_enabled) | bool }}"
    emailVerified: "{{ false if item._send_email else true }}"
    credentials: >-
      {{
        omit if item._send_email
        else [{'type': 'password', 'value': item._password, 'temporary': import_users_password_temporary | bool}]
      }}
    requiredActions: "{{ ['UPDATE_PASSWORD'] if item._send_email else omit }}"
    attributes: >-
      {{
        (
          ([{'name': 'tariff_id',     'values': [item.tariff_id]}]     if (item.tariff_id     | default('') | length > 0) else [])
          + ([{'name': 'tariff_status', 'values': [item.tariff_status]}] if (item.tariff_status | default('') | length > 0) else [])
          + ([{'name': 'tenant_id',     'values': [item.tenant_id]}]     if (item.tenant_id     | default('') | length > 0) else [])
        )
      }}
    state: present
  register: _import_user_results
  loop: "{{ _import_users_enriched }}"
  loop_control:
    label: "{{ item.username }}"

# Send execute-actions-email for users that requested it.
# Keycloak sends a link allowing the user to set their own password.
- name: Send password reset email to user
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ import_users_realm }}/users/{{ item.end_state.id }}/execute-actions-email"
    method: PUT
    headers:
      Authorization: "Bearer {{ _import_users_kc_token.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body: ["UPDATE_PASSWORD"]
    status_code: 204
    validate_certs: false
  loop: "{{ _import_user_results.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  when:
    - item.item._send_email
    - item.end_state is defined
