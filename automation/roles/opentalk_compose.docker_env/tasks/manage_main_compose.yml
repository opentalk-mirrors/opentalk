---
# Render docker compose file from template

- name: Ensure compose target directory exists
  ansible.builtin.file:
    path: "{{ services_dir }}"
    state: directory

- name: Write .env from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ deploy_dir }}/.env"

- name: Write common.yml from template
  ansible.builtin.template:
    src: common.yml.j2
    dest: "{{ deploy_dir }}/common.yml"

- name: Write compose.yml from template
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ deploy_dir }}/compose.yml"
    force: false