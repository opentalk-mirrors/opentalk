---
# defaults file for opentalk_compose.mailcrab

mailcrab_docker_compose_project_name: "{{ compose_project_name | default('opentalk') }}"
mailcrab_docker_compose_services_state: "{{ compose_service_mailcrab_state | default('present') }}"
mailcrab_docker_compose_services_dir: "{{ services_dir }}"
mailcrab_docker_compose_project_src: "{{ deploy_dir }}"

mailcrab_docker_compose_ulimits_nofile_soft: 16384
mailcrab_docker_compose_ulimits_nofile_hard: 32768
mailcrab_docker_compose_ulimits_nproc: 4096

mailcrab_docker_image_src: marlonb/mailcrab
mailcrab_webui_prefix: /adm/mailcrab

mailcrab_docker_label_http_routers_minio_console_middlewares: "default-auth@file"
