---

- name: Manage Outlook Add-in docker compose changes
  tags:
    - outlook_add_in
  block:
    - name: OpenTalk Outlook Add-in Compose path include
      ansible.builtin.blockinfile:
        path: "{{ deploy_dir }}/compose.yml"
        insertafter: '^include:\\s*$'
        marker: "# Ansible managed - opentalk-outlook_add-in include {mark}"
        block: |
          - path:
              - services/opentalk-outlook_add-in/compose.yml
        state: "{{ 'present' if compose_service_opentalk_outlook_add_in_enabled | bool else 'absent' }}"
      register: _blockinfile_result

    - name: Invalidate compose includes check on blockinfile change
      ansible.builtin.set_fact:
        compose_includes_ready: false
      when: _blockinfile_result.changed

    - name: Render Outlook compose file
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ outlook_add_in_docker_compose_services_dir }}/opentalk-outlook_add-in/compose.yml"
        mode: '0644'
      when: compose_service_opentalk_outlook_add_in_enabled | bool

    - name: Check if all compose includes exist
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../roles/opentalk_compose.docker_env/tasks/check_compose_includes.yml"
      when:
        - compose_service_opentalk_outlook_add_in_enabled | bool
        - not (compose_includes_ready | default(false))

    - name: Manage OpenTalk Outlook Docker Compose state
      community.docker.docker_compose_v2:
        project_src: "{{ outlook_add_in_docker_compose_project_src }}"
        project_name: "{{ outlook_add_in_docker_compose_project_name }}"
        services:
          - outlook_add_in
        files:
          - compose.yml
        state: "{{ outlook_add_in_docker_compose_services_state }}"
      when:
        - compose_service_opentalk_outlook_add_in_enabled | bool
        - compose_includes_ready | default(false)
