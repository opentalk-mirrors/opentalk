---

- name: Ensure OpenTalk Recorder service directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ outlook_add_in_docker_compose_services_dir }}"
    - "{{ outlook_add_in_docker_compose_services_dir }}/opentalk-outlook_add-in"
  tags:
    - outlook_add_in
