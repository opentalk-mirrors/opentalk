---
- name: OpenTalk Roomserver Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - opentalk-roomserver include {mark}"
    block: |
      - path:
          - services/opentalk-roomserver/compose.yml
    state: "{{ 'present' if compose_service_opentalk_roomserver_enabled | bool else 'absent' }}"
  when: compose_service_opentalk_roomserver_enabled | bool


- name: Render Roomserver compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ roomserver_docker_compose_services_dir }}/opentalk-roomserver/compose.yml"

- name: Manage OpenTalk Roomserver Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ roomserver_docker_compose_project_src }}"
    project_name: "{{ roomserver_docker_compose_project_name }}"
    services:
      - roomserver
    files:
      - compose.yml
    state: "{{ roomserver_docker_compose_services_state }}"
