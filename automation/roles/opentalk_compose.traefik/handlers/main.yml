---
# handlers file for opentalk_compose.traefik
- name: "Restart Docker service traefik"
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/traefik"
    project_name: "{{ compose_project_name }}"
    files:
      - compose.yml
      - "{{ deploy_dir }}/common.yml"
    recreate: never
    state: restarted
  tags:
    - always

- name: "Recreate Docker service traefik"
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/traefik"
    project_name: "{{ compose_project_name }}"
    files:
      - compose.yml
      - "{{ deploy_dir }}/common.yml"
    recreate: always
    state: restarted
  tags:
    - always
