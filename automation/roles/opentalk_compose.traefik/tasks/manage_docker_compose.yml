---
- name: Traefik Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - traefik include {mark}"
    block: |
      - path:
          - services/traefik/compose.yml
    state: "{{ 'present' if compose_service_traefik_enabled | bool else 'absent' }}"
  when: compose_service_traefik_enabled | bool

- name: Render Traefik compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ traefik_docker_compose_services_dir }}/traefik/compose.yml"
  notify: Recreate Docker service traefik

- name: Manage Traefik Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_docker_compose_project_src }}"
    project_name: "{{ traefik_docker_compose_project_name }}"
    services:
      - traefik
    files:
      - compose.yml
    state: "{{ traefik_docker_compose_services_state }}"
