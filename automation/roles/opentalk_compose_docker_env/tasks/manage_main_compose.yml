---
# Render docker compose file from template

- name: Ensure compose target directory exists
  ansible.builtin.file:
    path: "{{ services_dir }}"
    mode: "0755"
    state: directory

- name: Write .env from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ deploy_dir }}/.env"
    mode: "0600"

- name: Write compose.yml from template
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ deploy_dir }}/compose.yml"
    force: "{{ docker_overwrite_main_compose_file | default(false) | bool }}"
    mode: "0644"

- name: Write common.yml from template
  ansible.builtin.template:
    src: common.yml.j2
    dest: "{{ deploy_dir }}/common.yml"
    mode: "0644"

- name: Include common.yml
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - common config include {mark}"
    block: |
      - path:
          - {{ deploy_dir }}/common.yml
    state: present
