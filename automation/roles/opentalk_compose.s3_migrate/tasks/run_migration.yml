---
# Copy all objects from the source S3 backend to the destination using rclone.
# Credentials are read from the secrets file and the rclone config is stored in
# a temp file that is always deleted after the sync, even on failure.

- name: Load secrets
  ansible.builtin.include_vars:
    file: "{{ config_dir | default('/etc/opentalk-compose') }}/secrets/secrets.yml"
    name: _s3_secrets

- name: Derive source and destination credentials
  ansible.builtin.set_fact:
    _s3_src_access_key: >-
      {{ _s3_secrets.GARAGE_S3_ACCESS_KEY if s3_migration_source == 'garage'
         else 'minioadmin' }}
    _s3_src_secret_key: >-
      {{ _s3_secrets.GARAGE_S3_SECRET_KEY if s3_migration_source == 'garage'
         else _s3_secrets.MINIO_ROOT_PASSWORD }}
    _s3_dst_access_key: >-
      {{ _s3_secrets.GARAGE_S3_ACCESS_KEY if s3_migration_destination == 'garage'
         else 'minioadmin' }}
    _s3_dst_secret_key: >-
      {{ _s3_secrets.GARAGE_S3_SECRET_KEY if s3_migration_destination == 'garage'
         else _s3_secrets.MINIO_ROOT_PASSWORD }}
  no_log: true

- name: Create temporary rclone config file
  ansible.builtin.tempfile:
    suffix: "-rclone-migrate.conf"
  register: _rclone_conf_tmp

- name: Run rclone sync and clean up config
  block:
    - name: Write rclone config
      ansible.builtin.copy:
        dest: "{{ _rclone_conf_tmp.path }}"
        mode: '0600'
        content: |
          [source]
          type = s3
          provider = {{ 'Other' if s3_migration_source == 'garage' else 'Minio' }}
          endpoint = {{ s3_migrate_source_endpoint }}
          access_key_id = {{ _s3_src_access_key }}
          secret_access_key = {{ _s3_src_secret_key }}
          region = {{ 'garage' if s3_migration_source == 'garage' else '' }}
          force_path_style = true

          [dest]
          type = s3
          provider = {{ 'Other' if s3_migration_destination == 'garage' else 'Minio' }}
          endpoint = {{ s3_migrate_dest_endpoint }}
          access_key_id = {{ _s3_dst_access_key }}
          secret_access_key = {{ _s3_dst_secret_key }}
          region = {{ 'garage' if s3_migration_destination == 'garage' else '' }}
          force_path_style = true
      no_log: true

    - name: Sync objects from source to destination
      ansible.builtin.command:
        cmd: >-
          rclone sync
          --config {{ _rclone_conf_tmp.path }}
          --progress
          --stats-one-line
          source:{{ s3_migrate_bucket_name }}
          dest:{{ s3_migrate_bucket_name }}
      register: _rclone_sync
      changed_when: "'Transferred:' in _rclone_sync.stdout"

    - name: Show rclone sync output
      ansible.builtin.debug:
        var: _rclone_sync.stdout_lines

    - name: Verify object count matches
      ansible.builtin.command:
        cmd: "rclone ls --config {{ _rclone_conf_tmp.path }} {{ item }}:{{ s3_migrate_bucket_name }}"
      register: _rclone_ls
      changed_when: false
      loop:
        - source
        - dest
      loop_control:
        label: "{{ item }}"

    - name: Assert source and destination object counts match
      ansible.builtin.assert:
        that:
          - _rclone_ls.results[0].stdout_lines | length == _rclone_ls.results[1].stdout_lines | length
        fail_msg: >-
          Object count mismatch after sync!
          Source has {{ _rclone_ls.results[0].stdout_lines | length }} objects,
          destination has {{ _rclone_ls.results[1].stdout_lines | length }} objects.
          Re-run 'otctl migrate' to retry.

  always:
    - name: Delete rclone config (ensure no credentials on disk)
      ansible.builtin.file:
        path: "{{ _rclone_conf_tmp.path }}"
        state: absent
      no_log: true
