---
# Run 'otctl deploy' after migration to stop the source service container
# and reconfigure the controller to point at the new S3 backend.

- name: Notify about post-migration deploy
  ansible.builtin.debug:
    msg: >-
      Running deployment to stop '{{ s3_migration_source }}' container and
      reconfigure OpenTalk to use '{{ s3_migration_destination }}' as S3 backend.

- name: Run deployment playbook
  ansible.builtin.command:
    cmd: >-
      {{ lookup('env', 'OT_PREFIX') | default('/opt/opentalk-compose', true)
      }}/bin/ot-ansible-playbook
      -i {{ lookup('env', 'OT_PREFIX') | default('/opt/opentalk-compose', true) }}/automation/inventory.yml
      {{ lookup('env', 'OT_PREFIX') | default('/opt/opentalk-compose', true) }}/automation/playbooks/opentalk_compose.yml
      --diff
  register: _post_deploy
  changed_when: "'changed=' in _post_deploy.stdout"

- name: Show deployment output
  ansible.builtin.debug:
    var: _post_deploy.stdout_lines
  when: _post_deploy.stdout_lines is defined
