---
# defaults file for opentalk_compose.opentalk_controller
#
# NOTE! The values defined here are defaults and will be overwritten on package
# updates. Custom values should therefore not be set here, but in
# /etc/opentalk-compose/settings.yml instead.

controller_docker_compose_project_name: "{{ compose_project_name | default('opentalk') }}"
controller_docker_compose_services_state: "{{ compose_service_opentalk_controller_state | default('present') }}"
controller_docker_compose_services_dir: "{{ services_dir }}"
controller_docker_compose_project_src: "{{ deploy_dir }}"

controller_docker_compose_ulimits_nofile_soft: 65536
controller_docker_compose_ulimits_nofile_hard: 65536
controller_docker_compose_ulimits_nproc: 8192

controller_db_docker_compose_ulimits_nofile_soft: 65536
controller_db_docker_compose_ulimits_nofile_hard: 65536
controller_db_docker_compose_ulimits_nproc: 8192
controller_db_host_port: 5432
controller_db_bind_interface: "127.0.0.1"

controller_docker_image_src: registry.heinlein.group/opentalk/controller
postgres_docker_image_src: registry.heinlein.group/opentalk/postgres
controller_docker_extra_hosts:
  - host.docker.internal:host-gateway

controller_roomserver_kind: "external"

controller_frontend_base_url: "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}"
# controller_operator_information_data_protection_url: "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/data-protection"
# controller_operator_information_support_phone_number: "+49 123 4567890"
# controller_operator_information_support_email_address: "support@{{ ot_domain }}"
controller_logging_default_directives:
  - "ERROR"
  - "opentalk=INFO"
  - "pinky_swear=OFF"
  - "rustls=WARN"
  - "mio=ERROR"
  - "lapin=WARN"
  - "execution_id=trace"
# controller_logging_otlp_tracing_endpoint: "http://localhost:4317"
# controller_logging_service_name: "controller"
# controller_logging_service_namespace: "opentalk"
# controller_logging_service_instance_id: "627cc493-f310-47de-96bd-71410b7dec09"
controller_database_name: controller
controller_database_user: ot
controller_database_password: "{{ CONTROLLER_DB_PASSWORD }}"
controller_database_host: controller-db
controller_database_port: 5432
# controller_database_max_connections: 100
controller_monitoring_port: 11411
# controller_monitoring_addr: "0.0.0.0"
controller_http_port: 11311
# controller_http_addr: "::0"
# controller_http_cors_allowed_origin: ["*"]
# controller_http_service_api_keys:
#   - id: "controller"
#     secret: "secret"
controller_oidc_authority: "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}"
controller_oidc_frontend_client_id: "Frontend"
# controller_oidc_frontend_authority: "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}"
controller_oidc_controller_client_id: "Controller"
controller_oidc_controller_client_secret: "{{ OIDC_CONTROLLER_CLIENT_SECRET }}"
# controller_oidc_controller_authority: "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}"
controller_user_search_backend: "keycloak_webapi"
controller_user_search_api_base_url: "{{ keycloak_api_base_url }}"
controller_user_search_users_find_behavior: "from_user_search_backend"
# controller_user_search_client_id: "Controller"
# controller_user_search_client_secret: "{{ OIDC_CONTROLLER_CLIENT_SECRET }}"
controller_livekit_public_url: "wss://{{ (ot_domain, ot_ingress_port) | build_host }}/livekit"
controller_livekit_service_url: "http://host.docker.internal:7880"
controller_livekit_api_key: "controller"
controller_livekit_api_secret: "{{ LIVEKIT_API_SECRET }}"
controller_rabbit_mq_url: "amqp://ot:{{ RABBITMQ_PASSWORD }}@rabbitmq/%2F"
controller_rabbit_mq_mail_task_queue: "opentalk_mailer"
controller_rabbit_mq_recording_task_queue: "opentalk_recorder"
controller_rabbit_mq_min_connections: 10
controller_rabbit_mq_max_channels_per_connection: 100
# controller_redis_url: "redis://localhost:6379/"
# controller_authz_synchronize_controllers: "true"
# controller_call_in_tel: "03012345678"
# controller_call_in_enable_phone_mapping: "false"
# controller_call_in_default_country_code: "DE"
controller_minio_uri: "{{ 'http://garage:3900' if (s3_storage_provider | default('garage')) == 'garage' else 'http://minio:9000' }}"
controller_minio_bucket: "opentalk"
controller_minio_access_key: "{{ GARAGE_S3_ACCESS_KEY if (s3_storage_provider | default('garage')) == 'garage' else 'minioadmin' }}"
controller_minio_secret_key: "{{ GARAGE_S3_SECRET_KEY if (s3_storage_provider | default('garage')) == 'garage' else MINIO_ROOT_PASSWORD }}"
# controller_etcd_urls:
#   - "etcd:2379"
controller_etherpad_url: "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/etherpad/"
controller_etherpad_api_key: "{{ ETHERPAD_API_KEY }}"
controller_spacedeck_url: "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/whiteboard/"
controller_spacedeck_api_key: "{{ SPACEDECK_API_KEY }}"
# controller_reports_template_inline: |
