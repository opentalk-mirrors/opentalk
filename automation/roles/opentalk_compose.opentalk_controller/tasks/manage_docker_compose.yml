---
- name: OpenTalk Controller Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - opentalk-controller include {mark}"
    block: |
      - path:
          - services/opentalk-controller/compose.yml
    state: "{{ 'present' if compose_service_opentalk_controller_enabled | bool else 'absent' }}"
  when: compose_service_opentalk_controller_enabled | bool


- name: Render Controller compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ controller_docker_compose_services_dir }}/opentalk-controller/compose.yml"

- name: Manage OpenTalk Controller Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ controller_docker_compose_project_src }}"
    project_name: "{{ controller_docker_compose_project_name }}"
    services:
      - controller
      - controller-db
    files:
      - compose.yml
    state: "{{ controller_docker_compose_services_state }}"