---
# handlers file for opentalk_compose.opentalk_controller
- name: "Restart Docker Service OpenTalk Controller"
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/opentalk-controller"
    files:
      - compose.yml
    recreate: never
    state: restarted