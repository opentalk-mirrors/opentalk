---
# Restore the Keycloak database from an explicit SQL dump file.
# Set keycloak_db_dump_restore_file (e.g. via 'otctl restore keycloak-db').
# The Keycloak app container is stopped for the duration of the restore.

- name: Restore Keycloak DB from dump
  tags:
    - restore
    - keycloak_db_restore
    - never
  block:
    - name: Assert restore confirmation
      ansible.builtin.assert:
        that:
          - restore_confirmation | default('') | string | lower == 'yes'
        fail_msg: >-
          Destructive restore requested without confirmation.
          Pass 'restore_confirmation=yes' or use 'otctl restore', which asks for confirmation.

    - name: Check Keycloak DB restore dump file is provided
      ansible.builtin.assert:
        that:
          - keycloak_db_dump_restore_file | length > 0
        fail_msg: "keycloak_db_dump_restore_file must be set to a .sql dump (e.g. 'otctl restore keycloak-db <file>') or use 'otctl restore keycloak-db' for the latest dump."

    - name: Check Keycloak DB restore dump file exists
      ansible.builtin.stat:
        path: "{{ keycloak_db_dump_restore_file }}"
      register: _keycloak_db_restore_stat

    - name: Assert Keycloak DB restore dump file exists
      ansible.builtin.assert:
        that:
          - _keycloak_db_restore_stat.stat.exists
        fail_msg: "Keycloak DB dump not found: {{ keycloak_db_dump_restore_file }}"

    - name: Stop Keycloak app container
      ansible.builtin.command:
        cmd: docker stop "{{ keycloak_docker_compose_project_name }}-keycloak-1"
      register: _keycloak_db_restore_stop
      failed_when: false
      changed_when: _keycloak_db_restore_stop.rc == 0 and _keycloak_db_restore_stop.stdout | length > 0

    - name: Restore Keycloak DB from dump
      ansible.builtin.shell: |
        set -euo pipefail
        cat "{{ keycloak_db_dump_restore_file }}" | docker run --rm -i \
          --network {{ docker_network_name | quote }} \
          -e PGPASSWORD="$PGPASSWORD" \
          {{ (postgres_docker_image_src ~ ':' ~ postgres_version) | quote }} \
          psql -v ON_ERROR_STOP=1 --single-transaction \
          -h {{ keycloak_db_host | quote }} \
          -p {{ keycloak_db_port | quote }} \
          -U {{ keycloak_db_user | quote }} \
          -d {{ keycloak_db_name | quote }}
      environment:
        PGPASSWORD: "{{ keycloak_db_password }}"
      changed_when: true

    - name: Start Keycloak app container
      ansible.builtin.command:
        cmd: docker start "{{ keycloak_docker_compose_project_name }}-keycloak-1"
      register: _keycloak_db_restore_start
      failed_when: false
      changed_when: _keycloak_db_restore_start.rc == 0 and _keycloak_db_restore_start.stdout | length > 0

    - name: Show Keycloak DB restore result
      ansible.builtin.debug:
        msg: "Keycloak DB restored from {{ keycloak_db_dump_restore_file }} (app container stopped/started around restore)."
