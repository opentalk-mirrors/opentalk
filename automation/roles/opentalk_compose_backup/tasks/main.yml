---
# Main task file for role: opentalk_compose_backup

- name: Include controller DB dump tasks
  ansible.builtin.import_tasks: dump_controller_db.yml
  tags:
    - backup
    - controller_db_dump
    - never

- name: Include keycloak DB dump tasks
  ansible.builtin.import_tasks: dump_keycloak_db.yml
  tags:
    - backup
    - keycloak_db_dump
    - never

- name: Include config backup tasks
  ansible.builtin.import_tasks: backup_config.yml
  tags:
    - backup
    - config_backup
    - never

- name: Include docker volumes backup tasks
  ansible.builtin.import_tasks: backup_docker_volumes.yml
  tags:
    - backup
    - docker_volumes_backup
    - never

- name: Include retention cleanup tasks
  ansible.builtin.import_tasks: retention.yml
  tags:
    - backup
    - backup_retention
    - never

- name: Include config restore tasks
  ansible.builtin.import_tasks: restore_config.yml
  tags:
    - restore
    - config_restore
    - never

- name: Include controller DB restore tasks
  ansible.builtin.import_tasks: restore_dump_controller_db.yml
  tags:
    - restore
    - controller_db_restore
    - never

- name: Include keycloak DB restore tasks
  ansible.builtin.import_tasks: restore_dump_keycloak_db.yml
  tags:
    - restore
    - keycloak_db_restore
    - never

- name: Include docker volumes restore tasks
  ansible.builtin.import_tasks: restore_docker_volumes.yml
  tags:
    - restore
    - docker_volumes_restore
    - never
