---
- name: OpenTalk Orchestrator Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - opentalk-orchestrator include {mark}"
    block: |
      - path:
          - services/opentalk-orchestrator/compose.yml
    state: "{{ 'present' if compose_service_opentalk_orchestrator_enabled | bool else 'absent' }}"
  when: compose_service_opentalk_orchestrator_enabled | bool


- name: Render Orchestrator compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ orchestrator_docker_compose_services_dir }}/opentalk-orchestrator/compose.yml"

- name: Manage OpenTalk Orchestrator Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ orchestrator_docker_compose_project_src }}"
    project_name: "{{ orchestrator_docker_compose_project_name }}"
    services:
      - orchestrator
    files:
      - compose.yml
    state: "{{ orchestrator_docker_compose_services_state }}"
