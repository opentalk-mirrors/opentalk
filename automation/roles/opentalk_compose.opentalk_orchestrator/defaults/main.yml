---
# defaults file for opentalk_compose.orchestrator
#
# NOTE! The values defined here are defaults and will be overwritten on package
# updates. Custom values should therefore not be set here, but in
# /etc/opentalk-compose/settings.yml instead.

orchestrator_docker_compose_project_name: "{{ compose_project_name | default('opentalk') }}"
orchestrator_docker_compose_services_state: "{{ compose_service_opentalk_orchestrator_state | default('present') }}"
orchestrator_docker_compose_services_dir: "{{ services_dir }}"
orchestrator_docker_compose_project_src: "{{ deploy_dir }}"

orchestrator_docker_compose_ulimits_nofile_soft: 65536
orchestrator_docker_compose_ulimits_nofile_hard: 65536
orchestrator_docker_compose_ulimits_nproc: 8192

orchestrator_docker_image_src: git.opentalk.dev:5050/opentalk/backend/services/orchestrator

orchestrator_public_url: "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}"

orchestrator_http_port: 11222
orchestrator_http_address: "0.0.0.0"
orchestrator_api_key_id: "orchestrator"
orchestrator_services_key_id: "roomserver"

orchestrator_logging_default_directives: "orchestrator=info"
