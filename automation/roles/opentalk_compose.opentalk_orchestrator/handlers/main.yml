---
# handlers file for opentalk_compose.opentalk_orchestrator

- name: "Restart Docker Service OpenTalk Orchestrator"
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/opentalk-orchestrator"
    project_name: "{{ compose_project_name }}"
    files:
      - compose.yml
      - "{{ deploy_dir }}/common.yml"
    recreate: never
    state: restarted
