---
- name: Manage Keycloak Realm
  when:
    - keycloak_manage_enabled is true
  block:
    - name: Wait for Keycloak to be reachable
      ansible.builtin.uri:
        url: "{{ keycloak_health_url }}"
        method: GET
        status_code: 200
        return_content: false
        validate_certs: false
      register: keycloak_healthcheck
      until: keycloak_healthcheck.status == 200
      retries: 18
      delay: 10

    - name: Get Keycloak admin access token
      ansible.builtin.uri:
        url: "{{ keycloak_base_url }}/realms/master/protocol/openid-connect/token"
        method: POST
        body:
          grant_type: password
          client_id: admin-cli
          username: "{{ keycloak_auth_username }}"
          password: "{{ keycloak_auth_password }}"
        body_format: form-urlencoded
        return_content: true
        status_code: 200
      register: keycloak_token_response
      until: keycloak_token_response.status == 200
      retries: 15
      delay: 5

    - name: Set Keycloak admin token fact
      set_fact:
        keycloak_token: "{{ keycloak_token_response.json.access_token }}"

    - name: Configure keycloak realm | {{ keycloak_realm }}
      ansible.builtin.include_tasks: keycloak_realm.yml

    - name: Configure keycloak client scopes | {{ keycloak_realm }}
      ansible.builtin.include_tasks: keycloak_client_scopes.yml

    - name: Configure keycloak user profile | {{ keycloak_realm }}
      ansible.builtin.include_tasks: keycloak_user_profile.yml

    - name: "Manage Keycloak client {{ controller_oidc_controller_client_id | default('Controller') }}"
      ansible.builtin.include_tasks: keycloak_oidc_client_backend.yml

    - name: "Manage Keycloak client {{ controller_oidc_frontend_client_id | default('Frontend') }}"
      ansible.builtin.include_tasks: keycloak_oidc_client_frontend.yml

    - name: "Manage Keycloak client {{ obelisk_auth_client_id | default('Obelisk') }}"
      ansible.builtin.include_tasks: keycloak_oidc_client_obelisk.yml

    - name: "Manage Keycloak client {{ recorder_auth_client_id | default('Recorder') }}"
      ansible.builtin.include_tasks: keycloak_oidc_client_recorder.yml

    - name: "Manage roles for realm {{ OPENTALK_REALM | default('master') }}"
      ansible.builtin.include_tasks: keycloak_realm_roles.yml

    - name: "Manage Keycloak client {{ outlook_add_in_oidc_client_id | default('OutlookAddin') }}"
      ansible.builtin.include_tasks: keycloak_oidc_client_outlook.yml
