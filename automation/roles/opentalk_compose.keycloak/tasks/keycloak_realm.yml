---
# Check if realm exists first
- name: Check if Keycloak realm exists
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm }}"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
    status_code: [200, 404]
  register: realm_check

# Create realm only if it doesn't exist (minimal config, no timeouts)
- name: Create Keycloak realm if not exists
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      realm: "{{ keycloak_realm }}"
      enabled: true
      loginTheme: "opentalk"
    status_code: [201]
  when: realm_check.status == 404

# Reset client session timeouts before updating realm to avoid validation errors
# (Keycloak 26.5+ requires client timeouts <= realm SSO timeouts)
- name: Get all clients in realm
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm }}/clients?max=1000"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
    return_content: true
  register: realm_clients

- name: Reset client session timeouts to inherit from realm
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm }}/clients/{{ item.id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
      Content-Type: "application/json"
    body_format: json
    body: |
      {{
        item | combine({
          "attributes": (item.attributes | default({}) | combine({
            "client.session.idle.timeout": "0",
            "client.session.max.lifespan": "0"
          }))
        })
      }}
    status_code: [200, 204]
  loop: "{{ realm_clients.json }}"
  loop_control:
    label: "{{ item.clientId }}"
  when: >
    (item.attributes['client.session.idle.timeout'] | default('0') | int > keycloak_realm_sso_session_idle_timeout) or
    (item.attributes['client.session.max.lifespan'] | default('0') | int > keycloak_realm_sso_session_max_lifespan)

- name: Get current realm config
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm }}"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
    return_content: true
  register: realm_config

- name: Update realm config with all settings
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
      Content-Type: "application/json"
    body_format: json
    body: |
      {{
        (realm_config.json | combine({
          "displayNameHtml": '<div class="kc-logo-text"><span>OpenTalk</span></div>',
          "ssoSessionIdleTimeout": keycloak_realm_sso_session_idle_timeout,
          "ssoSessionMaxLifespan": keycloak_realm_sso_session_max_lifespan,
          "offlineSessionIdleTimeout": keycloak_realm_offline_session_idle_timeout,
          "offlineSessionMaxLifespan": keycloak_realm_offline_session_max_lifespan,
          "offlineSessionMaxLifespanEnabled": keycloak_realm_offline_session_max_lifespan_enabled,
          "clientSessionIdleTimeout": keycloak_realm_client_session_idle_timeout,
          "clientSessionMaxLifespan": keycloak_realm_client_session_max_lifespan,
          "attributes": (realm_config_json_attributes | default({}) | combine({
            "_browser_header_contentSecurityPolicy": "frame-src 'self'; frame-ancestors 'self' " ~ ((ot_ingress_protocol, ot_domain) | build_url) ~ ":* " ~ ((ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url) ~ " " ~ ((ot_ingress_protocol, ot_domain, ot_ingress_port) | build_wildcard_url) ~ "; object-src 'none';",
            "_browser_header_xContentTypeOptions": "nosniff",
            "_browser_header_xRobotsTag": "none",
            "_browser_header_xFrameOptions": "DENY",
            "_browser_header_contentSecurityPolicyReportOnly": "",
            "_browser_header_xXSSProtection": "1; mode=block",
            "_browser_header_strictTransportSecurity": "max-age=31536000; includeSubDomains"
          }))
        }))
      }}
    status_code: [200, 204]
