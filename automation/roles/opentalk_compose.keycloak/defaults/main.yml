---
keycloak_docker_compose_project_name: "{{ compose_project_name | default('opentalk') }}"
keycloak_docker_compose_services_state: "{{ compose_service_keycloak_state | default('present') }}"
keycloak_docker_compose_services_dir: "{{ services_dir }}"
keycloak_docker_compose_project_src: "{{ deploy_dir }}"

keycloak_docker_image_src: quay.io/keycloak/keycloak
postgres_docker_image_src: postgres

keycloak_docker_compose_state: present

keycloak_wait_to_be_reachable_retries: 20
keycloak_wait_to_be_reachable_delay: 10

postInstall_demoUser_state: "present"
postInstall_demoUser_enabled: "True"
postInstall_demoUser_name: "demo"
postInstall_demoUser_password: "{{ DEMO_USER_PASSWORD }}"
postInstall_demoUser_email: "demo.user@example.com"
postInstall_demoUser_firstName: "Test"
postInstall_demoUser_lastName: "User"

## Only useful when running keycloak on localhost
keycloak_local_hostname: ''
keycloak_local_port: "{{ ot_ingress_port }}"

keycloak_manage_enabled: true

keycloak_bootstrap_admin_username: bootstrap_admin
keycloak_bootstrap_admin_password: "{{ KC_BOOTSTRAP_ADMIN_PASSWORD }}"
# Whether to remove the bootstrap admin automatically after permanent admin exists
keycloak_bootstrap_admin_remove: true

keycloak_permanent_admin_username: "admin"
keycloak_permanent_admin_password: "{{ KC_PERMANENT_ADMIN_PASSWORD }}"
keycloak_permanent_admin_email: "admin@{{ ot_domain | default('localhost') }}"
keycloak_permanent_admin_firstname: "Keycloak"
keycloak_permanent_admin_lastname: "Administrator"

keycloak_auth_username: "{{ keycloak_permanent_admin_username }}"
keycloak_auth_password: "{{ keycloak_permanent_admin_password }}"
keycloak_auth_realm: master
keycloak_realm: "opentalk"
keycloak_login_theme: "opentalk"
keycloak_account_theme: "opentalk"
keycloak_base_url: "{{ (ot_ingress_protocol, keycloak_local_hostname, ot_domain, keycloak_local_port) | build_subdomain_url }}/auth"
keycloak_api_base_url: "{{ (ot_ingress_protocol, keycloak_local_hostname, ot_domain, keycloak_local_port) | build_subdomain_url }}/auth/admin/realms/{{ keycloak_realm }}"
keycloak_hostname: "{{ (ot_ingress_protocol, keycloak_local_hostname, ot_domain, keycloak_local_port) | build_subdomain_url }}/auth"
keycloak_proxy: edge
keycloak_proxy_headers: xforwarded
keycloak_db_vendor: postgres
keycloak_db_username: ot
keycloak_db_password: "{{ KEYCLOAK_DB_PASSWORD }}"
keycloak_db_schema: public
keycloak_db_url_database: keycloak
keycloak_db_url_host: keycloak-db
keycloak_db_url_port: 5432
keycloak_health_enabled: "true"
keycloak_metrics_enabled: "true"
keycloak_health_url: "{{ keycloak_base_url }}/realms/{{ keycloak_auth_realm }}/.well-known/openid-configuration"
keycloak_http_relative_path: /auth
keycloak_spi_sticky_session_encoder_infinispan_should_attach_route: "false"
keycloak_redirectUris_uris:
  - "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/auth/popup_callback"
  - "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/auth/callback"
  - "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/dashboard"
  - "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/dashboard/*"
  - "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/room/*"
  - "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/join"
  - "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/"
