---
# tasks file for opentalk_compose_s3_migrate

- name: Include validate.yml
  ansible.builtin.include_tasks:
    file: validate.yml
  tags: [s3_migrate_logic]

- name: Include install_rclone.yml
  ansible.builtin.include_tasks:
    file: install_rclone.yml
  tags: [s3_migrate_integration]

- name: Include run_migration.yml
  ansible.builtin.include_tasks:
    file: run_migration.yml
  tags: [s3_migrate_integration]

- name: Include update_settings.yml
  ansible.builtin.include_tasks:
    file: update_settings.yml
  tags: [s3_migrate_logic]

- name: Include post_deploy.yml
  ansible.builtin.include_tasks:
    file: post_deploy.yml
  when: s3_migrate_run_deploy | bool
  tags: [s3_migrate_integration]
