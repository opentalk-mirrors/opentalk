---
- name: Stop and remove Garage container when disabled
  community.docker.docker_container:
    name: "{{ garage_docker_compose_project_name }}-garage-1"
    state: absent
  when: not (compose_service_garage_enabled | bool)

- name: Garage Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - garage include {mark}"
    block: |
      - path:
          - services/garage/compose.yml
    state: "{{ 'present' if compose_service_garage_enabled | bool else 'absent' }}"


- name: Render Garage compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ garage_docker_compose_services_dir }}/garage/compose.yml"
    mode: "0644"
  when: compose_service_garage_enabled | bool

- name: Manage Garage Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ garage_docker_compose_project_src }}"
    project_name: "{{ garage_docker_compose_project_name }}"
    services:
      - garage
    files:
      - compose.yml
    state: "{{ garage_docker_compose_services_state }}"
  when: compose_service_garage_enabled | bool
