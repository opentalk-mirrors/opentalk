---

- name: Ensure MinIO Service directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ rabbitmq_docker_compose_services_dir }}"
    - "{{ rabbitmq_docker_compose_services_dir }}/rabbitmq"
    - "{{ rabbitmq_docker_compose_services_dir }}/rabbitmq/config"

- name: "Render RabbitMQ static config | {{ rabbitmq_docker_compose_services_dir }}/rabbitmq/config/rabbitmq.conf"
  ansible.builtin.template:
    src: rabbitmq.conf.j2
    dest: "{{ rabbitmq_docker_compose_services_dir }}/rabbitmq/config/rabbitmq.conf"
    mode: 0644
  notify: Restart Docker service RabbitMQ