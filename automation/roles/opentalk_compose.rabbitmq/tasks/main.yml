---
# tasks file for opentalk_compose.rabbitmq

- name: Include manage_rabbitmq_config.yml
  ansible.builtin.include_tasks:
    file: manage_rabbitmq_config.yml
  when: compose_service_rabbitmq_enabled | bool

- name: Include manage_docker_compose.yml
  ansible.builtin.include_tasks:
    file: manage_docker_compose.yml
  when: compose_service_rabbitmq_enabled | bool
