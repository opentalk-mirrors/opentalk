- name: "Secrets file check presence | {{ config_dir }}/secrets/secrets.yml"
  ansible.builtin.stat: 
    path: "{{ config_dir }}/secrets/secrets.yml"
  register: result_secrets_file
  tags:
    - always

- name: Generate secrets
  block:
    - ansible.builtin.set_fact:
        CONTROLLER_DB_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        KEYCLOAK_DB_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        KC_BOOTSTRAP_ADMIN_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        KC_PERMANENT_ADMIN_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        OIDC_FRONTEND_CLIENT_SECRET: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        OIDC_CONTROLLER_CLIENT_SECRET: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        OIDC_RECORDER_CLIENT_SECRET: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        OIDC_OBELISK_CLIENT_SECRET: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        LIVEKIT_API_SECRET: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        SPACEDECK_API_KEY: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        SPACEDECK_INVITE_CODE: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        ETHERPAD_API_KEY: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        RABBITMQ_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        RABBITMQ_ERLANG_COOKIE: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        MINIO_ROOT_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        MINIO_ACC_KEY: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        MINIO_SECRET_KEY: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        DEMO_USER_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        TRAEFIK_DASHBOARD_ADMIN_PASSWORD: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
        TRAEFIK_DASHBOARD_ADMIN_PASSWORD_SALT: "{{ lookup('password', '/dev/null length=22 chars=ascii_letters,digits') }}"
    
    - name: "Init secrets file | config/secrets/secrets.yml"
      ansible.builtin.template:
        src: secrets.yml.j2
        dest: "{{ config_dir }}/secrets/secrets.yml"
        force: "{{ force_generate_secrets }}"
        mode: 0600
  when: (result_secrets_file.stat.exists == False) or (force_generate_secrets == True)
  tags:
    - always

- name: "Secrets file check presence | {{ config_dir }}/secrets/secrets.yml"
  ansible.builtin.stat: 
    path: "{{ config_dir }}/secrets/secrets.yml"
  register: result_secrets_file
  tags:
    - always

- name: "Read secrets from file | config/secrets/secrets.yml"
  ansible.builtin.include_vars:
    file: "{{ config_dir }}/secrets/secrets.yml"
  when: result_secrets_file.stat.exists == True
  tags:
    - always

- name: "Manage secret files for containers | config/secrets/.*.secret"
  ansible.builtin.template:
    src: container_secret.j2
    dest: "{{ config_dir }}/secrets/.{{ item.name }}.secret"
    mode: 0600
  vars:
    secret: "{{ item.secret }}"
  loop:
    - { name: "db_controller", secret: "{{ CONTROLLER_DB_PASSWORD }}" }
    - { name: "db_keycloak", secret: "{{ KEYCLOAK_DB_PASSWORD }}" }
    - { name: "minio_root", secret: "{{ MINIO_ROOT_PASSWORD }}" }
    - { name: "spacedeck_api", secret: "{{ SPACEDECK_API_KEY }}" }
    - { name: "spacedeck_invite", secret: "{{ SPACEDECK_INVITE_CODE }}" }
    - { name: "etherpad_api", secret: "{{ ETHERPAD_API_KEY }}" }
    - { name: "rabbitmq_default", secret: "{{ RABBITMQ_PASSWORD }}" }
  no_log: true
