---
- name: Ensure secrets directory exists
  ansible.builtin.file:
    path: "{{ config_dir }}/secrets"
    state: directory
    mode: '0700'

- name: Check if secrets.yml exists
  ansible.builtin.stat:
    path: "{{ config_dir }}/secrets/secrets.yml"
  register: secrets_file_stat

- name: Load existing secrets if present
  ansible.builtin.include_vars:
    file: "{{ config_dir }}/secrets/secrets.yml"
    name: existing_secrets
  when: secrets_file_stat.stat.exists

- name: Define required secret keys with lengths
  ansible.builtin.set_fact:
    required_secret_keys:
      # KEY NAME: SECRET LENGTH
      CONTROLLER_DB_PASSWORD: 32
      KEYCLOAK_DB_PASSWORD: 32
      KC_BOOTSTRAP_ADMIN_PASSWORD: 32
      KC_PERMANENT_ADMIN_PASSWORD: 32
      OIDC_FRONTEND_CLIENT_SECRET: 32
      OIDC_CONTROLLER_CLIENT_SECRET: 32
      OIDC_RECORDER_CLIENT_SECRET: 32
      OIDC_OBELISK_CLIENT_SECRET: 32
      ROOMSERVER_API_SECRET: 32
      CONTROLLER_API_SECRET: 32
      LIVEKIT_API_SECRET: 32
      LIVEKIT_E2EE_SALT: 22
      SPACEDECK_API_KEY: 32
      SPACEDECK_INVITE_CODE: 32
      ETHERPAD_API_KEY: 32
      RABBITMQ_PASSWORD: 32
      RABBITMQ_ERLANG_COOKIE: 32
      MINIO_ROOT_PASSWORD: 32
      MINIO_ACC_KEY: 32
      MINIO_SECRET_KEY: 32
      GARAGE_ADMIN_TOKEN: 32
      DEMO_USER_PASSWORD: 32
      TRAEFIK_DASHBOARD_ADMIN_PASSWORD: 32
      TRAEFIK_DASHBOARD_ADMIN_PASSWORD_SALT: 16

- name: Initialize merged_secrets from existing (or empty dict)
  ansible.builtin.set_fact:
    merged_secrets: "{{ existing_secrets | default({}) }}"

- name: Determine missing secret keys
  ansible.builtin.set_fact:
    _missing_secret_keys: >-
      {{ required_secret_keys | dict2items
         | rejectattr('key', 'in', merged_secrets.keys() | list)
         | list }}

- name: Add generated secrets for missing keys (do not overwrite existing)
  ansible.builtin.set_fact:
    merged_secrets: >
      {{ merged_secrets |
         combine({ item.key:
           lookup('password', '/dev/null length=' ~ item.value ~ ' chars=ascii_letters,digits')
         })
      }}
  loop: "{{ _missing_secret_keys }}"
  when: _missing_secret_keys | length > 0
  no_log: true

- name: Generate GARAGE_RPC_SECRET as hex if missing
  ansible.builtin.set_fact:
    merged_secrets: >-
      {{ merged_secrets |
         combine({'GARAGE_RPC_SECRET':
           lookup('password', '/dev/null length=64 chars=hexdigits') | lower
         })
      }}
  when: merged_secrets.get('GARAGE_RPC_SECRET') is none
  no_log: true

- name: Write updated secrets.yml
  ansible.builtin.copy:
    dest: "{{ config_dir }}/secrets/secrets.yml"
    mode: '0600'
    content: |
      # !!! DO NOT EDIT THIS FILE BY HAND !!!
      # This configuration file is managed by ansible. Changes will be overwritten.

      {{ merged_secrets | to_nice_yaml(indent=2) }}
  no_log: true

- name: Load final secrets into variables
  ansible.builtin.include_vars:
    file: "{{ config_dir }}/secrets/secrets.yml"

- name: Manage secret files for containers | {{ config_dir }}/secrets/.*.secret
  ansible.builtin.template:
    src: container_secret.j2
    dest: "{{ config_dir }}/secrets/.{{ item.name }}.secret"
    mode: '0600'
  vars:
    secret: "{{ item.secret }}"
  loop:
    - {name: "db_controller", secret: "{{ CONTROLLER_DB_PASSWORD }}"}
    - {name: "db_keycloak", secret: "{{ KEYCLOAK_DB_PASSWORD }}"}
    - {name: "minio_root", secret: "{{ MINIO_ROOT_PASSWORD }}"}
    - {name: "spacedeck_api", secret: "{{ SPACEDECK_API_KEY }}"}
    - {name: "spacedeck_invite", secret: "{{ SPACEDECK_INVITE_CODE }}"}
    - {name: "etherpad_api", secret: "{{ ETHERPAD_API_KEY }}"}
    - {name: "rabbitmq_default", secret: "{{ RABBITMQ_PASSWORD }}"}
    - {name: "garage_rpc", secret: "{{ GARAGE_RPC_SECRET }}"}
    - {name: "garage_admin_token", secret: "{{ GARAGE_ADMIN_TOKEN }}"}
  no_log: true
