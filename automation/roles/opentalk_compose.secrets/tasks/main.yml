---
# tasks file for opentalk_compose.secrets

- name: "Ensure secrets directory | {{ config_dir }}/secrets"
  ansible.builtin.file:
    path: "{{ config_dir }}/secrets"
    state: directory
    mode: '0700'

- name: Include manage_secrets.yml
  ansible.builtin.include_tasks:
    file: manage_secrets.yml
