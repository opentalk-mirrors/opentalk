---
# tasks file for opentalk_compose_opentalk_web_frontend

- name: Include manage_web_frontend_config.yml
  ansible.builtin.include_tasks:
    file: manage_web_frontend_config.yml
  when: compose_service_opentalk_web_frontend_enabled | bool

- name: Include manage_docker_compose.yml
  ansible.builtin.include_tasks:
    file: manage_docker_compose.yml
