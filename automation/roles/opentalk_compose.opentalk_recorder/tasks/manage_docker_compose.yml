---

- name: OpenTalk Recorder Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - opentalk-recorder include {mark}"
    block: |
      - path:
          - services/opentalk-recorder/compose.yml
    state: "{{ 'present' if compose_service_opentalk_recorder_enabled | bool else 'absent' }}"
  register: _blockinfile_result

- name: Invalidate compose includes check on blockinfile change
  ansible.builtin.set_fact:
    compose_includes_ready: false
  when: _blockinfile_result.changed

- name: Render Recorder compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ recorder_docker_compose_services_dir }}/opentalk-recorder/compose.yml"
  when: compose_service_opentalk_recorder_enabled | bool

- name: Check if all compose includes exist
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../roles/opentalk_compose.docker_env/tasks/check_compose_includes.yml"
  when:
    - compose_service_opentalk_recorder_enabled | bool
    - not (compose_includes_ready | default(false))

- name: Manage OpenTalk Recorder Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ recorder_docker_compose_project_src }}"
    project_name: "{{ recorder_docker_compose_project_name }}"
    services:
      - recorder
    files:
      - compose.yml
    state: "{{ recorder_docker_compose_services_state }}"
  when:
    - compose_service_opentalk_recorder_enabled | bool
    - compose_includes_ready | default(false)
