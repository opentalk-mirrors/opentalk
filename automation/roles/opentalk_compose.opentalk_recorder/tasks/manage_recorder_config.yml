---

- name: Ensure OpenTalk Recorder service directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ recorder_docker_compose_services_dir }}"
    - "{{ recorder_docker_compose_services_dir }}/opentalk-recorder"
    - "{{ recorder_docker_compose_services_dir }}/opentalk-recorder/config"

## GPU / HW Acceleration detection (Intel + specific device)
- name: Check if render device exists
  ansible.builtin.stat:
    path: /dev/dri/renderD129
  register: recorder_render_device

- name: Read vendor if device exists
  ansible.builtin.command: cat /sys/class/drm/renderD129/device/vendor
  register: recorder_render_vendor
  changed_when: false
  failed_when: false
  when: recorder_render_device.stat.exists

- name: Set hardware acceleration facts (Intel)
  ansible.builtin.set_fact:
    recorder_hardware_acceleration_manufacturer: intel
    recorder_hardware_acceleration_device: /dev/dri/renderD129
  when: >-
    recorder_render_device.stat.exists and (recorder_render_vendor.stdout | trim in ['0x8086'])

- name: "Render OpenTalk Recorder static config | {{ recorder_docker_compose_services_dir }}/opentalk-recorder/config/recorder.toml"
  ansible.builtin.template:
    src: recorder.toml.j2
    dest: "{{ recorder_docker_compose_services_dir }}/opentalk-recorder/config/recorder.toml"
    mode: '0644'
  notify: Restart Docker Service OpenTalk Recorder
