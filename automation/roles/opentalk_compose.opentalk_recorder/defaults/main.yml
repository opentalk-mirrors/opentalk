---
# defaults file for opentalk_compose.opentalk_recorder

recorder_docker_compose_project_name: "{{ compose_project_name | default('opentalk') }}"
recorder_docker_compose_services_state: "{{ compose_service_opentalk_recorder_state | default('present') }}"
recorder_docker_compose_services_dir: "{{ services_dir }}"
recorder_docker_compose_project_src: "{{ deploy_dir }}"

recorder_docker_compose_ulimits_nofile_soft: 65536
recorder_docker_compose_ulimits_nofile_hard: 65536
recorder_docker_compose_ulimits_nproc: 8192

recorder_docker_image_src: registry.heinlein.group/opentalk/recorder
recorder_docker_extra_hosts:
  - host.docker.internal:host-gateway

recorder_auth_issuer: "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}"
recorder_auth_client_id: "Recorder"
recorder_auth_client_secret: "{{ OIDC_RECORDER_CLIENT_SECRET }}"

recorder_controller_url: "http://controller:11311"
recorder_controller_api_key_id: "controller"
recorder_controller_api_key_secret: "{{ CONTROLLER_API_SECRET }}"

# Backward-compatibility fallback for older settings overrides.
# If recorder_controller_url is unset and this value is set, it will be mapped to
# url = "http://<domain>" in recorder.toml.
recorder_controller_domain: "controller:11311"

recorder_rabbitmq_uri: "amqp://ot:{{ RABBITMQ_PASSWORD }}@rabbitmq/%2F"
recorder_rabbitmq_queue: opentalk_recorder

# Optional orchestrator configuration
# recorder_orchestrator_api_key_id: "orchestrator"
# recorder_orchestrator_api_key_secret: "secret"
# recorder_orchestrator_url: "http://127.0.0.1:11222"

# Optional HTTP server configuration
# recorder_http_host: "0.0.0.0"
# recorder_http_port: 5555
# recorder_http_api_keys:
#   - id: "recorder"
#     secret: "secret"

recorder_recorder_display: "true"
recorder_recorder_clock_format: "%d.%m.%y %X %Z"
# recorder_hardware_acceleration_manufacturer: "intel"
# recorder_hardware_acceleration_device: "/dev/dri/renderD129"

recorder_monitoring_port: 11411
