---
# handlers file for opentalk_compose.opentalk_recorder

- name: "Restart Docker Service OpenTalk Recorder"
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/opentalk-recorder"
    files:
      - compose.yml
      - "{{ deploy_dir }}/common.yml"
    recreate: never
    state: restarted