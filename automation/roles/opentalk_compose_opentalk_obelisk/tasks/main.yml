---
# tasks file for opentalk_compose_opentalk_obelisk

- name: Include manage_obelisk_config.yml
  ansible.builtin.include_tasks:
    file: manage_obelisk_config.yml
  when: compose_service_opentalk_obelisk_enabled | bool

- name: Include manage_docker_compose.yml
  ansible.builtin.include_tasks:
    file: manage_docker_compose.yml
