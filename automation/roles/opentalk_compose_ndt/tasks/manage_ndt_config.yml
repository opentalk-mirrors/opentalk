---
- name: Ensure NDT Service directory
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    state: directory
  with_items:
    - "{{ ndt_docker_compose_services_dir }}"
    - "{{ ndt_docker_compose_services_dir }}/ndt"
