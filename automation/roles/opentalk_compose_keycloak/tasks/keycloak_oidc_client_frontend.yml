---
# Manage Keycloak client used for OpenTalk web-frontend

- name: "Create or update Keycloak client {{ controller_oidc_frontend_client_id | default('Frontend') }}"
  community.general.keycloak_client:
    auth_keycloak_url: "{{ keycloak_base_url }}"
    auth_realm: "{{ keycloak_auth_realm }}"
    auth_username: "{{ keycloak_auth_username }}"
    auth_password: "{{ keycloak_auth_password }}"
    realm: "{{ keycloak_realm }}"
    client_id: "{{ controller_oidc_frontend_client_id | default('Frontend') }}"
    name: "{{ controller_oidc_frontend_client_id | default('Frontend') }}"
    state: present
    description: "OpenTalk Frontend OIDC client"
    enabled: true
    public_client: true
    direct_access_grants_enabled: false
    redirect_uris: "{{ keycloak_redirectUris_uris }}"
    web_origins: "{{ controller_frontend_base_url | default('http://localhost') }}"
    attributes:
      post.logout.redirect.uris: "+"
      backchannel.logout.url: "{{ keycloak_backchannel_logout_url }}"

- name: "Get Keycloak client ID for {{ controller_oidc_frontend_client_id | default('Frontend') }}"
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm }}/clients?clientId={{ controller_oidc_frontend_client_id | default('Frontend') }}"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
    status_code: 200
  register: frontend_client_lookup

- name: "Set frontend client UUID"
  ansible.builtin.set_fact:
    frontend_client_uuid: "{{ (frontend_client_lookup.json | first).id }}"
  when: frontend_client_lookup.json | length > 0

- name: "Get protocol mappers for {{ controller_oidc_frontend_client_id | default('Frontend') }}"
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm }}/clients/{{ frontend_client_uuid }}/protocol-mappers/models"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
    status_code: 200
  register: frontend_protocol_mappers
  when: frontend_client_uuid is defined

- name: "Set frontend audience mapper UUID"
  ansible.builtin.set_fact:
    frontend_audience_mapper_uuid: "{{ (frontend_protocol_mappers.json | selectattr('name', 'equalto', 'audience-controller') | list | first).id }}"
  when:
    - frontend_client_uuid is defined
    - frontend_protocol_mappers.json | selectattr('name', 'equalto', 'audience-controller') | list | length > 0

- name: "Update Frontend audience mapper for {{ controller_oidc_controller_client_id | default('Controller') }}"
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm }}/clients/{{ frontend_client_uuid }}/protocol-mappers/models/{{ frontend_audience_mapper_uuid }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ frontend_audience_mapper_uuid }}"
      name: "audience-controller"
      protocol: "openid-connect"
      protocolMapper: "oidc-audience-mapper"
      consentRequired: false
      config:
        included.client.audience: "{{ controller_oidc_controller_client_id | default('Controller') }}"
        id.token.claim: "false"
        access.token.claim: "true"
    status_code: 204
  when: frontend_audience_mapper_uuid is defined

- name: "Create Frontend audience mapper for {{ controller_oidc_controller_client_id | default('Controller') }}"
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm }}/clients/{{ frontend_client_uuid }}/protocol-mappers/models"
    method: POST
    headers:
      Authorization: "Bearer {{ keycloak_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "audience-controller"
      protocol: "openid-connect"
      protocolMapper: "oidc-audience-mapper"
      consentRequired: false
      config:
        included.client.audience: "{{ controller_oidc_controller_client_id | default('Controller') }}"
        id.token.claim: "false"
        access.token.claim: "true"
    status_code: 201
  when:
    - frontend_client_uuid is defined
    - frontend_audience_mapper_uuid is not defined
