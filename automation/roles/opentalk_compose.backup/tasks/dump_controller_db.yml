---
- name: Ensure SQL dump backup directory
  ansible.builtin.command:
    cmd: mkdir -p "{{ backup_dir_sql_dumps }}"
    creates: "{{ backup_dir_sql_dumps }}"

- name: Create SQL dump Controller DB
  ansible.builtin.shell: |
    docker run --rm \
      --network {{ docker_network_name }} \
      -e PGPASSWORD="$PGPASSWORD" \
      {{ postgres_docker_image_src }}:{{ postgres_version }} \
      pg_dump -h {{ controller_db_host }} -p {{ controller_db_port }} -U {{ controller_db_user }} {{ controller_db_name }} \
      > {{ controller_db_dump_file }}
  environment:
    PGPASSWORD: "{{ controller_db_password }}"
  tags: [controller_db_dump]
