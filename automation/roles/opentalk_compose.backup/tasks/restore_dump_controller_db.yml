---
- name: Check if explicit restore dump file is defined
  ansible.builtin.stat:
    path: "{{ controller_db_dump_restore_file }}"
  register: _explicit_restore_dump_stat
  when: controller_db_dump_restore_file is defined

- name: Use explicitly provided dump file
  ansible.builtin.set_fact:
    _chosen_controller_db_dump: "{{ controller_db_dump_restore_file }}"
  when:
    - controller_db_dump_restore_file is defined
    - _explicit_restore_dump_stat.stat.exists

- name: Find available controller DB dump files (fallback to latest)
  ansible.builtin.find:
    paths: "{{ backup_dir_sql_dumps }}"
    patterns: "*.sql"
    file_type: file
  register: _found_controller_db_dumps
  when: _chosen_controller_db_dump is not defined

- name: Select latest controller DB dump file
  ansible.builtin.set_fact:
    _chosen_controller_db_dump: "{{ (_found_controller_db_dumps.files | sort(attribute='mtime') | last).path }}"
  when:
    - _chosen_controller_db_dump is not defined
    - _found_controller_db_dumps.matched | int > 0

- name: Fail if no controller DB dump file could be determined
  ansible.builtin.fail:
    msg: "No SQL dump found (neither {{ controller_db_dump_restore_file | default('undefined') }} nor any dump in {{ backup_dir_sql_dumps }})."
  when: _chosen_controller_db_dump is not defined

- name: Show which dump will be restored
  ansible.builtin.debug:
    msg: "Restoring controller DB from dump: {{ _chosen_controller_db_dump }}"

- name: Restore Controller DB from dump
  ansible.builtin.shell: |
    set -euo pipefail
    cat "{{ _chosen_controller_db_dump }}" | docker run --rm -i \
      --network {{ docker_network_name }} \
      -e PGPASSWORD="$PGPASSWORD" \
      {{ postgres_docker_image_src }}:{{ postgres_version }} \
      psql -h {{ controller_db_host }} -p {{ controller_db_port }} -U {{ controller_db_user }} -d {{ controller_db_name }}
  environment:
    PGPASSWORD: "{{ controller_db_password }}"
  tags: [controller_db_restore]