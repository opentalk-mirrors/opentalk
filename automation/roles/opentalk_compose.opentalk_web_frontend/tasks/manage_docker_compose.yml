---
- name: OpenTalk Web-Frontend Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - opentalk-web-frontend include {mark}"
    block: |
      - path:
          - services/opentalk-web-frontend/compose.yml
    state: "{{ 'present' if compose_service_opentalk_web_frontend_enabled | bool else 'absent' }}"
  when: compose_service_opentalk_web_frontend_enabled | bool

- name: Render OpenTalk Web Frontend compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ opentalk_web_frontend_docker_compose_services_dir }}/opentalk-web-frontend/compose.yml"

- name: Manage OpenTalk Web Frontend Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ opentalk_web_frontend_docker_compose_project_src }}"
    project_name: "{{ opentalk_web_frontend_docker_compose_project_name }}"
    services:
      - web-frontend
    files:
      - compose.yml
    state: "{{ opentalk_web_frontend_docker_compose_services_state }}"
