---

- name: Ensure MinIO Service directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ opentalk_web_frontend_docker_compose_services_dir }}"
    - "{{ opentalk_web_frontend_docker_compose_services_dir }}/opentalk-web-frontend"

- name: Ensure video backgrounds directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ opentalk_web_frontend_backgrounds_dir }}"
    - "{{ opentalk_web_frontend_backgrounds_dir }}/thumbs"
  when: opentalk_web_frontend_environment_video_backgrounds | default('') | length > 0
