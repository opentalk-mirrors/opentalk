---

- name: Ensure MinIO Service directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ opentalk_web_frontend_docker_compose_services_dir }}"
    - "{{ opentalk_web_frontend_docker_compose_services_dir }}/opentalk-web-frontend"
