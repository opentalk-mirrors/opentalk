---
# defaults file for opentalk_compose.opentalk_web_frontend

opentalk_web_frontend_docker_compose_project_name: "{{ compose_project_name | default('opentalk') }}"
opentalk_web_frontend_docker_compose_services_state: "{{ compose_service_opentalk_web_frontend_state | default('present') }}"
opentalk_web_frontend_docker_compose_services_dir: "{{ services_dir }}"
opentalk_web_frontend_docker_compose_project_src: "{{ deploy_dir }}"

opentalk_web_frontend_docker_compose_ulimits_nofile_soft: 4096
opentalk_web_frontend_docker_compose_ulimits_nofile_hard: 8192
opentalk_web_frontend_docker_compose_ulimits_nproc: 2048

opentalk_web_frontend_docker_image_src: registry.heinlein.group/opentalk/web-frontend

opentalk_web_frontend_docker_extra_hosts: []

opentalk_web_frontend_environment_insecure: false
opentalk_web_frontend_environment_controller_host: "{{ (ot_domain, ot_ingress_port) | build_host }}/controller"
opentalk_web_frontend_environment_base_url: "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}"
opentalk_web_frontend_environment_oidc_issuer: "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}"
opentalk_web_frontend_environment_oidc_client_id: "{{ controller_oidc_frontend_client_id | default('Frontend') }}"
opentalk_web_frontend_environment_livekit_server_url: "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}/livekit"
opentalk_web_frontend_environment_ndt_server: "{{ (ot_domain, ot_ingress_port) | build_host }}"
opentalk_web_frontend_environment_change_password_url: "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}/account/"
opentalk_web_frontend_environment_error_report_address: "{{ ERROR_REPORT_ADDRESS | default('reports@example.com') }}"
opentalk_web_frontend_environment_libravatar_default_image: "{{ LIBRAVATAR_DEFAULT_IMAGE | default('identicon') }}"
# Custom video backgrounds for the web frontend.
# Set this to a JSON array of objects with altText, url and thumb properties to
# enable. When non-empty, the backgrounds directory is mounted into the
# container as a read-only volume.
# See docs/5-configuration-options-reference.md for a configuration example.
opentalk_web_frontend_environment_video_backgrounds: ""

opentalk_web_frontend_backgrounds_dir: /var/opt/opentalk-compose/backgrounds

opentalk_web_frontend_environment_is_beta_release: "{{ IS_BETA_RELEASE | default(false) }}"
opentalk_web_frontend_environment_feature_user_search: "{{ FEATURE_USER_SEARCH | default(true) }}"
opentalk_web_frontend_environment_feature_timer: "{{ FEATURE_TIMER | default(true) }}"
opentalk_web_frontend_environment_feature_whiteboard: "{{ FEATURE_WHITEBOARD | default(true) }}"
opentalk_web_frontend_environment_feature_protocol: "{{ FEATURE_PROTOCOL | default(true) }}"
opentalk_web_frontend_environment_feature_recording: "{{ FEATURE_RECORDING | default(false) }}"
opentalk_web_frontend_environment_waiting_room_default_value: "{{ WAITING_ROOM_DEFAULT_VALUE | default(false) }}"
opentalk_web_frontend_environment_suppress_browser_compatibility_info: false

opentalk_web_frontend_labels_traefik_enable: true
opentalk_web_frontend_labels_traefik_http_middlewares_webapp_cors_headers_accessControlAllowOriginList: "{{ (ot_ingress_protocol, ot_domain, ot_ingress_port) | build_url }}"

opentalk_web_frontend_environment_feature_e2e_encryption: false
opentalk_web_frontend_environment_livekit_e2ee_salt: "{{ LIVEKIT_E2EE_SALT }}"
opentalk_web_frontend_environment_livekit_preferred_video_codec: "{{ LIVEKIT_PREFERRED_VIDEO_CODEC | default('vp9') }}"
