---
# tasks file for opentalk_compose.ndt

- name: Include manage_ndt_config.yml
  ansible.builtin.include_tasks:
    file: manage_ndt_config.yml
  when: compose_service_ndt_enabled | bool

- name: Include manage_docker_compose.yml
  ansible.builtin.include_tasks:
    file: manage_docker_compose.yml
  when: compose_service_ndt_enabled | bool
