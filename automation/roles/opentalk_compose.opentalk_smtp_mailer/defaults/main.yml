# mailer_templates_external_uninvite: '{html = "resources/templates/external_uninvite.html", txt = "resources/templates/external_uninvite.txt"}'

# Frontend settings
mailer_frontend_base_url: "https://{{ ot_domain }}"
#mailer_frontend_data_protection_url: "https://opentalk.example.org/dataprotection"

mailer_languages_default_language: "de-DE"

# Optional monitoring address
mailer_monitoring_addr: "0.0.0.0"
mailer_monitoring_port: 11411

mailer_support_contact_phone: "+49 123 456789"
mailer_support_contact_mail: "support@{{ ot_domain }}"