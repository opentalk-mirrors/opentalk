---
# defaults file for opentalk_compose.opentalk_smtp_mailer
mailer_docker_compose_project_name: "{{ compose_project_name | default('opentalk') }}"
mailer_docker_compose_services_state: "{{ compose_service_opentalk_smtp_mailer_state | default('present') }}"
mailer_docker_compose_services_dir: "{{ services_dir }}"
mailer_docker_compose_project_src: "{{ deploy_dir }}"

mailer_docker_image_src: "registry.opencode.de/opentalk/smtp-mailer"

mailer_rabbit_mq_url: "amqp://ot:{{ RABBITMQ_PASSWORD }}@rabbitmq/%2F"
mailer_rabbit_mq_mail_task_queue: "opentalk_mailer"

mailer_smtp_smtp_server: "smtp://mailcrab:1025?disable_starttls=true"
mailer_smtp_from_name: "OpenTalk - {{ ot_domain }}"
mailer_smtp_from_email: "no-reply@{{ ot_domain }}"

# Optional template builder links
# mailer_template_builder_join_link_builder: "{base_url}lobby/{room_id}"
# mailer_template_builder_guest_link_builder: "{base_url}/invite/{invite_id}"
# mailer_template_builder_dashboard_event_link_builder: "{base_url}/dashboard/meetings/view/{event_id}"

