# mailer_templates_external_event_update: '{html = "resources/templates/external_event_update.html", txt = "resources/templates/external_event_update.txt"}'
# mailer_templates_registered_event_cancellation: '{html = "resources/templates/registered_event_cancellation.html", txt = "resources/templates/registered_event_cancellation.txt"}'
# mailer_templates_unregistered_event_cancellation: '{html = "resources/templates/unregistered_event_cancellation.html", txt = "resources/templates/unregistered_event_cancellation.txt"}'
