---
- name: OpenTalk SMTP-Mailer Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - opentalk-smtp-mailer include {mark}"
    block: |
      - path:
          - services/opentalk-smtp-mailer/compose.yml
    state: "{{ 'present' if compose_service_opentalk_smtp_mailer_enabled | bool else 'absent' }}"
  when: compose_service_opentalk_smtp_mailer_enabled | bool

- name: Render OpenTalk SMTP Mailer compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ mailer_docker_compose_services_dir }}/opentalk-smtp-mailer/compose.yml"
  when: compose_service_opentalk_smtp_mailer_enabled | bool

- name: Check if all compose includes exist
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../roles/opentalk_compose.docker_env/tasks/check_compose_includes.yml"

- name: Manage OpenTalk SMTP Mailer Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ mailer_docker_compose_project_src }}"
    project_name: "{{ mailer_docker_compose_project_name }}"
    services:
      - smtp-mailer
    files:
      - compose.yml
    state: "{{ 'present' if compose_service_opentalk_smtp_mailer_enabled | bool else 'absent' }}"
  when:
    - compose_service_opentalk_smtp_mailer_enabled | bool
    - compose_includes_ready | default(false)
