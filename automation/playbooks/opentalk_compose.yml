---
- name: Install Opentalk
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../../.versions.yml
    - "{{ lookup('env', 'OT_SETTINGS_FILE') | default('/etc/opentalk-compose/settings.yml', true) }}"

  pre_tasks:
    - name: Abort if ot_domain not set
      ansible.builtin.fail:
        msg: "ot_domain must be set (e.g. otctl deploy -e ot_domain=example.com or in settings.yml for persistence)"
      when: (ot_domain | default('') | trim | length) == 0
      tags: ["always"]

    - name: Load deployment secrets
      tags: ["always"]
      block:
        - name: Check for secrets vars file
          ansible.builtin.stat:
            path: "{{ config_dir | default('/etc/opentalk') }}/secrets/secrets.yml"
          register: secrets_file
        - name: Load secrets
          ansible.builtin.include_vars: "{{ config_dir | default('/etc/opentalk') }}/secrets/secrets.yml"
          when: secrets_file.stat.exists
        - name: Warn if optional secrets file is missing
          ansible.builtin.debug:
            msg: "WARNING: secrets file '{{ config_dir | default('/etc/opentalk') }}/secrets/secrets.yml' not found."
          when: not secrets_file.stat.exists

    - name: Stop if a migration is pending
      ansible.builtin.include_role:
        name: opentalk_compose_migrations
      tags: ["always"]
  roles:
    - role: opentalk_compose_docker_env
      tags: [docker]

    - role: opentalk_compose_secrets
      tags: ["secrets"]

    - role: opentalk_compose_backup
      dependencies:
        - role: opentalk_compose_secrets

    - role: opentalk_compose_self_signed_cert
      dependencies:
        - role: opentalk_compose_secrets
      tags: [self-signed-certificates]

    - role: opentalk_compose_traefik
      dependencies:
        - role: opentalk_compose_secrets
      tags: [traefik]

    - role: opentalk_compose_keycloak
      dependencies:
        - role: opentalk_compose_secrets
      tags: [keycloak]

    # only with tag demo-user
    - role: opentalk_compose_keycloak
      dependencies:
        - role: opentalk_compose_secrets
      tags: [never, demo-user]

    - role: opentalk_compose_garage
      dependencies:
        - role: opentalk_compose_secrets
      tags: [garage, s3]

    - role: opentalk_compose_minio
      dependencies:
        - role: opentalk_compose_secrets
      tags: [minio, s3]

    - role: opentalk_compose_rabbitmq
      dependencies:
        - role: opentalk_compose_secrets
      tags: [rabbitmq]

    - role: opentalk_compose_mailcrab
      dependencies:
        - role: opentalk_compose_secrets
      tags: [mailcrab]

    - role: opentalk_compose_livekit_server
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["livekit-server", "livekit"]

    - role: opentalk_compose_spacedeck
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["spacedeck"]

    - role: opentalk_compose_etherpad
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["etherpad"]

    - role: opentalk_compose_opentalk_controller
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["opentalk-controller", "controller"]

    - role: opentalk_compose_opentalk_roomserver
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["opentalk-roomserver", "roomserver"]

    - role: opentalk_compose_opentalk_orchestrator
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["opentalk-orchestrator", "orchestrator"]

    - role: opentalk_compose_opentalk_web_frontend
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["opentalk-web-frontend", "web-frontend", "webapp"]

    - role: opentalk_compose_opentalk_recorder
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["opentalk-recorder", "recorder"]

    - role: opentalk_compose_opentalk_obelisk
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["opentalk-obelisk", "obelisk"]

    - role: opentalk_compose_opentalk_outlook_add_in
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["opentalk-outlook-add-in", "outlook"]

    - role: opentalk_compose_opentalk_smtp_mailer
      dependencies:
        - role: opentalk_compose_secrets
      tags: ["opentalk-smtp-mailer", "mailer"]

    - role: opentalk_compose_ndt
      dependencies:
        - role: opentalk_compose_secrets
      tags: [ndt]

  post_tasks:
    - name: Warn if both S3 providers are active simultaneously
      ansible.builtin.debug:
        msg: >
          WARNING: Both MinIO and Garage are running at the same time.
          This is a temporary state intended for S3 data migration.
          Run 'otctl migrate minio-to-garage' or 'otctl migrate garage-to-minio'
          to transfer data and deactivate the old provider.
      when:
        - (compose_service_minio_enabled | default(false) | bool) and (compose_service_garage_enabled | default(false) | bool)
        # 'otctl migrate' starts both on purpose and needs no reminder.
        - not (s3_migrate_in_progress | default(false) | bool)
      tags: [always]
