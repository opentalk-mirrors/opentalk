[defaults]
inventory = /opt/opentalk-compose/automation/inventory.yml
roles_path = /opt/opentalk-compose/automation/roles:/opt/opentalk-compose/runtime/vendor/roles
collections_path = /opt/opentalk-compose/runtime/vendor/collections:./collections
retry_files_enabled = False
host_key_checking = False
forks = 25
# Print task results as YAML, so that multi-line guidance such as the
# migration hints stays readable instead of showing escaped newlines.
callback_result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10
