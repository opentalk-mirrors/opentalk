  ".commitlintrc.json",
  ".gitmodules",
  ".taplo.toml",
  "CHANGELOG.md",
  "Cargo.lock",
  "README.md",
  "renovate.json",
]
precedence = "aggregate"

[[annotations]]
SPDX-FileCopyrightText = "OpenTalk GmbH <mail@opentalk.eu>"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"
