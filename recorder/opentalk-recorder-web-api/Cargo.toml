[package]
name = "opentalk-recorder-web-api"
description = "OpenTalk Recorder WebAPI routes & types"
documentation = "https://docs.rs/crate/opentalk-recorder-web-api/"
publish = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["macros"] }
opentalk-types-api-common = { workspace = true, features = ["http", "axum"] }
opentalk-types-api-internal.workspace = true
serde = { workspace = true, features = ["derive"] }
