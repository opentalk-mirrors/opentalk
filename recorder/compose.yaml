services:
  recorder:
    image: registry.opencode.de/opentalk/recorder:v0.5.1
    profiles: [ "standard", "full", "recorder"]
    restart: always
    volumes:
      - ./config/recorder.toml:/recorder/config.toml
    depends_on:
      cforge:
        condition: service_completed_successfully
      controller:
        condition: service_started
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
