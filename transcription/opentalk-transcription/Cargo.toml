[package]
name = "opentalk-transcription"
publish = false
default-run = "opentalk-transcription"
build = "build.rs"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
anstream.workspace = true
anyhow = { workspace = true, features = ["backtrace"] }
async-trait.workspace = true
axum = { workspace = true, features = ["macros", "http2", "ws"] }
clap = { workspace = true, features = ["derive"] }
config = { workspace = true, features = ["toml"] }
directories.workspace = true
earshot.workspace = true
ezk.workspace = true
ezk-audio.workspace = true
ezk-audio-nodes = { workspace = true, features = ["nnnoiseless"] }
futures.workspace = true
hound.workspace = true
itertools.workspace = true
livekit.workspace = true
log.workspace = true
opentalk-client-signaling.workspace = true
opentalk-orchestrator-client.workspace = true
opentalk-service-auth = { workspace = true, features = ["axum"] }
opentalk-tracing.workspace = true
opentalk-transcription-web-api.workspace = true
opentalk-types-api-common.workspace = true
opentalk-version.workspace = true
owo-colors.workspace = true
prometheus.workspace = true
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
service-probe.workspace = true
service-probe-client.workspace = true
sysinfo.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
whisper-rs = { workspace = true, features = ["tracing_backend"] }

[dev-dependencies]
temp-env.workspace = true
textplots.workspace = true

[build-dependencies]
anyhow.workspace = true
opentalk-version.workspace = true
