---
extends: default

ignore:
  - .ansible/
  - artifacts/
  - build/

rules:
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  line-length: disable
  octal-values: enable
