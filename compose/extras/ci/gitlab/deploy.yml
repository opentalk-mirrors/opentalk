deploy:experimental:testing:
  stage: deploy-manual
  allow_failure: true
  # Fetch artifacts from experimental packaging; mark optional so the job exists even if one flavor is missing
  needs:
    - job: "package:experimental: [deb]"
      artifacts: true
      optional: true
    - job: "package:experimental: [rpm]"
      artifacts: true
      optional: true
  # Show manual button on typical branch/MR experimental pipelines; hide on tag pipelines
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: never
  resource_group: remote-deploy-$HOST
  variables:
    GIT_STRATEGY: none
  parallel:
    matrix:
      - DIST: debian12
        HOST: $DEPLOY_TARGET_HOST_DEBIAN12
        PKG_CMD: apt
        PKG_TYPE: deb
      - DIST: debian13
        HOST: $DEPLOY_TARGET_HOST_DEBIAN13
        PKG_CMD: apt
        PKG_TYPE: deb
      - DIST: ubuntu2404
        HOST: $DEPLOY_TARGET_HOST_UBUNTU2404
        PKG_CMD: apt
        PKG_TYPE: deb
      - DIST: opensuse15
        HOST: $DEPLOY_TARGET_HOST_OPENSUSE15
        PKG_CMD: zypper
        PKG_TYPE: rpm
      - DIST: opensuse16
        HOST: $DEPLOY_TARGET_HOST_OPENSUSE16
        PKG_CMD: zypper
        PKG_TYPE: rpm
      - DIST: rocky9
        HOST: $DEPLOY_TARGET_HOST_ROCKY9
        PKG_CMD: dnf
        PKG_TYPE: rpm
      - DIST: rocky10
        HOST: $DEPLOY_TARGET_HOST_ROCKY10
        PKG_CMD: dnf
        PKG_TYPE: rpm
  before_script:
    - set -euo pipefail
    # Add SSH client config with jump host
    - sh "$SH_SSH_CLIENT_CONFIG"
  script:
    - sh -euo pipefail
    # Locate artifacts from experimental packaging
    - sh "$SH_INSTALL_OPENTALK_COMPOSE"
