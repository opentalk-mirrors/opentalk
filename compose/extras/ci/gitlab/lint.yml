# lint:shellcheck from the common-lint template checks every *.sh in the
# repository. The wrappers have no extension, so only this job checks them.
lint:compose-shellcheck:
  stage: lint
  extends: .default_conditions
  script:
    - echo "Linting shell wrappers..."
    - shellcheck extras/packaging/wrappers/*

lint:compose-shell-tests:
  stage: lint
  extends: .default_conditions
  script:
    - echo "Running shell regression tests..."
    - just test-fast-no-lint

lint:compose-yamllint:
  stage: lint
  extends: .default_conditions
  script:
    - echo "Linting YAML files..."
    - yamllint .

# Keeps the name of the common-lint template job on purpose and replaces it:
# that job runs markdownlint over docs/, which does not pass yet. It is planned
# that markdownlint takes over the mdl linting inherited from opentalk-compose.
lint:markdown:
  stage: lint
  extends: .default_conditions
  script:
    - echo "Linting Markdown files..."
    - |
      git ls-files '*.md' | grep -v 'docs/6-configuration-options-reference.md' | \
        xargs -P4 -n1 sh -c '
          f="$1"
          sed "/\[\[_TOC_\]\]/Id" "$f" | mdl --style .markdown_style.rb - 2>&1 | \
          sed "s|^|$f: |"
        ' _

lint:compose-ansible-lint:
  stage: lint
  extends: .default_conditions
  script:
    - echo "Linting Ansible code ..."
    - ansible-lint .

lint:compose-ansible-syntax:
  stage: lint
  extends: .default_conditions
  script:
    - echo "Syntax-checking Ansible playbooks ..."
    - |
      for playbook in automation/playbooks/*.yml; do
        echo "=== ${playbook} ==="
        ansible-playbook --syntax-check "${playbook}"
      done

lint:compose-release_tag:
  stage: lint
  extends: .default_conditions
  before_script:
    - cd "$CI_PROJECT_DIR/compose"
    - bash extras/ci/gitlab/update-product-version.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^compose-v\d+\.\d+\.\d+(-\d+)?$/'
    - when: never
  script:
    - bash extras/ci/gitlab/check-release-tag.sh '(-[0-9]+)?'

lint:compose-pre-release_tag:
  stage: lint
  extends: .default_conditions
  before_script:
    - cd "$CI_PROJECT_DIR/compose"
    - bash extras/ci/gitlab/update-product-version.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^compose-v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)$/'
    - when: never
  script:
    - bash extras/ci/gitlab/check-release-tag.sh '(-(alpha|beta)(\.[0-9]+)?)?'
