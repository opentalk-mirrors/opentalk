.rules_stable:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^compose-v\d+\.\d+\.\d+(-\d+)?$/'
    - when: never

.rules_pre_release:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^compose-v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)$/'
    - when: never

.rules_experimental:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - compose/**/*
    - when: never

# Feeds int:experimental-on-merge: a deb-only rebuild after a merge to main,
# so the Debian integration tests have an artifact to install from that pipeline.
# Also fires when a deployed component's own source changes, not just the
# compose automation, since the Debian integration test exercises all of them.
.rules_experimental_on_merge:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - compose/**/*
        - controller/**/*
        - obelisk/**/*
        - orchestrator/**/*
        - roomserver/**/*
        - smtp-mailer/**/*
        - recorder/**/*
    - when: never

.package:
  stage: package
  image: $CI_REGISTRY_IMAGE/pkgbuild:latest
  before_script:
    - cd "$CI_PROJECT_DIR/compose"
    - bash extras/ci/gitlab/update-product-version.sh
  needs:
    - job: build:pkgbuild
      optional: true
    - lint:shellcheck
    - lint:yamllint
    - lint:markdown
    - lint:ansible-lint
    - lint:licensing
  parallel:
    matrix:
      - FLAVOR: !reference [.template_pkg_vars, FLAVORS_PKG]
  after_script:
    - cd "$CI_PROJECT_DIR/compose"
    - bash extras/ci/gitlab/sign-rpm-packages.sh

.package_release:
  extends: .package
  script:
    # The package build expects a bare `vX.Y.Z`, so strip the `compose-` prefix.
    - just "build-${FLAVOR}-version" "${CI_COMMIT_TAG#compose-}"
  artifacts:
    paths:
      - compose/artifacts/*
    expire_in: 1 day

package:stable:
  extends: .package_release
  # Manual: the component images for this tag may not be in Harbor yet (push-harbor
  # runs in a later stage), so a human confirms that before starting the compose
  # release. int:stable and upload:stable then run automatically via `needs`.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^compose-v\d+\.\d+\.\d+(-\d+)?$/'
      when: manual
    - when: never

package:pre-release:
  extends: .package_release
  rules: !reference [.rules_pre_release, rules]

package:experimental:
  extends: .package
  rules: !reference [.rules_experimental, rules]
  script:
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        VERSION="$(yq -r '.opentalk_product_version' .versions.yml)+git${CI_COMMIT_SHORT_SHA}"
      else
        VERSION="${CI_COMMIT_TAG#compose-}+git${CI_COMMIT_SHORT_SHA}"
      fi
      echo "VERSION=$VERSION"
    - just "build-${FLAVOR}-version" "$VERSION"
  artifacts:
    paths:
      - compose/artifacts/*
    expire_in: 2 hours

package:experimental-on-merge:
  extends: .package
  needs:
    - job: build:pkgbuild
      optional: true
  parallel: null
  rules: !reference [.rules_experimental_on_merge, rules]
  variables:
    FLAVOR: deb
  script:
    - |
      VERSION="$(yq -r '.opentalk_product_version' .versions.yml)+git${CI_COMMIT_SHORT_SHA}"
      echo "VERSION=$VERSION"
    - just "build-${FLAVOR}-version" "$VERSION"
  artifacts:
    paths:
      - compose/artifacts/*
    expire_in: 2 hours

.upload_base:
  stage: upload
  image: $CI_REGISTRY_IMAGE/pkgbuild:latest
  before_script:
    - cd "$CI_PROJECT_DIR/compose"
  parallel:
    matrix:
      - FLAVOR: !reference [.template_pkg_vars, FLAVORS_PKG]

upload:stable:
  extends: .upload_base
  needs:
    - job: package:stable
      artifacts: true
    - job: int:stable
  rules: !reference [.rules_stable, rules]
  script:
    - bash extras/ci/gitlab/upload-release.sh "${FLAVOR}" "stable"

upload:pre-release:
  extends: .upload_base
  needs:
    - job: package:pre-release
      artifacts: true
    - job: int:pre-release
  rules: !reference [.rules_pre_release, rules]
  script:
    - bash extras/ci/gitlab/upload-release.sh "${FLAVOR}" "testing"

upload:experimental:
  extends: .upload_base
  needs:
    - job: package:experimental
      artifacts: true
    - job: int:experimental
  rules: !reference [.rules_experimental, rules]
  script:
    - bash extras/ci/gitlab/upload-release.sh "${FLAVOR}" "experimental"
