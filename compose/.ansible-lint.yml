---
# .ansible-lint

profile: production

skip_list:
  # Role variables are public configuration keys and retain their stable prefixes.
  - var-naming[no-role-prefix]

exclude_paths:
  - docs/
  - extras/
  - LICENSES/
  - services/
  - .cache/
  - .gitlab-ci.yml
  - mkdocs.yml
