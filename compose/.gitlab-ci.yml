---
# This file is included from the root `.gitlab-ci.yml` (single merged pipeline).
# It no longer declares its own `image`, `workflow`, or `stages` - those are
# owned by the root config since GitLab only honours one of each per pipeline.
# Every job below operates relative to this `compose/` directory, so anything
# that touches repo-relative paths carries an explicit `cd` into it.

include:
  - local: compose/extras/ci/gitlab/lint.yml
  - local: compose/extras/ci/gitlab/package.yml
  - local: compose/extras/ci/gitlab/deploy.yml
  - local: compose/extras/ci/gitlab/integration.yml
  - local: compose/extras/ci/gitlab/triggers.yml

.template_pkg_vars:
  FLAVORS_PKG: ['deb', 'rpm']

# Releases of opentalk-compose are tagged `compose-vX.Y.Z[-(alpha|beta).N]`; the
# components use their own tags. Keep compose jobs out of pipelines for any other
# tag, and out of branch push pipelines that duplicate an open merge request
# pipeline. Scheduled pipelines on such a branch still run.
.rules_compose_only:
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^compose-v/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never

# Jobs that publish, deploy or trigger other projects need credentials that only
# the upstream project has. Forks run everything up to and including integration.
.rules_upstream_only:
  rules:
    - if: '$CI_PROJECT_ROOT_NAMESPACE != "opentalk"'
      when: never

.default_conditions: &default_conditions
  image: $CI_REGISTRY_IMAGE/pkgbuild:latest
  needs:
    - job: build:pkgbuild
      optional: true
  rules:
    - !reference [.rules_compose_only, rules]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - compose/**/*
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - compose/**/*
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      changes:
        - compose/**/*
    - if: '$CI_COMMIT_TAG =~ /^compose-v\d+\.\d+\.\d+/'
  before_script:
    - cd "$CI_PROJECT_DIR/compose"

build:pkgbuild:
  stage: image
  image: docker:27-cli
  services:
    - docker:27-dind
  tags:
    - dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - !reference [.rules_compose_only, rules]
    - changes:
        - compose/extras/ci/pkgbuild/**/*
        - compose/.gitlab-ci.yml
    - when: never
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --use
    - >-
      docker buildx build
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/pkgbuild:cache
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/pkgbuild:cache,mode=max
      --tag $CI_REGISTRY_IMAGE/pkgbuild:latest
      --push
      compose/extras/ci/pkgbuild
