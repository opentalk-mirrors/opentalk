---
# Update /etc/opentalk-compose/settings.yml after a successful migration:
#   - Set s3_storage_provider to the destination
#   - Set compose_service_<source>_enabled: false
#   - Set compose_service_<destination>_enabled: true

- name: Set s3_storage_provider to migration destination
  tags: [s3_migrate_logic]
  ansible.builtin.lineinfile:
    path: "{{ s3_migrate_settings_file }}"
    regexp: '^(\s*)s3_storage_provider\s*:'
    line: "s3_storage_provider: {{ s3_migration_destination }}"
    state: present

- name: Disable source service in settings.yml — update existing line
  tags: [s3_migrate_logic]
  ansible.builtin.lineinfile:
    path: "{{ s3_migrate_settings_file }}"
    regexp: '^(\s*)compose_service_{{ s3_migration_source }}_enabled\s*:'
    line: "compose_service_{{ s3_migration_source }}_enabled: false"
    state: present
  register: _disable_src_line

# If the setting was not present at all, append it.
- name: Disable source service in settings.yml — append if absent
  tags: [s3_migrate_logic]
  ansible.builtin.lineinfile:
    path: "{{ s3_migrate_settings_file }}"
    line: "compose_service_{{ s3_migration_source }}_enabled: false"
    state: present
  when: not _disable_src_line.changed

# otctl starts the destination with an extra variable only, so settings.yml
# may still disable it explicitly. Enable it, or the next deploy stops it.
- name: Enable destination service in settings.yml
  tags: [s3_migrate_logic]
  ansible.builtin.lineinfile:
    path: "{{ s3_migrate_settings_file }}"
    regexp: '^(\s*)compose_service_{{ s3_migration_destination }}_enabled\s*:'
    line: "compose_service_{{ s3_migration_destination }}_enabled: true"
    state: present

- name: Confirm settings update
  tags: [s3_migrate_logic]
  ansible.builtin.debug:
    msg: >-
      settings.yml updated:
        s3_storage_provider: {{ s3_migration_destination }}
        compose_service_{{ s3_migration_source }}_enabled: false
        compose_service_{{ s3_migration_destination }}_enabled: true
