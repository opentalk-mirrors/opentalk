---
# tasks file for opentalk_compose_opentalk_controller

- name: Include manage_controller_config.yml
  ansible.builtin.include_tasks:
    file: manage_controller_config.yml
  when: compose_service_opentalk_controller_enabled | bool

- name: Include manage_docker_compose.yml
  ansible.builtin.include_tasks:
    file: manage_docker_compose.yml
