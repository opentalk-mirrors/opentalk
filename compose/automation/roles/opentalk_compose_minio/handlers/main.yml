---
# handlers file for opentalk_compose_minio
- name: "Restart Docker service minio"
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/minio"
    project_name: "{{ compose_project_name }}"
    files:
      - compose.yml
      - "{{ deploy_dir }}/common.yml"
    recreate: never
    state: restarted

- name: "Recreate Docker service minio"
  community.docker.docker_compose_v2:
    project_src: "{{ services_dir }}/minio"
    project_name: "{{ compose_project_name }}"
    files:
      - compose.yml
      - "{{ deploy_dir }}/common.yml"
    recreate: always
    state: restarted
