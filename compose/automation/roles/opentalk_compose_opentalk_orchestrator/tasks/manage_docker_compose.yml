---
- name: OpenTalk Orchestrator Compose path include
  ansible.builtin.blockinfile:
    path: "{{ deploy_dir }}/compose.yml"
    insertafter: '^include:\\s*$'
    marker: "# Ansible managed - opentalk-orchestrator include {mark}"
    block: |
      - path:
          - services/opentalk-orchestrator/compose.yml
    state: "{{ 'present' if (compose_service_opentalk_orchestrator_enabled | default(false) | bool) else 'absent' }}"
  register: _blockinfile_result

- name: Invalidate compose includes check on blockinfile change # noqa no-handler
  ansible.builtin.set_fact:
    compose_includes_ready: false
  when: _blockinfile_result.changed

- name: Render Orchestrator compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ orchestrator_docker_compose_services_dir }}/opentalk-orchestrator/compose.yml"
    mode: "0644"
  when: compose_service_opentalk_orchestrator_enabled | default(false) | bool

- name: Check if all compose includes exist
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/../roles/opentalk_compose_docker_env/tasks/check_compose_includes.yml"
  when:
    - compose_service_opentalk_orchestrator_enabled | default(false) | bool
    - not (compose_includes_ready | default(false))

- name: Manage OpenTalk Orchestrator Docker Compose state
  community.docker.docker_compose_v2:
    project_src: "{{ orchestrator_docker_compose_project_src }}"
    project_name: "{{ orchestrator_docker_compose_project_name }}"
    services:
      - orchestrator
    files:
      - compose.yml
    state: "{{ orchestrator_docker_compose_services_state }}"
  when:
    - compose_service_opentalk_orchestrator_enabled | default(false) | bool
    - compose_includes_ready | default(false)
