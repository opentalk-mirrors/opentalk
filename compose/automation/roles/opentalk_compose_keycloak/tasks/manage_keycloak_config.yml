---
- name: Ensure Keycloak Service directory
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
    state: directory
  with_items:
    - "{{ keycloak_docker_compose_services_dir }}"
    - "{{ keycloak_docker_compose_services_dir }}/keycloak"
    - "{{ keycloak_docker_compose_services_dir }}/keycloak/import"

- name: Copy Opentalk Keycloak theme
  ansible.builtin.copy:
    src: keycloak-ot-theme.jar
    dest: "{{ keycloak_docker_compose_services_dir }}/keycloak/keycloak-ot-theme.jar"
    mode: "0644"
