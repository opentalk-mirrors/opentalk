---
# Backup tasks for opentalk_compose_backup : backup_config.yml

- name: Ensure config backup directory
  ansible.builtin.command:
    cmd: mkdir -p "{{ backup_dir_config }}"
    creates: "{{ backup_dir_config }}"

- name: Create config backup archive
  community.general.archive:
    path: "{{ config_dir }}"
    dest: "{{ backup_dir_config }}/{{ config_backup_file_name }}"
    format: gz
    mode: "0600"
    remove: false
