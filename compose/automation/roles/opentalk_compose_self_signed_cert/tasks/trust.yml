---
# tasks file for opentalk_compose_self_signed_cert

- name: Resolve source CA certificate path
  ansible.builtin.set_fact:
    self_signed_ca_src: "{{ custom_certificates_certs_dir }}/{{ self_signed_certificates_ssl_certificate_ca_file }}"

- name: Check that CA certificate exists
  ansible.builtin.stat:
    path: "{{ self_signed_ca_src }}"
  register: ca_src_stat
  failed_when: not ca_src_stat.stat.exists

- name: Determine default trust destination based on platform
  ansible.builtin.set_fact:
    system_trust_dest_default: >-
      {{ {
          'RedHat': '/etc/pki/ca-trust/source/anchors/' + self_signed_certificates_system_trust_name,
          'Suse': '/usr/share/pki/trust/anchors/' + self_signed_certificates_system_trust_name,
          'Debian': '/usr/local/share/ca-certificates/' + self_signed_certificates_system_trust_name
        }[ansible_facts['os_family']] | default('/usr/local/share/ca-certificates/' + self_signed_certificates_system_trust_name) }}

- name: Initialize system_trust_dest with default
  ansible.builtin.set_fact:
    system_trust_dest: "{{ system_trust_dest_default }}"

- name: Override system_trust_dest if override variable is non-empty
  ansible.builtin.set_fact:
    system_trust_dest: "{{ self_signed_certificates_system_trust_dest_override }}"
  when: self_signed_certificates_system_trust_dest_override is defined and
        (self_signed_certificates_system_trust_dest_override | string | length) > 0

- name: Debug computed trust destination (pre-validation)
  ansible.builtin.debug:
    msg: "Computed trust destination: {{ system_trust_dest }} (os_family={{ ansible_facts['os_family'] }})"
  when: system_trust_dest is defined

- name: Fail if trust destination is empty
  ansible.builtin.fail:
    msg: "Computed system_trust_dest is empty; check OS family detection or override variable."
  when: system_trust_dest | default('') | length == 0

- name: Ensure trust destination directory exists
  ansible.builtin.file:
    path: "{{ system_trust_dest | dirname }}"
    state: directory
    mode: '0755'
  when: system_trust_dest | dirname != '/'

- name: Ensure ca-certificates package present (Debian like)
  ansible.builtin.package:
    name: ca-certificates
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure ca-certificates / update-ca-trust packages present (RedHat like)
  ansible.builtin.package:
    name: ca-certificates
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure ca-certificates package present (Suse like)
  ansible.builtin.package:
    name: ca-certificates
    state: present
  when: ansible_facts['os_family'] == 'Suse'

- name: Copy CA certificate into system trust anchor directory
  ansible.builtin.copy:
    src: "{{ self_signed_ca_src }}"
    dest: "{{ system_trust_dest }}"
    owner: root
    group: root
    mode: '0644'
  register: copy_trust
  notify: refresh system ca trust

- name: Flush handlers to update system trust immediately # noqa no-handler
  ansible.builtin.meta: flush_handlers
  when: copy_trust is changed

- name: Debug trust installation (verbose) # noqa no-handler
  ansible.builtin.debug:
    msg: "Installed/verified CA trust anchor at {{ system_trust_dest }}"
  when: copy_trust is changed

# The handler 'refresh system ca trust' will run update-ca-certificates or update-ca-trust depending on OS family.
