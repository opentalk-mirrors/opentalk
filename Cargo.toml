[package]
name = "opentalk-client-signaling"
version = "0.1.0"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-client-signaling"
license = "EUPL-1.2"

[features]
chat = ["types/signaling-chat"]
default = ["chat", "recording-service"]
recording-service = ["types/signaling-recording-service"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1.10"
chrono = "0.4"
futures = "0.3"
jsonwebtoken = "9.3"
livekit = "0.7"
log = "0.4"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros"] }
tt = { package = "tokio-tungstenite", version = "0.27" }
types = { package = "opentalk-types", version = "0.43", default-features = false, features = [
  "api",
  "serde",
  "signaling-control",
  "signaling-livekit",
  "signaling-moderation",
  "signaling-recording",
] }

[build-dependencies]
anyhow = "1"
