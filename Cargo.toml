[package]
name = "opentalk-obelisk"
version = "0.22.1"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
license = "EUPL-1.2"
publish = false
build = "build.rs"

[dependencies]
anstream = "1.0"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bitstream-io = "4"
bytes = "1"
bytesstr = "1"
clap = { version = "4.5", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
directories = "6.0"
env_logger = "0.11"
ezk = "0.1"
ezk-audio = "0.1"
ezk-audio-nodes = "0.1"
ezk-g711 = "0.2"
ezk-g722 = "0.1"
ezk-image = "0.4"
ezk-rtp = "0.2"
ezk-sdp-types = "0.6"
ezk-sip-auth = "0.5"
ezk-sip-core = { version = "0.9", features = ["tls-native-tls"] }
ezk-sip-types = "0.6"
ezk-sip-ua = { version = "0.9", default-features = false }
ezk-stun-types = "0.3"
futures = "0.3"
h264-profile-level-id = "0.2"
hound = "3.5"
itertools = "0.14"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
log = "0.4"
native-tls = "0.2"
once_cell = "1.18"
openh264 = "0.9"
openh264-sys2 = "0.9"
opentalk-client-signaling = "0.8"
opentalk-compositor = { version = "0.17", default-features = false }
opentalk-service-auth = "0.2"
opentalk-version = "0.4.0"
owo-colors = "4"
parking_lot = "0.12"
rand = "0.9"
rtp = "0.17"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"
service-probe = "0.4"
service-probe-client = "0.4"
srtp = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
tokio-native-tls = "0.3"
url = { version = "2.2", features = ["serde"] }
webrtc-sys = "0.3"

[patch.crates-io]
# Removes duplicate paste and therefore some compile time
bitpattern = { git = 'https://github.com/kbalt/bitpattern', branch = 'remove-paste-010-patch' }

# Update libsrtp to 2.6 & newer bindgen version until https://github.com/HyeonuPark/srtp2-sys/pull/3 is merged
srtp2-sys = { git = "https://github.com/kbalt/srtp2-sys.git", rev = "fb3d67b5ada52d242c2ab5a06e4e6e22db31d601" }

[build-dependencies]
anyhow = "1"
opentalk-version = "0.4"

[workspace]
members = [".", "xtask"]
