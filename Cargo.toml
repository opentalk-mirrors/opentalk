[workspace]
members = ["opentalk-transcription", "opentalk-transcription-web-api"]
resolver = "2"

[workspace.package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
license = "EUPL-1.2"
publish = false
repository = "https://gitlab.opencode.de/opentalk/transcription"

[workspace.dependencies]
anstream = "1.0"
anyhow = "1"
async-trait = "0.1"
axum = "0.8.4"
clap = "4.5"
config = { version = "0.15", default-features = false }
directories = "6.0"
env_logger = "0.11"
ezk = "0.1"
ezk-audio = "0.1"
ezk-audio-nodes = { version = "0.1", features = ["nnnoiseless"] }
futures = "0.3"
itertools = "0.14"
livekit = "0.8"
log = "0.4"
opentalk-client-signaling = "0.13"
opentalk-orchestrator-client = "0.14.0"
opentalk-service-auth = "0.5"
opentalk-transcription-web-api = { path = "opentalk-transcription-web-api", version = "0.1.0" }
opentalk-types-api-common = "0.12.0"
opentalk-types-common = "0.49.0"
opentalk-version = "0.4"
owo-colors = "4.2"
prometheus = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false }
serde = "1.0"
service-probe = "0.4"
service-probe-client = "0.4"
sysinfo = "0.39"
temp-env = "0.3"
tokio = "1"
whisper-rs = "0.16"
