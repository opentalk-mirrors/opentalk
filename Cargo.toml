[package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
description = "Etherpad API client for use inside OpenTalk"
documentation = "https://docs.rs/opentalk-etherpad-client"
edition = "2024"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
name = "opentalk-etherpad-client"
publish = true
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-etherpad-client"
version = "0.5.0-dev"

[dependencies]
bytes = "1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
  "cookies",
  "json",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
snafu = "0.8"
url = "2"
