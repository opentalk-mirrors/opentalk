[package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
description = "Keycloak admin api client library for use in OpenTalk"
documentation = "https://docs.rs/opentalk-keycloak-admin"
edition = "2021"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
name = "opentalk-keycloak-admin"
publish = true
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-keycloak-admin"
version = "0.2.1"

[dependencies]
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
tokio = "1"
url = "2"

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]
rustls-tls-native-roots = ["reqwest/rustls-tls-native-roots"]
