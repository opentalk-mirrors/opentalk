[package]
name = "opentalk-client-signaling"
description = "OpenTalk Client for conference Signaling API"
version = "0.3.0"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-client-signaling"
license = "EUPL-1.2"

[features]
default = ["livekit"]
livekit = ["dep:livekit"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
futures-util = { version = "0.3", default-features = false }
jsonwebtoken = { version = "10.2", default-features = false, features = ["aws_lc_rs"] }
livekit = { version = "0.7", optional = true }
log = "0.4"
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["macros"] }
tt = { package = "tokio-tungstenite", version = "0.28", default-features = false, features = ["connect", "handshake"] }
types = { version = "0.61", package = "opentalk-types", default-features = false, features = [
  "api",
  "serde",
  "signaling",
] }
webrtc-sys = "0.3"

opentalk-roomserver-client = "0.0.28"
opentalk-roomserver-types = "0.0.28"
opentalk-roomserver-types-livekit = "0.0.28"
opentalk-roomserver-types-moderation = "0.0.28"
opentalk-roomserver-types-raise-hands = "0.0.28"
opentalk-roomserver-types-recording = "0.0.28"
opentalk-service-auth = "0.2"
opentalk-types-api-internal = "0.1.0"
rand = "0.9.2"

[build-dependencies]
anyhow = "1"

# TODO: Remove when removing webrtc-sys
[package.metadata.cargo-machete]
ignored = ["webrtc-sys"]
