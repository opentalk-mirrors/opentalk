[package]
name = "k3k-obelisk"
version = "1.0.0-rc.1"
edition = "2018"
authors = ["Konstantin Baltruschat <k.baltruschat@heinlein-video.de>"]


[dependencies]
config = { version = "0.11", default-features = false, features = ["toml"] }

gst = { package = "gstreamer", version = "0.17" }
gst-app = { package = "gstreamer-app", version = "0.17" }
gst-sdp = { package = "gstreamer-sdp", version = "0.17" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.17", features = [
    "v1_18",
] }
gio = "0.14"

rand = "0.8"

parking_lot = "0.11"

tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
async-trait = "0.1"
futures = "0.3"

bytes = "1"

log = "0.4"
env_logger = "0.9"

anyhow = "1"
thiserror = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "0.8", features = ["serde"] }

reqwest = "0.11"

tt = { package = "tokio-tungstenite", version = "0.15", features = [
    "rustls-tls",
] }

chrono = { version = "0.4", features = ["serde"] }

sdp-types = { version = "0.1", package = "ezk-sdp-types" }
sip-types = { version = "0.1", package = "ezk-sip-types" }
sip-core = { version = "0.1", package = "ezk-sip-core" }
sip-ua = { version = "0.1", package = "ezk-sip-ua" }
sip-auth = { version = "0.1", package = "ezk-sip-auth" }

bytesstr = "1"

once_cell = "1.8"
hound = "3.4"

byte-slice-cast = "1.2"
