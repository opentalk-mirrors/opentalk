[package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2021"
license = "EUPL-1.2"
name = "opentalk-obelisk"
publish = false
version = "0.0.0-dev"

[dependencies]
types = { package = "opentalk-types", version = "0.20.0", features = [
  "rand",
  "serde",
] }
types-signaling = { package = "opentalk-types-signaling", version = "0.20.0", features = [
  "serde",
] }

config = { version = "0.14", default-features = false, features = ["toml"] }

gio = "0.20"
gst = { package = "gstreamer", version = "0.23" }
gst-app = { package = "gstreamer-app", version = "0.23" }
gst-audio = { package = "gstreamer-audio", version = "0.23", features = [
  "v1_22",
] }
gst-base = { package = "gstreamer-base", version = "0.23", features = [
  "v1_22",
] }
gst-plugin-inter = "0.13.0"
gst-rtp = { package = "gstreamer-rtp", version = "0.23", features = ["v1_22"] }
gst-sdp = { package = "gstreamer-sdp", version = "0.23" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.23", features = [
  "v1_22",
] }

compositor = { package = "opentalk-compositor", path = "recorder/compositor" }

rand = "0.8"

parking_lot = "0.12"

async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }

bitstream-io = "2.2"
bytes = "1"
multimap = "0.10"

env_logger = "0.11"
log = "0.4"

anyhow = "1"
thiserror = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

base64 = "0.22"
uuid = { version = "1", features = ["serde"] }

reqwest = { version = "0.11", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
] }

tt = { package = "tokio-tungstenite", version = "0.20", features = [
  "rustls-tls-native-roots",
] }

chrono = { version = "0.4", features = ["serde"] }

sdp-types = { version = "0.3", package = "ezk-sdp-types" }
sip-auth = { version = "0.1", package = "ezk-sip-auth" }
sip-core = { version = "0.3", package = "ezk-sip-core", features = [
  "tls-native-tls",
] }
sip-types = { version = "0.2", package = "ezk-sip-types" }
sip-ua = { version = "0.4", package = "ezk-sip-ua" }
stun-types = { version = "0.1", package = "ezk-stun-types" }

h264-profile-level-id = "0.2"

native-tls = "0.2.11"
tokio-native-tls = "0.3.1"

bytesstr = "1"

hound = "3.5"
once_cell = "1.18"

byte-slice-cast = "1.2"

openidconnect = "3"

anstream = "0.6"
owo-colors = "4"

[patch.crates-io]
# Removes duplicate paste and therefore some compile time
bitpattern = { git = 'https://github.com/kbalt/bitpattern', branch = 'remove-paste-010-patch' }
