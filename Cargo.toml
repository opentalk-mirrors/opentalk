[package]
name = "opentalk-client-signaling"
description = "OpenTalk Client for conference Signaling API"
version = "0.1.0"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-client-signaling"
license = "EUPL-1.2"

[features]
chat = ["types/signaling-chat"]
default = ["chat", "recording-service"]
recording-service = ["types/signaling-recording-service"]

[dependencies]
anyhow = { version = "1", default-features = false }
async-trait = { version = "0.1", default-features = false }
bytes = { version = "1.10", default-features = false }
chrono = { version = "0.4", default-features = false }
futures = { version = "0.3", default-features = false }
jsonwebtoken = { version = "9.3", default-features = false }
livekit = { version = "0.7", default-features = false, features = ["tokio"] }
log = { version = "0.4", default-features = false }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.45", default-features = false, features = ["macros"] }
tt = { package = "tokio-tungstenite", version = "0.27", default-features = false, features = ["connect", "handshake"] }
types = { package = "opentalk-types", version = "0.43", default-features = false, features = [
  "api",
  "serde",
  "signaling-control",
  "signaling-livekit",
  "signaling-moderation",
  "signaling-recording",
] }

[build-dependencies]
anyhow = { version = "1", default-features = false }
