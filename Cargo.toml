[workspace]
members = [
  # Crates
  "crates/opentalk-client-signaling",
  "crates/opentalk-compositor",
  "crates/opentalk-diesel-newtype",
  "crates/opentalk-diesel-newtype/diesel-newtype-impl",
  "crates/opentalk-etherpad-client",
  "crates/opentalk-keycloak-admin",
  "crates/opentalk-report-generation",
  "crates/opentalk-service-auth",
  "crates/opentalk-shared-folder/crates/*",
  "crates/opentalk-types/crates/*",
  "crates/opentalk-version",
  "crates/opentalk-version/canary",

  # Controller
  "controller/crates/*",
  "controller/xtask",

  # Obelisk
  "obelisk",
  "obelisk/xtask",

  # Orchestrator
  "orchestrator/orchestrator",
  "orchestrator/orchestrator-client",
  "orchestrator/orchestrator-shared",

  # Recorder
  "recorder/opentalk-recorder",
  "recorder/opentalk-recorder-web-api",

  # Roomserver
  "roomserver/modules/*/module",
  "roomserver/modules/*/test-util",
  "roomserver/modules/*/types",
  "roomserver/modules/livekit/proxy",
  "roomserver/opentalk-roomserver",
  "roomserver/opentalk-roomserver-client",
  "roomserver/opentalk-roomserver-crypto-provider",
  "roomserver/opentalk-roomserver-dui",
  "roomserver/opentalk-roomserver-modules",
  "roomserver/opentalk-roomserver-room",
  "roomserver/opentalk-roomserver-types",
  "roomserver/opentalk-roomserver-web-api",

  # SMTP-Mailer
  "smtp-mailer",

  # Transcription
  "transcription/opentalk-transcription",
  "transcription/opentalk-transcription-web-api",
]
resolver = "2"

[workspace.package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
repository = "https://gitlab.opencode.de/opentalk/opentalk"
version = "3.0.0"

[workspace.dependencies]

# crates/opentalk-client-signaling
opentalk-client-signaling = { path = "crates/opentalk-client-signaling", version = "3.0.0" }

