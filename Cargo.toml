[package]
name = "opentalk-client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1.10"
chrono = "0.4"
futures = "0.3"
jsonwebtoken = "9.3"
livekit = "0.7"
log = "0.4"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros"] }
tt = { package = "tokio-tungstenite", version = "0.27" }
types = { package = "opentalk-types", version = "0.44", default-features = false, features = [
    "serde",
    "api",
    "signaling-control",
    "signaling-moderation",
    "signaling-livekit",
    "signaling-recording",
] }
async-trait = "0.1.88"

[build-dependencies]
anyhow = "1"
