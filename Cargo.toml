[package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
description = "Keycloak admin api client library for use in OpenTalk"
documentation = "https://docs.rs/opentalk-keycloak-admin"
edition = "2024"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
name = "opentalk-keycloak-admin"
publish = true
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-keycloak-admin"
version = "0.5.0"

[dependencies]
log = "0.4"
openidconnect = { version = "4", default-features = false }
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "json",
  "query",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
tokio = "1"
url = "2"
