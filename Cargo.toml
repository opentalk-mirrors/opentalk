[package]
name = "opentalk-obelisk"
version = "0.19.0-alpha"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2021"
license = "EUPL-1.2"
publish = false

[dependencies]
anstream = "0.6"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bitstream-io = "2.2"
bytes = "1"
bytesstr = "1"
config = { version = "0.15", default-features = false, features = ["toml"] }
env_logger = "0.11"
ezk = "0.1"
ezk-audio = "0.1"
ezk-audio-nodes = "0.1"
ezk-g711 = "0.2"
ezk-g722 = "0.1"
ezk-image = "0.2"
ezk-rtp = "0.2"
futures = "0.3"
h264-profile-level-id = "0.2"
hound = "3.5"
log = "0.4"
native-tls = "0.2.11"
once_cell = "1.18"
openh264 = "0.6"
openidconnect = "3"
opentalk-compositor = { version = "0.12", default-features = false }
owo-colors = "4"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rtp = "0.11.0"
sdp-types = { version = "0.4", package = "ezk-sdp-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service-probe = "0.2"
sip-auth = { version = "0.2", package = "ezk-sip-auth" }
sip-core = { version = "0.5", package = "ezk-sip-core", features = ["tls-native-tls"] }
sip-types = { version = "0.3", package = "ezk-sip-types" }
sip-ua = { version = "0.5", package = "ezk-sip-ua" }
srtp = "0.7"
stun-types = { version = "0.2", package = "ezk-stun-types" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
tokio-native-tls = "0.3.1"
tt = { package = "tokio-tungstenite", version = "0.20", features = ["rustls-tls-native-roots"] }
types-signaling = { package = "opentalk-types-signaling", version = "0.28.0", features = ["serde"] }
types-signaling-control = { package = "opentalk-types-signaling-control", version = "0.28.0", features = ["serde"] }
webrtc-sys = "0.3"

[patch.crates-io]
# Removes duplicate paste and therefore some compile time
bitpattern = { git = 'https://github.com/kbalt/bitpattern', branch = 'remove-paste-010-patch' }

# Until they actually push the version on crates.io this will have to do
webrtc-sys = { git = "https://github.com/livekit/rust-sdks.git", rev = "06997356c083b01da766c4c93e8c4e8354d871ce" }
libwebrtc = { git = "https://github.com/livekit/rust-sdks.git", rev = "06997356c083b01da766c4c93e8c4e8354d871ce" }
livekit = { git = "https://github.com/livekit/rust-sdks.git", rev = "06997356c083b01da766c4c93e8c4e8354d871ce" }
livekit-api = { git = "https://github.com/livekit/rust-sdks.git", rev = "06997356c083b01da766c4c93e8c4e8354d871ce" }
livekit-runtime = { git = "https://github.com/livekit/rust-sdks.git", rev = "06997356c083b01da766c4c93e8c4e8354d871ce" }

# Update libsrtp to 2.6 & newer bindgen version until https://github.com/HyeonuPark/srtp2-sys/pull/3 is merged
srtp2-sys = { git = "https://github.com/kbalt/srtp2-sys.git", rev = "fb3d67b5ada52d242c2ab5a06e4e6e22db31d601" }
