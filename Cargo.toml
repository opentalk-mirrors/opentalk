[package]
name = "opentalk-client-signaling"
description = "OpenTalk Client for conference Signaling API"
version = "0.1.0"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-client-signaling"
license = "EUPL-1.2"

[features]
chat = ["types/signaling-chat"]
default = ["chat", "livekit", "recording-service", "transcription-service"]
livekit = ["dep:livekit"]
recording-service = ["types/signaling-recording-service"]
transcription-service = ["types/signaling-transcription"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1.10"
chrono = { version = "0.4", default-features = false }
futures-util = { version = "0.3", default-features = false }
jsonwebtoken = { version = "9.3", default-features = false }
livekit = { version = "0.7", optional = true }
log = "0.4"
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros"] }
tt = { package = "tokio-tungstenite", version = "0.27", default-features = false, features = ["connect", "handshake"] }
types = { version = "0.47", package = "opentalk-types", default-features = false, features = [
  "api",
  "serde",
  "signaling-control",
  "signaling-livekit",
  "signaling-moderation",
  "signaling-recording",
  "signaling-transcription",
] }

[build-dependencies]
anyhow = "1"
