[package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
description = "Etherpad API client for use inside OpenTalk"
documentation = "https://docs.rs/opentalk-etherpad-client"
edition = "2021"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
name = "opentalk-etherpad-client"
publish = true
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-etherpad-client"
version = "0.1.0"

[dependencies]
bytes = "1"
futures = "0.3"
reqwest = { version = "0.11", default-features = false, features = ["json", "cookies", "stream"] }
serde_json = "1"
serde_repr = "0.1"
serde = { version = "1", features = ["derive"] }
snafu = "0.8"
url = "2"

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-tls"]
rustls-tls-native-roots = ["reqwest/rustls-tls-native-roots"]
