[package]
name = "opentalk-client-signaling"
description = "OpenTalk Client for conference Signaling API"
version = "0.15.0"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2024"
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/libs/opentalk-client-signaling"
license = "EUPL-1.2"

[features]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false }
futures-util = { version = "0.3", default-features = false }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
log = "0.4"
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
opentalk-roomserver-client = "0.9"
opentalk-roomserver-types = "0.9"
opentalk-roomserver-types-livekit = "0.9"
opentalk-roomserver-types-moderation = "0.9"
opentalk-roomserver-types-raise-hands = "0.9"
opentalk-roomserver-types-recording = "0.9"
opentalk-roomserver-types-transcription = "0.9"
opentalk-service-auth = "0.6.0"
opentalk-types = { version = "0.75.0", default-features = false, features = [
  "api",
  "serde",
  "signaling",
] }
opentalk-types-api-internal = "0.7.0"
rand = "0.10.1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.51", features = ["macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[build-dependencies]
anyhow = "1"
