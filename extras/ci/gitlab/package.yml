.package:
  stage: package
  needs:
    - job: build:pkgbuild
      optional: true
    - lint:shellcheck
    - lint:yamllint
    - lint:markdown
    - lint:ansible-lint
    - lint:licensing
    - lint:commitlint
  parallel:
    matrix:
      - FLAVOR: !reference [.template_pkg_vars, FLAVORS_PKG]
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "success" ] && [ "$FLAVOR" = "rpm" ]; then
        export GNUPGHOME="$HOME/.gnupg"
        mkdir -p "$GNUPGHOME"
        chmod 700 "$GNUPGHOME"
        export GPG_TTY=$(tty 2>/dev/null || echo /dev/tty)
        echo "Importing GPG key..."
        echo "$GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
        GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
        echo "Using GPG_KEY_ID=$GPG_KEY_ID"
        echo "$GPG_PASSPHRASE" > /tmp/.gpg-passphrase
        chmod 600 /tmp/.gpg-passphrase
        echo "%_signature gpg" > ~/.rpmmacros
        echo "%_gpg_path $GNUPGHOME" >> ~/.rpmmacros
        echo "%_gpg_name $GPG_KEY_ID" >> ~/.rpmmacros
        echo "%__gpg_sign_cmd %{__gpg} gpg --batch --pinentry-mode loopback --passphrase-file /tmp/.gpg-passphrase --no-verbose --no-armor --no-secmem-warning -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}" >> ~/.rpmmacros
        for pkg in artifacts/*.rpm; do
          echo "Signing $pkg"
          rpmsign --addsign "$pkg"
        done
        rm -f /tmp/.gpg-passphrase
      fi

package:stable:
  extends: .package
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/'
    - when: never
  script:
    - just "build-${FLAVOR}-version" "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - artifacts/*
    expire_in: 1 day

package:pre-release:
  extends: .package
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)$/'
    - when: never
  script:
    - just "build-${FLAVOR}-version" "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - artifacts/*
    expire_in: 1 day

package:experimental:
  extends: .package
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        VERSION="$(yq -r '.opentalk_product_version' .versions.yml)+git${CI_COMMIT_SHORT_SHA}"
      else
        VERSION="${CI_COMMIT_TAG}+git${CI_COMMIT_SHORT_SHA}"
      fi
      echo "VERSION=$VERSION"
    - just "build-${FLAVOR}-version" "$VERSION"
  artifacts:
    paths:
      - artifacts/*
    expire_in: 2 hours

upload:stable:
  stage: upload
  parallel:
    matrix:
      - FLAVOR: !reference [.template_pkg_vars, FLAVORS_PKG]
  needs:
    - job: package:stable
      artifacts: true
    - job: int:stable
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/'
    - when: never
  script:
    - |
      for file in artifacts/*.${FLAVOR}; do
        [ -f "$file" ] || continue
        filename=$(basename "$file")
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$file" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/opentalk-compose/${CI_COMMIT_TAG}/$filename"
        echo "Uploaded to gitlab: $filename"
        if [ "$FLAVOR" = "deb" ]; then
            NEXUS_URL="${NEXUS_REPO_BASE_URL}/${NEXUS_REPO_NAME_DEB_STABLE}/"
            curl --progress-bar -v -u "${NEXUS_API_USER}:${NEXUS_API_KEY}" -H "Content-Type: multipart/form-data" --data-binary "@${file}" "${NEXUS_URL}" | tee /dev/null
            echo "Uploaded to Nexus: $filename"
        fi
        if [ "$FLAVOR" = "rpm" ]; then
            NEXUS_URL="${NEXUS_REPO_BASE_URL}/${NEXUS_REPO_NAME_RPM_STABLE}/"
            curl --progress-bar -v -u "${NEXUS_API_USER}:${NEXUS_API_KEY}" --upload-file ${file} "${NEXUS_URL}" | tee /dev/null
            echo "Uploaded to Nexus: $filename"
        fi
        echo "curl -u \"${NEXUS_API_USER}:${NEXUS_API_KEY}\" -H \"Content-Type: multipart/form-data\" --data-binary \"@${file}\" \"${NEXUS_URL}\""
        curl -u "${NEXUS_API_USER}:${NEXUS_API_KEY}" -H "Content-Type: multipart/form-data" --data-binary "@${file}" "${NEXUS_URL}"
        echo "Uploaded to Nexus: $filename"
        openrepo --debug upload "$file" -r "${FLAVOR}" -o
        echo "Uploaded to openrepo (stable): $filename"
        sleep 2
      done

