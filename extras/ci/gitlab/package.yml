.rules_stable:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/'
    - when: never

.rules_pre_release:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)$/'
    - when: never

.rules_experimental:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

.package:
  stage: package
  before_script:
    - bash extras/ci/gitlab/update-product-version.sh
  needs:
    - job: build:pkgbuild
      optional: true
    - lint:shellcheck
    - lint:yamllint
    - lint:markdown
    - lint:ansible-lint
    - lint:licensing
    - lint:commitlint
  parallel:
    matrix:
      - FLAVOR: !reference [.template_pkg_vars, FLAVORS_PKG]
  after_script:
    - bash extras/ci/gitlab/sign-rpm-packages.sh

.package_release:
  extends: .package
  script:
    - just "build-${FLAVOR}-version" "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - artifacts/*
    expire_in: 1 day

package:stable:
  extends: .package_release
  rules: !reference [.rules_stable, rules]

package:pre-release:
  extends: .package_release
  rules: !reference [.rules_pre_release, rules]

package:experimental:
  extends: .package
  rules: !reference [.rules_experimental, rules]
  script:
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        VERSION="$(yq -r '.opentalk_product_version' .versions.yml)+git${CI_COMMIT_SHORT_SHA}"
      else
        VERSION="${CI_COMMIT_TAG}+git${CI_COMMIT_SHORT_SHA}"
      fi
      echo "VERSION=$VERSION"
    - just "build-${FLAVOR}-version" "$VERSION"
  artifacts:
    paths:
      - artifacts/*
    expire_in: 2 hours

.upload_base:
  stage: upload
  parallel:
    matrix:
      - FLAVOR: !reference [.template_pkg_vars, FLAVORS_PKG]

upload:stable:
  extends: .upload_base
  needs:
    - job: package:stable
      artifacts: true
    - job: int:stable
  rules: !reference [.rules_stable, rules]
  script:
    - bash extras/ci/gitlab/upload-release.sh "${FLAVOR}" "stable"

upload:pre-release:
  extends: .upload_base
  needs:
    - job: package:pre-release
      artifacts: true
    - job: int:pre-release
  rules: !reference [.rules_pre_release, rules]
  script:
    - bash extras/ci/gitlab/upload-release.sh "${FLAVOR}" "testing"

upload:experimental:
  extends: .upload_base
  needs:
    - job: package:experimental
      artifacts: true
    - job: int:experimental
  rules: !reference [.rules_experimental, rules]
  script:
    - bash extras/ci/gitlab/upload-release.sh "${FLAVOR}" "experimental"
