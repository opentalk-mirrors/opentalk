.rules_stable:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/'
    - when: never

.rules_pre_release:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)$/'
    - when: never

.rules_experimental:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

.int_base:
  stage: integration
  tags:
    - dind
  image: git.opentalk.dev:5050/opentalk/opentalk-devops/containers/pkgtest-dind/${DIST}:dev
  before_script:
    - bash extras/ci/gitlab/setup-integration-env.sh

# ------------------------------
# INTEGRATION TESTS
# ------------------------------

int:experimental:
  extends: .int_base
  parallel:
    matrix:
      - DIST: debian12
      - DIST: debian13
      - DIST: ubuntu2404
      - DIST: opensuse15
      - DIST: opensuse16
      - DIST: rocky9
      - DIST: rocky10
      - DIST: debian13
        EXTRA_OPTIONAL_SERVICES: "with-optional-services"
      - DIST: rocky10
        EXTRA_OPTIONAL_SERVICES: "with-optional-services"
  needs:
    - job: package:experimental
      artifacts: true
  rules: !reference [.rules_experimental, rules]
  variables:
    OT_SETTINGS: |
      ot_domain: 'opentalk-ci.test'
      ot_ingress_port: 443
      ot_ingress_protocol: https
      config_dir: "/etc/opentalk-compose"
      services_dir: "/opt/opentalk-compose/services"
      deploy_dir: "/opt/opentalk-compose"
      compose_project_name: "opentalk"
      compose_service_opentalk_controller_enabled: true
      compose_service_opentalk_roomserver_enabled: false
      compose_service_opentalk_orchestrator_enabled: false
      compose_service_opentalk_obelisk_enabled: false
      compose_service_opentalk_outlook_add_in_enabled: false
      compose_service_opentalk_recorder_enabled: true
      compose_service_opentalk_smtp_mailer_enabled: true
      compose_service_opentalk_web_frontend_enabled: true
      compose_service_etherpad_enabled: true
      compose_service_spacedeck_enabled: true
      compose_service_keycloak_enabled: true
      compose_service_livekit_server_enabled: true
      compose_service_minio_enabled: true
      compose_service_rabbitmq_enabled: true
      compose_service_traefik_enabled: true
      compose_service_ndt_enabled: true
      compose_service_mailcrab_enabled: false
      self_signed_certificates_generate: true
      custom_certificates_enabled: true
      custom_certificates_fullchain_cert_file: fullchain.crt
      custom_certificates_private_key_file: privkey.key
      custom_certificates_ca_root_cert_file: ca.crt
      controller_docker_extra_hosts:
        - "host.docker.internal:host-gateway"
        - "opentalk-ci.test:host-gateway"
      recorder_docker_extra_hosts:
        - "host.docker.internal:host-gateway"
        - "opentalk-ci.test:host-gateway"
      obelisk_docker_extra_hosts:
        - "host.docker.internal:host-gateway"
        - "opentalk-ci.test:host-gateway"
  before_script:
    - !reference [.int_before_script, before_script]
  script:
    - |
      OS_ID="$(. /etc/os-release && echo "$ID")"
      case "$OS_ID" in
         debian|ubuntu)
              echo "Debian-/Ubuntu-based Distribution: $OS_ID"
              docker info
              DEB_FILE=$(ls artifacts/*.deb 2>/dev/null || true)
              echo "Installing ${DEB_FILE}..."
              dpkg -i "$DEB_FILE" || apt-get install -f -y
              echo "$OT_SETTINGS" > /etc/opentalk-compose/settings.yml
              if [ "${EXTRA_OPTIONAL_SERVICES:-}" = "with-optional-services" ]; then
                  sed -i \
                      -e 's/^compose_service_opentalk_orchestrator_enabled: false$/compose_service_opentalk_orchestrator_enabled: true/' \
                      -e 's/^compose_service_opentalk_obelisk_enabled: false$/compose_service_opentalk_obelisk_enabled: true/' \
                      -e 's/^compose_service_opentalk_outlook_add_in_enabled: false$/compose_service_opentalk_outlook_add_in_enabled: true/' \
                      /etc/opentalk-compose/settings.yml
                  echo "Extra optional services (orchestrator, obelisk, outlook) enabled for this distro slot."
              fi
              otctl deploy
              COMPOSE_PROJECT_NAME=opentalk bash extras/scripts/tests/integration/test_deployment_runtime.sh
              COMPOSE_PROJECT_NAME=opentalk bash extras/scripts/tests/integration/test_smtp_mailer_rabbitmq.sh
              ;;
          rocky)
              echo "RHEL-based Distribution: $OS_ID"
              docker info
              RPM_FILE=$(ls artifacts/*.rpm 2>/dev/null || true)
              echo "Installing ${RPM_FILE}..."
              dnf install -y "$RPM_FILE" --nogpgcheck
              echo "$OT_SETTINGS" > /etc/opentalk-compose/settings.yml
              if [ "${EXTRA_OPTIONAL_SERVICES:-}" = "with-optional-services" ]; then
                  sed -i \
                      -e 's/^compose_service_opentalk_orchestrator_enabled: false$/compose_service_opentalk_orchestrator_enabled: true/' \
                      -e 's/^compose_service_opentalk_obelisk_enabled: false$/compose_service_opentalk_obelisk_enabled: true/' \
                      -e 's/^compose_service_opentalk_outlook_add_in_enabled: false$/compose_service_opentalk_outlook_add_in_enabled: true/' \
                      /etc/opentalk-compose/settings.yml
                  echo "Extra optional services (orchestrator, obelisk, outlook) enabled for this distro slot."
              fi
              otctl deploy
              COMPOSE_PROJECT_NAME=opentalk bash extras/scripts/tests/integration/test_deployment_runtime.sh
              COMPOSE_PROJECT_NAME=opentalk bash extras/scripts/tests/integration/test_smtp_mailer_rabbitmq.sh
              ;;
          opensuse-leap)
              echo "SUSE-based Distribution: $OS_ID"
              docker info
              RPM_FILE=$(ls artifacts/*.rpm 2>/dev/null || true)
              echo "Installing ${RPM_FILE}..."
              zypper --non-interactive --no-gpg-checks install "$RPM_FILE"
              echo "$OT_SETTINGS" > /etc/opentalk-compose/settings.yml
              otctl deploy
              COMPOSE_PROJECT_NAME=opentalk bash extras/scripts/tests/integration/test_deployment_runtime.sh
              COMPOSE_PROJECT_NAME=opentalk bash extras/scripts/tests/integration/test_smtp_mailer_rabbitmq.sh
              ;;
          *)
              echo "Unknown or unsupported Distribution: $OS_ID"
              exit 1
              ;;
      esac

