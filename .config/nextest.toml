[profile.default]
default-filter = 'not test(export_bindings)'

[[profile.default.overrides]]
filter = 'test(serial_test)'
test-group = 'serial'

[profile.ci]
default-filter = 'all()'

[profile.ci.junit]
path = "junit.xml"

[test-groups]
serial = { max-threads = 1 }
