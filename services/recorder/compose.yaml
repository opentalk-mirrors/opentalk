services:
  recorder:
    image: ${RECORDER_IMAGE_SRC}:${RECORDER_VERSION}
    profiles: [ "standard", "full", "recorder"]
    restart: always
    environment:
      TZ: ${TZ:-Europe/Berlin}
      RUST_LOG: info,opentalk_recorder=debug,rustls=info,opentalk_recorder::signaling=debug
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ../../config/services-config/recorder/recorder.toml:/recorder/config.toml
    healthcheck:
      test:
      - "CMD-SHELL"
      - |
        perl -MIO::Socket::INET -e 'my $$sock = IO::Socket::INET->new(PeerAddr => "localhost:11411", Proto => "tcp") or exit 1; 
        print $$sock "GET / HTTP/1.1\r\nHost: localhost\r\n\r\n"; my $$response = <$$sock>; exit ($$response =~ /200 OK/ ? 0 : 1);'
    depends_on:
      cforge:
        condition: service_completed_successfully
      controller:
        condition: service_started
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_started
