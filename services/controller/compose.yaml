services:
  controller:
    image: ${CONTROLLER_IMAGE_SRC}:${CONTROLLER_VERSION}
    profiles: ["core", "standard", "full", "controller"]
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 11311:11311
    volumes:
      - ../../config/services-config/controller/controller.toml:/controller/controller.toml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.controller.rule=Host(`${OT_DOMAIN}`) && PathPrefix(`/controller`)"
      - "traefik.http.routers.controller.entrypoints=websecure"
      - "traefik.http.routers.controller.tls.certresolver=letsencrypt"
      - "traefik.http.routers.controller.middlewares=controller-strip"
      - "traefik.http.middlewares.controller-strip.stripprefix.prefixes=/controller"
      - "traefik.http.services.controller.loadbalancer.server.port=11311"
    healthcheck:
      test:
      - "CMD-SHELL"
      - |
        perl -MIO::Socket::INET -e 'my $$sock = IO::Socket::INET->new(PeerAddr => "localhost:11311",
        Proto => "tcp") or exit 1; exit 0;'
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      controller-db:
        condition: service_healthy
