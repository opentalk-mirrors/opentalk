services:
  mailer:
    image: ${MAILER_IMAGE_SRC}:${MAILER_VERSION}
    profiles: [ "standard", "full", "mailer"]
    restart: always
    volumes:
      - ../../config/services-config/mailer/mailer.toml:/opt/smtp-mailer/smtp-mailer.toml
    healthcheck:
      test:
      - "CMD-SHELL"
      - |
        perl -MIO::Socket::INET -e 'my $$sock = IO::Socket::INET->new(PeerAddr => "localhost:11411", Proto => "tcp") or exit 1; 
        print $$sock "GET / HTTP/1.1\r\nHost: localhost\r\n\r\n"; my $$response = <$$sock>; exit ($$response =~ /200 OK/ ? 0 : 1);'
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      cforge:
        condition: service_completed_successfully