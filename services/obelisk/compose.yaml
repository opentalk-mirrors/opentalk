services:
  obelisk:
    image: ${OBELISK_IMAGE_SRC}:${OBELISK_VERSION}
    profiles: [ "full", "obelisk"]
    network_mode: host
    restart: always
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      GST_DEBUG: ${GST_DEBUG:-2}
      OPENTALK_OBLSK__CLIENT_SECRET: "${OPENTALK_OBLSK__CLIENT_SECRET:-}"
    volumes:
      - ../../config/services-config/obelisk/obelisk.toml:/obelisk/obelisk.toml
    healthcheck:
      test:
      - "CMD-SHELL"
      - |
        perl -MIO::Socket::INET -e 'my $$sock = IO::Socket::INET->new(PeerAddr => "localhost:11411", Proto => "tcp") or exit 1; 
        print $$sock "GET / HTTP/1.1\r\nHost: localhost\r\n\r\n"; my $$response = <$$sock>; exit ($$response =~ /200 OK/ ? 0 : 1);'
    #depends_on:
    #  controller:
    #    condition: service_started
    #  keycloak:
    #    condition: service_started
    #  rabbitmq:
    #    condition: service_started

