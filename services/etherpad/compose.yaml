services:
  etherpad:
    image: ${ETHERPAD_IMAGE_SRC}:${ETHERPAD_VERSION}
    profiles: [ "standard", "full", "pad"]
    restart: always
    environment:
      EP_APIKEY_FILE: /run/secrets/etherpad_api_secret
      TRUST_PROXY: ${TRUST_PROXY:-true}
      DEFAULT_PAD_TEXT: ${DEFAULT_PAD_TEXT:-Welcome to OpenTalk}
      SUPPRESS_ERRORS_IN_PAD_TEXT: ${SUPPRESS_ERRORS_IN_PAD_TEXT:-true}
    secrets:
      - etherpad_api_secret
    volumes:
      - ./init/entrypoint.sh:/opt/etherpad-lite/entrypoint.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.etherpad.rule=Host(`${OT_DOMAIN}`) && PathPrefix(`/etherpad`)"
      - "traefik.http.routers.etherpad.entrypoints=websecure"
      - "traefik.http.routers.etherpad.tls.certresolver=letsencrypt"
      - "traefik.http.routers.etherpad.priority=100"
      - "traefik.http.routers.etherpad.middlewares=etherpad-strip"
      - "traefik.http.middlewares.etherpad-strip.stripprefix.prefixes=/etherpad"
      - "traefik.http.services.etherpad.loadbalancer.server.port=9001"

secrets:
  etherpad_api_secret:
    file: ${CONTAINER_SECRETS_PATH:-../../config/secrets}/.etherpad_api.secret