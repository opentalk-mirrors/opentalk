services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE_SRC}:${RABBITMQ_VERSION}
    profiles: ["core", "standard", "full", "rabbitmq"]
    restart: always
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_management path_prefix "/adm/rabbitmq"'
    healthcheck:
      test: rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q status && rabbitmq-diagnostics -q alarms
      interval: 30s
      timeout: 15s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`${OT_DOMAIN}`) && PathPrefix(`/adm/rabbitmq`)"
      - "traefik.http.routers.rabbitmq.entrypoints=websecure"
      - "traefik.http.routers.rabbitmq.tls.certresolver=letsencrypt"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
