---
services:
  ofelia:
    image: ${OFELIA_IMAGE_SRC}:${OFELIA_VERSION}
    profiles: ["core", "standard", "full", "cron", "ofelia"]
    environment:
      TZ: Europe/Berlin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../../config/services-config/3rd_party/ofelia/ofelia.ini:/etc/ofelia/config.ini
    healthcheck:
      test: ["CMD-SHELL", "pgrep -lx '/usr/bin/ofelia' > /dev/null || exit 1"]
      interval: 5s
      timeout: 1s
      retries: 1
      start_period: 10s
