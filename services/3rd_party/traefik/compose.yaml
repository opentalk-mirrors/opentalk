services:
  traefik:
    image: ${TRAEFIK_IMAGE_SRC}:${TRAEFIK_VERSION}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      - target: 8080
        published: 7777
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
    labels:
      - "traefik.enable=true"
      # HeadersRegexp is needed to serve both, Api and Dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${OT_DOMAIN}`) && (PathPrefix(`/adm/traefik`) || HeaderRegexp(`Referer`, `/traefik`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-strip"
      - "traefik.http.middlewares.dashboard-strip.stripprefix.prefixes=/adm/traefik"
    volumes:
      - ./config:/etc/traefik
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      cforge:
        condition: service_completed_successfully

