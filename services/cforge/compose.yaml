services:
  cforge:
    image: ${CFORGE_IMAGE_SRC}:${CFORGE_VERSION}
    restart: "no"
    environment:
      OT_DOMAIN: $OT_DOMAIN
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      ENABLE_CFORGE: ${ENABLE_CFORGE:-true}
      FORCE_SECRETS: ${FORCE_SECRETS:-false}
      FORCE_CONFIG: ${FORCE_CONFIG:-false}
      CFORGE_IMAGE_SRC: ${CFORGE_IMAGE_SRC}
      CFORGE_VERSION: ${CFORGE_VERSION}
    env_file:
      - ../../.versions
    command:
      - --diff
      - apply
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - controller-db:/data/controller-db
      - keycloak-db:/data/keycloak-db
      - minio:/data/minio
      - traefik:/data/traefik
      - backups:/backups
      - ./ansible:/ansible
      - ../../config:/config
      - ../../:/opentalk
