services:
  cforge:
    image: ${CFORGE_IMAGE_SRC}:${CFORGE_VERSION}
    build: .
    restart: "no"
    environment:
      OT_DOMAIN: $OT_DOMAIN
      ENABLE_CFORGE: ${ENABLE_CFORGE:-true}
      FORCE_SECRETS: ${FORCE_SECRETS:-false}
      FORCE_CONFIG: ${FORCE_CONFIG:-false}
      MISSING_KEY_BEHAVIOR: ${MISSING_KEY_BEHAVIOR:-default}
    volumes:
      - ../../:/deploy_dir:z
      - ./data:/data:z
      - ./ansible:/ansible:z
