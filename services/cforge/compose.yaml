services:
  cforge:
    image: ${CFORGE_IMAGE_SRC}:${CFORGE_VERSION}
    restart: "no"
    environment:
      OT_DOMAIN: $OT_DOMAIN
      ENABLE_CFORGE: ${ENABLE_CFORGE:-true}
      FORCE_SECRETS: ${FORCE_SECRETS:-false}
      FORCE_CONFIG: ${FORCE_CONFIG:-false}
      CFORGE_IMAGE_SRC: ${CFORGE_IMAGE_SRC}
      CFORGE_VERSION: ${CFORGE_VERSION}
    volumes:
      - ./ansible:/ansible
      - ../../config:/config
      - /var/opt/opentalk-compose/data:/data
      - /var/opt/opentalk-compose/backups:/backups

