---
Deployment:
  environment: prod
  force_compose_override: true
  force_settings_yaml: false
  #scenario: 
  #  - external_keycloak
  #  - external_livekit
  #  - external_recorder  

CustomCertificates:
  enabled: false
  ssl_certificate_fullchain_file: "server_fullchain.crt"
  ssl_certificate_key_file: "server.key"
CustomCA:
  enabled: false
  ssl_ca_file: "ca.crt"

postInstall:
  demoUser:
    state: "present"
    enabled: "True"
    name: "demo"
    password: "{{ DEMO_USER_PASSWORD }}"
    email: "demo.user@{{ OT_DOMAIN }}"
    firstName: "Test"
    lastName: "User"

Ofelia:
  jobs:
    createBackup:
      name: full_backup
      type: run
      network: opentalk_default
      schedule: "@daily"
      image: "{{ CFORGE_IMAGE_SRC }}:{{ CFORGE_VERSION }}"
      command: "ansible-playbook -i inventory.yaml playbooks/render_config.yaml -t createBackup"
      volumes:
        - /opt/opentalk-compose/services/cforge/ansible:/ansible
        - /opt/opentalk-compose/config:/config
        - /var/opt/opentalk-compose/data:/data
        - /var/opt/opentalk-compose/backups:/backups
      environment:
        - ENABLE_CFORGE=true
    cleanBackup:
      name: backup_retention
      type: run
      schedule: "@daily"
      image: "{{ CFORGE_IMAGE_SRC }}:{{ CFORGE_VERSION }}"
      command: "find /backups -maxdepth 1 -mtime +6 -type f -delete"
      volumes:
        - /var/opt/opentalk-compose/backups:/backups
