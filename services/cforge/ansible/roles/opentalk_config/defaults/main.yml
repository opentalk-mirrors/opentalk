#    saveOnlyOnError: only save a report if the execution was not successful.

Keycloak:
  mode: external
  manage_enabled: true
  auth:
    username: admin
    password: "{{ KC_BOOTSTRAP_ADMIN_PASSWORD }}"
    realm: master
  realm: "opentalk"
  login_theme: "opentalk"
  account_theme: "opentalk"
  base_url: "https://{{ OT_DOMAIN }}/auth"
  api_base_url: "https://{{ OT_DOMAIN }}/auth/admin/realms/opentalk"
  hostname: "{{ OT_DOMAIN | default('keycloak') }}"
  proxy: edge
  proxy_headers: xforwarded
  db:
    vendor: postgres
    username: ot
    password: "{{ KEYCLOAK_DB_PASSWORD }}"
    schema: public
    url:
      database: keycloak # database name
      host: keycloak-db
      port: 5432
  health_enabled: "true"
  metrics_enabled: "true"
  health_url: "https://{{ OT_DOMAIN }}/auth/realms/master"
  http:
    relative_path: /auth
  spi_sticky_session_encoder_infinispan_should_attach_route: "false"
  redirectUris:
    uris:
      - "https://{{ OT_DOMAIN }}/auth/popup_callback"
      - "https://{{ OT_DOMAIN }}/auth/callback"
      - "https://{{ OT_DOMAIN }}/dashboard"
      - "https://{{ OT_DOMAIN }}/dashboard/*"
      - "https://{{ OT_DOMAIN }}/room/*"
      - "https://{{ OT_DOMAIN }}/join"
      - "https://{{ OT_DOMAIN }}/"

