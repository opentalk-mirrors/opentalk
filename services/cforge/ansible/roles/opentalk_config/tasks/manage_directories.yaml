---
- name: "Ensure minio bucket directory | /var/opt/opentalk-compose/minio/opentalk"
  ansible.builtin.file:
    path: "{{ data_dir }}/minio/opentalk"
    state: directory
    mode: "{{ '777' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '755' }}"
  tags:
    - init

- name: "Ensure service-config directories | config/services-config"
  ansible.builtin.file:
    path: "{{ config_dir }}/services-config/{{ item }}"
    state: directory
    mode: "{{ '777' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '755' }}"
  loop:
    - 3rd_party/minio
    - 3rd_party/livekit
    - 3rd_party/rabbitmq
    - 3rd_party/mailcrab
    - 3rd_party/postgres
    - 3rd_party/traefik
    - 3rd_party/keycloak
    - webapp
    - controller
    - mailer
    - recorder
    - etherpad
    - spacedeck
    - cforge
    - obelisk
    - outlook
  when: 
      - item != '3rd_party/livekit' or (Deployment.scenario is not defined or 'external_livekit' not in Deployment.scenario)
      - item != '3rd_party/keycloak' or (Deployment.scenario is not defined or 'external_keycloak' not in Deployment.scenario)
  tags:
    - init

- name: "Create main cert directory"
  ansible.builtin.file:
    path: "{{ CustomCertificates.certs_dir }}"
    state: directory
    mode: "{{ '777' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '755' }}"
  tags:
    - init