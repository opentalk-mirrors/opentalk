---
# tasks file for opentalk_config
- name: Manage presence of required directories 
  ansible.builtin.include_tasks: manage_directories.yaml

- name: Manage and load settings.yml file
  ansible.builtin.include_tasks: manage_settings.yml

- name: Manage secrets
  ansible.builtin.include_tasks: manage_secrets.yaml
  tags:
    - always

- name: Manage traefik config
  ansible.builtin.include_tasks: render_config_traefik.yaml

- name: Render keycloak config
  ansible.builtin.include_tasks: render_config_keycloak.yaml

- name: Render keycloak json import
  ansible.builtin.include_tasks: render_config_keycloak_realm_import.yaml

- name: Render RabbitMQ config
  ansible.builtin.include_tasks: render_config_rabbitmq.yaml

- name: Render controller config
  ansible.builtin.include_tasks: render_config_controller.yaml

- name: Render livekit config
  ansible.builtin.include_tasks: render_config_livekit.yaml

- name: Render mailer config
  ansible.builtin.include_tasks: render_config_mailer.yaml

- name: Render obelisk config
  ansible.builtin.include_tasks: render_config_obelisk.yaml

- name: Render recorder config
  ansible.builtin.include_tasks: render_config_recorder.yaml

- name: Render ofelia config
  ansible.builtin.include_tasks: render_config_ofelia.yml

- name: Manage test user
  ansible.builtin.include_tasks: manage_demo_user.yaml
  tags:
    - postInstall
    - demoUser
    - never

- name: PostInstall Task - Create backup
  ansible.builtin.include_tasks: backup_create.yml
  tags:
    - postInstall
    - createBackup
    - createBackupControllerDB
    - createBackupKeycloakDB
    - createBackupConfig
    - createBackupTraefik
    - createBackupMinio
    - never

- name: PostInstall Task - Restore backup
  ansible.builtin.include_tasks: backup_restore.yml
  tags:
    - postInstall
    - restoreBackup
    - restoreBackupControllerDB
    - restoreBackupKeycloakDB
    - restoreBackupConfig
    - restoreBackupTraefik
    - restoreBackupMinio
    - never