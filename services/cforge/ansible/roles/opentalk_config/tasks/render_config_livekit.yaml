---
- name: "Render livekit config | config/services-config/3rd_party/livekit/livekit.yaml"
  ansible.builtin.template:
    src: livekit.yaml.j2
    dest: "{{ config_dir }}/services-config/3rd_party/livekit/livekit.yaml"
    mode: "666"
  notify: Restart Docker service livekit
  tags:
    - init
    - apply
