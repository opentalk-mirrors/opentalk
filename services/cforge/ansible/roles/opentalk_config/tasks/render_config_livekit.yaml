---
- name: "Render livekit config | config/services-config/3rd_party/livekit/livekit.yaml"
  ansible.builtin.template:
    src: livekit.yaml.j2
    dest: "{{ config_dir }}/services-config/3rd_party/livekit/livekit.yaml"
    mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}"
  when: Deployment.scenario is not defined or 'external_livekit' not in Deployment.scenario
  notify: Restart Docker service livekit
  tags:
    - init
    - apply
