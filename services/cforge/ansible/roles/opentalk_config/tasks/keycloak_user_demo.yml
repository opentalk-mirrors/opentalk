---
- name: "Create a user for testing purposes | name: {{ postInstall.demoUser.name }}"
  community.general.keycloak_user:
    auth_keycloak_url: "{{ Keycloak.base_url }}"
    auth_realm: "{{ Keycloak.auth.realm }}"
    auth_username: "{{ Keycloak.auth.username }}"
    auth_password: "{{ Keycloak.auth.password }}"
    realm: "{{ Keycloak.realm }}"
    username: "{{ postInstall.demoUser.name }}"
    firstName: "{{ postInstall.demoUser.firstName }}"
    lastName: "{{ postInstall.demoUser.lastName }}"
    email: "{{ postInstall.demoUser.email }}"
    enabled: "{{ postInstall.demoUser.enabled }}"
    emailVerified: true
    credentials:
        - type: password
          value: "{{ postInstall.demoUser.password }}"
          temporary: false
    state: "{{ postInstall.demoUser.state }}"
  tags:
    - postInstall
    - demoUser
    - never
