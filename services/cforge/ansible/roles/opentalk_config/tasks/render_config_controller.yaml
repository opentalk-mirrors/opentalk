---
- name: "Render controller config | config/services-config/controller/controller.toml"
  ansible.builtin.template:
    src: controller.toml.j2
    dest: "{{ config_dir }}/services-config/controller/controller.toml"
    mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}"
    force: true
  notify: Restart Docker service controller
  tags:
    - init
    - apply
