---
- block:
    - name: "Check if custom certificates exist"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ CustomCertificates.certs_dir }}/{{ CustomCertificates.ssl_ca_file }}"
        - "{{ CustomCertificates.certs_dir }}/{{ CustomCertificates.ssl_certificate_file }}"
        - "{{ CustomCertificates.certs_dir }}/{{ CustomCertificates.ssl_certificate_fullchain_file }}"
        - "{{ CustomCertificates.certs_dir }}/{{ CustomCertificates.ssl_certificate_key_file }}"
      register: custom_certs_stat
      check_mode: no
    
    - name: "Set fact for certificate existence"
      ansible.builtin.set_fact:
        certs_exist: "{{ custom_certs_stat.results | map(attribute='stat.exists') | select | list | length == 4 }}"
      check_mode: no
  tags:
    - selfSignedCerts
    - never

- block:
    - name: "Create private temporary CA directory structure"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "{{ '777' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '755' }}"
      loop:
        - "{{ CustomCertificates.certs_dir }}/ca"
        - "{{ CustomCertificates.certs_dir }}/ca/csr"
        - "{{ CustomCertificates.certs_dir }}/ca/private"
        - "{{ CustomCertificates.certs_dir }}/ca/newcerts"

    - name: "Generate temporary CA key"
      community.crypto.openssl_privatekey:
        path: "{{ CustomCertificates.certs_dir }}/ca/private/rootCA.key"
        size: "{{ CustomCertificates['generate_selfsigned_certs'].ca.key_size }}"
        mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '600' }}"

    - name: "Generate temporary CA CSR"
      community.crypto.openssl_csr:
        path: "{{ CustomCertificates.certs_dir }}/ca/csr/rootCA.csr"
        privatekey_path: "{{ CustomCertificates.certs_dir }}/ca/private/rootCA.key"
        country_name: "{{ CustomCertificates['generate_selfsigned_certs'].ca.country }}"
        state_or_province_name: "{{ CustomCertificates['generate_selfsigned_certs'].ca.state }}"
        locality_name: "{{ CustomCertificates['generate_selfsigned_certs'].ca.locality }}"
        organization_name: "{{ CustomCertificates['generate_selfsigned_certs'].ca.organization }}"
        organizational_unit_name: "{{ CustomCertificates['generate_selfsigned_certs'].ca.organizational_unit }}"
        common_name: "{{ CustomCertificates['generate_selfsigned_certs'].ca.common_name | regex_replace('^(.*?)(:\\d+)?$', '\\1') }}"
        email_address: "{{ CustomCertificates['generate_selfsigned_certs'].ca.email_address }}"
        basic_constraints: ['CA:TRUE']
        basic_constraints_critical: true
        key_usage: ['keyCertSign', 'cRLSign']
        key_usage_critical: true

    - name: "Generate self-signed temporary CA certificate"
      community.crypto.x509_certificate:
        path: "{{ CustomCertificates.certs_dir }}/ca/rootCA.crt"
        privatekey_path: "{{ CustomCertificates.certs_dir }}/ca/private/rootCA.key"
        csr_path: "{{ CustomCertificates.certs_dir }}/ca/csr/rootCA.csr"
        provider: selfsigned
        selfsigned_not_after: "+{{ CustomCertificates['generate_selfsigned_certs'].ca.certificate_validity_days }}d"

    - name: "Generate server key"
      community.crypto.openssl_privatekey:
        path: "{{ CustomCertificates.certs_dir }}/ca/newcerts/server.key.pem"
        size: "{{ CustomCertificates['generate_selfsigned_certs'].ca.key_size }}"
        mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '600' }}"

    - name: "Generate server CSR"
      community.crypto.openssl_csr:
        path: "{{ CustomCertificates.certs_dir }}/ca/csr/server.csr.pem"
        privatekey_path: "{{ CustomCertificates.certs_dir }}/ca/newcerts/server.key.pem"
        country_name: "{{ CustomCertificates['generate_selfsigned_certs'].server.country }}"
        state_or_province_name: "{{ CustomCertificates['generate_selfsigned_certs'].server.state }}"
        locality_name: "{{ CustomCertificates['generate_selfsigned_certs'].server.locality }}"
        organization_name: "{{ CustomCertificates['generate_selfsigned_certs'].server.organization }}"
        organizational_unit_name: "{{ CustomCertificates['generate_selfsigned_certs'].server.organizational_unit }}"
        common_name: "{{ CustomCertificates['generate_selfsigned_certs'].server.common_name | regex_replace('^(.*?)(:\\d+)?$', '\\1') }}"
        email_address: "{{ CustomCertificates['generate_selfsigned_certs'].server.email_address }}"
        subject_alt_name: "{{ subject_alt_names }}"
        key_usage: ['digitalSignature', 'keyEncipherment']
        extended_key_usage: ['serverAuth', 'clientAuth']
      vars:
        subject_alt_names: |
          {% set sans = [] %}
          {% for dns in CustomCertificates.generate_selfsigned_certs.server.san_dns | default([]) if dns is string %}
          {%   set cleaned_dns = dns | regex_replace(':\d+$', '') | trim %}
          {%   if cleaned_dns and cleaned_dns != ':' %}
          {%     set _ = sans.append('DNS:' + cleaned_dns) %}
          {%   endif %}
          {% endfor %}
          {% for ip in CustomCertificates.generate_selfsigned_certs.server.san_ip | default([]) if ip is string %}
          {%   set cleaned_ip = ip | regex_replace(':\d+$', '') | trim %}
          {%   if cleaned_ip and cleaned_ip != ':' %}
          {%     set _ = sans.append('IP:' + cleaned_ip) %}
          {%   endif %}
          {% endfor %}
          {{ sans }}

    - name: "Sign server certificate with our temporary CA"
      community.crypto.x509_certificate:
        path: "{{ CustomCertificates.certs_dir }}/ca/newcerts/server.crt.pem"
        csr_path: "{{ CustomCertificates.certs_dir }}/ca/csr/server.csr.pem"
        ownca_path: "{{ CustomCertificates.certs_dir }}/ca/rootCA.crt"
        ownca_privatekey_path: "{{ CustomCertificates.certs_dir }}/ca/private/rootCA.key"
        provider: ownca
        ownca_not_after: "+{{ CustomCertificates['generate_selfsigned_certs'].ca.certificate_validity_days }}d"

    - name: "Create full-chain certificate"
      ansible.builtin.copy:
        content: "{{ lookup('file', CustomCertificates.certs_dir + '/ca/newcerts/server.crt.pem') }}{{ '\n' }}{{ lookup('file', CustomCertificates.certs_dir + '/ca/rootCA.crt') }}"
        dest: "{{ CustomCertificates.certs_dir }}/ca/newcerts/server_full_chain.crt.pem"

    - name: "Copy final certificates and key"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
        remote_src: true
        force: false
      loop:
        - { 
            src: "{{ CustomCertificates.certs_dir }}/ca/newcerts/server.key.pem", 
            dest: "{{ CustomCertificates.certs_dir }}/{{ CustomCertificates.ssl_certificate_key_file }}", 
            mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '600' }}" 
          }
        - { 
            src: "{{ CustomCertificates.certs_dir }}/ca/newcerts/server.crt.pem", 
            dest: "{{ CustomCertificates.certs_dir }}/{{ CustomCertificates.ssl_certificate_file }}", 
            mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}" 
          }
        - { 
            src: "{{ CustomCertificates.certs_dir }}/ca/newcerts/server_full_chain.crt.pem", 
            dest: "{{ CustomCertificates.certs_dir }}/{{ CustomCertificates.ssl_certificate_fullchain_file }}", 
            mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}" 
          }
        - { 
            src: "{{ CustomCertificates.certs_dir }}/ca/rootCA.crt", 
            dest: "{{ CustomCertificates.certs_dir }}/{{ CustomCertificates.ssl_ca_file }}", 
            mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}" 
          }

    - name: "Cleanup temporary CA files"
      ansible.builtin.file:
        path: "{{ CustomCertificates.certs_dir }}/ca"
        state: absent

  when: not certs_exist
  tags:
    - selfSignedCerts
    - never
