---
- block:
    - ansible.builtin.set_fact:
        backup_timestamp: "{{ BACKUP_TIMESTAMP }}"
    - ansible.builtin.fail: msg="The variable 'BACKUP_TIMESTAMP' is not defined or empty."
      when: (BACKUP_TIMESTAMP is undefined) or (BACKUP_TIMESTAMP|length == 0)
    - name: "Ensure backup tmp dir | /var/opt/opentalk-compose/backups/tmp/{{ backup_timestamp }}"
      ansible.builtin.file:
        path: "{{ backups_dir }}/{{ item }}"
        state: directory
      loop:
        - tmp
        - "tmp/{{ backup_timestamp }}"
    - name: Extract OpenTalk backup | /var/opt/opentalk-compose/backups/{{ backup_timestamp }}_opentalk-backup.tgz
      ansible.builtin.unarchive:
        src: "{{ backups_dir }}/{{ backup_timestamp }}_opentalk-backup.tgz"
        dest: "{{ backups_dir }}/tmp/{{ backup_timestamp }}"
  tags:
    - postInstall
    - restoreBackup
    - restoreBackupControllerDB
    - restoreBackupKeycloakDB
    - restoreBackupConfig
    - restoreBackupTraefik
    - restoreBackupMinio
    - never

- name: "Restore config | /var/opt/opentalk-compose/backups/tmp/{{ backup_timestamp }}/config"
  ansible.posix.synchronize:
    src: "{{ backups_dir }}/tmp/{{ backup_timestamp }}/config/"
    dest: "{{ config_dir }}/"
  tags:
    - postInstall
    - restoreBackup
    - restoreBackupConfig
    - never

- name: "Restore traefik data | /var/opt/opentalk-compose/backups/tmp/{{ backup_timestamp }}/traefik"
  ansible.posix.synchronize:
    src: "{{ backups_dir }}/tmp/{{ backup_timestamp }}/traefik/"
    dest: "{{ data_dir }}/traefik/"
  tags:
    - postInstall
    - restoreBackup
    - restoreBackupTraefik
    - never

- block:
    - name: "Restore MinIO bucket {{ Controller.minio.bucket }} | /var/opt/opentalk-compose/backups/tmp/{{ backup_timestamp }}/minio/{{ Controller.minio.bucket }}"
      ansible.builtin.command:
        cmd: "/usr/bin/mcli mirror {{ backups_dir }}/tmp/{{ backup_timestamp }}/{{ Controller.minio.bucket }} {{ data_dir }}/minio/{{ Controller.minio.bucket }}"
      register: mcli
    - name: MinIO mcli stdout
      ansible.builtin.debug:
        var: mcli.stdout
  tags:
    - postInstall
    - restoreBackup
    - restoreBackupMinio
    - never

- name: "Restore controller DB | /var/opt/opentalk-compose/backups/tmp/{{ backup_timestamp }}/controller-db_dump.sql"
  community.postgresql.postgresql_db:
    name: "{{ Controller.database.name }}"
    login_host: "{{ Controller.database.host }}"
    login_user: "{{ Controller.database.user }}"
    login_password: "{{ Controller.database.password }}"
    port: "{{ Controller.database.port }}"
    state: restore
    target: "{{ backups_dir }}/tmp/{{ backup_timestamp }}/controller-db_dump.sql"
  tags:
    - postInstall
    - restoreBackup
    - restoreBackupControllerDB
    - never

- name: "Restore Keycloak DB | /var/opt/opentalk-compose/backups/tmp/{{ backup_timestamp }}/keycloak-db_dump.sql"
  community.postgresql.postgresql_db:
    name: "{{ Keycloak.db.url.database }}"
    login_host: "{{ Keycloak.db.url.host }}"
    login_user: "{{ Keycloak.db.username }}"
    login_password: "{{ Keycloak.db.password }}"
    port: "{{ Keycloak.db.url.port }}"
    state: restore
    target: "{{ backups_dir }}/tmp/{{ backup_timestamp }}/keycloak-db_dump.sql"
  tags:
    - postInstall
    - restoreBackup
    - restoreBackupKeycloakDB
    - never

- name: Clean up | /var/opt/opentalk-compose/backups/tmp
  ansible.builtin.file:
    path: "{{ backups_dir }}/tmp"
    state: absent
  tags:
    - postInstall
    - restoreBackup
    - restoreBackupControllerDB
    - restoreBackupKeycloakDB
    - restoreBackupConfig
    - restoreBackupTraefik
    - restoreBackupMinio
    - never