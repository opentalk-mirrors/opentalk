---
- name: "Render RabbitMQ config | config/services-config/3rd_party/rabbitmq/rabbitmq.conf"
  ansible.builtin.template:
    src: rabbitmq.conf.j2
    dest: "{{ config_dir }}/services-config/3rd_party/rabbitmq/rabbitmq.conf"
    mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}"
  notify: Restart Docker service rabbitmq
  tags:
    - init
    - apply
