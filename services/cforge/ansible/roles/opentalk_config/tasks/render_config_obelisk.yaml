---
- name: "Render obelisk config | config/services-config/obelisk/obelisk.toml"
  ansible.builtin.template:
    src: obelisk.toml.j2
    dest: "{{ config_dir }}/services-config/obelisk/obelisk.toml"
    mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}"
  notify: Restart Docker service obelisk
  tags:
    - init
    - apply
