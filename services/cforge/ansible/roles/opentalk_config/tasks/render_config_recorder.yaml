---
- name: "Render recorder config | config/services-config/recorder/recorder.toml"
  ansible.builtin.template:
    src: recorder.toml.j2
    dest: "{{ config_dir }}/services-config/recorder/recorder.toml"
    mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}"
  notify: Restart Docker service recorder
  tags:
    - init
    - apply
