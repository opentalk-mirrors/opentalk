---
- name: Check if settings file is present | conf/settings.yml
  ansible.builtin.stat:
    path: "{{ config_dir }}/settings.yml"
  register: settings_file
  tags:
    - always

- name: Create settings file if not present | conf/settings.yml
  ansible.builtin.copy:
    src: "{{ role_path }}/defaults/main.yml"
    dest: "{{ config_dir }}/settings.yml"
    mode: "666"
  when: not settings_file.stat.exists
  tags:
    - always
    - skip_task

- name: Lade defaults/main.yml als defaults_vars
  include_vars:
    file: "{{ role_path }}/defaults/main.yml"
    name: defaults_vars
  tags:
    - always

- name: Lade settings.yml als settings_vars
  include_vars:
    file: "{{ config_dir }}/settings.yml"
    name: settings_vars
  when: settings_file.stat.exists
  tags:
    - always

- name: Merge defaults_vars und settings_vars
  set_fact:
    merged_settings: "{{ defaults_vars | combine(settings_vars, recursive=True) }}"
  when: settings_file.stat.exists
  tags:
    - always

- name: Schreibe gemergte YAML in Temp-Datei
  copy:
    dest: "{{ config_dir }}/settings.merged.tmp"
    content: "{{ merged_settings | to_nice_yaml }}"
    mode: "0644"
  when: settings_file.stat.exists
  tags:
    - always

- name: Vergleiche settings.merged.tmp und settings.yml
  command: diff "{{ config_dir }}/settings.merged.tmp" "{{ config_dir }}/settings.yml"
  register: diff_result
  ignore_errors: true
  changed_when: false
  tags:
    - always

- name: Warnung bei Unterschieden in settings.merged.tmp und settings.yml
  debug:
    msg: |
      Achtung: settings.yml unterscheidet sich von den gemergten Defaults!
      Vergleiche {{ config_dir }}/settings.merged.tmp und {{ config_dir }}/settings.yml.
  when: diff_result.rc != 0
  tags:
    - always

- name: Lösche settings.merged.tmp, wenn kein Unterschied
  file:
    path: "{{ config_dir }}/settings.merged.tmp"
    state: absent
  when: diff_result.rc == 0
  tags:
    - always

- name: "Warnung: Es gibt ungemergte neue Settings (settings.merged.tmp existiert)"
  debug:
    msg: |
      Achtung: Es gibt neue oder geänderte Einstellungen!
      Bitte prüfe und merge {{ config_dir }}/settings.merged.tmp manuell in {{ config_dir }}/settings.yml.
  when: lookup('ansible.builtin.file', config_dir + '/settings.merged.tmp', errors='ignore') is not none
  tags:
    - always
    - skip_task

- name: Create settings override | conf/settings.override.yaml
  ansible.builtin.copy:
    src: files/settings.override.dev.yaml
    dest: "{{ config_dir }}/settings.override.yaml"
    mode: "666"
  tags:
    - dev
    - skip_task

- name: Load values from settings file and override ansible defaults/main.yml
  include_vars:
    file: "{{ config_dir }}/settings.yml"
    hash_behaviour: merge
  when: settings_file.stat.exists
  tags:
    - always

- name: Check if settings override file is present | conf/settings.override.yaml
  ansible.builtin.stat:
    path: "{{ config_dir }}/settings.override.yaml"
  register: settings_override_file
  tags:
    - always

- name: Load values from override settings file {{ config_dir }}/settings.override.yaml and override {{ config_dir }}/settings.yaml
  include_vars:
    file: "{{ config_dir }}/settings.override.yaml"
    hash_behaviour: merge
  when: settings_override_file.stat.exists
  tags:
    - always

- name: Check if settings override file is present | conf/settings.override.dev.yaml
  ansible.builtin.stat:
    path: "{{ config_dir }}/settings.override.dev.yaml"
  register: settings_override_file
  tags:
    - dev

- name: Load values from override settings file {{ config_dir }}/settings.override.dev.yaml and override {{ config_dir }}/settings.yaml
  include_vars:
    file: "{{ config_dir }}/settings.override.dev.yaml"
    hash_behaviour: merge
  when: settings_override_file.stat.exists
  tags:
    - dev
