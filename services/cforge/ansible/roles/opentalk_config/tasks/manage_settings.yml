---
- name: Load defaults/main.yml as defaults_vars
  include_vars:
    file: "{{ role_path }}/defaults/main.yml"
    name: defaults_vars
  tags:
    - always

- name: Load defaults/main.dev.yml as defaults_dev_vars
  include_vars:
    file: "{{ role_path }}/defaults/main.dev.yml"
    name: defaults_dev_vars
  tags:
    - dev

- name: Merge dev defaults into settings | conf/settings.yml
  ansible.builtin.copy:
    dest: "{{ config_dir }}/settings.yml"
    content: "{{ defaults_vars | combine(defaults_dev_vars, recursive=True) | to_nice_yaml(indent=2) }}"
    mode: "0666"
    force: "{{ Deployment.force_settings_yaml | default(false) }}"
  tags:
    - dev

- name: Check if settings file is present | conf/settings.yml
  ansible.builtin.stat:
    path: "{{ config_dir }}/settings.yml"
  register: settings_file
  tags:
    - always

- name: Create settings file from defaults_vars if not present | conf/settings.yml
  ansible.builtin.copy:
    dest: "{{ config_dir }}/settings.yml"
    content: "{{ defaults_vars | to_nice_yaml(indent=2) }}"
    mode: "0666"
    force: "{{ Deployment.force_settings_yaml | default(false) }}"
  when: 
    - defaults_dev_vars is not defined
  tags:
    - always
    - skip_task

- name: Load settings.yml as settings_vars
  include_vars:
    file: "{{ config_dir }}/settings.yml"
    name: settings_vars
  when: settings_file.stat.exists
  tags:
    - always

- name: Find new keys in defaults that are missing in settings.yml (recursive)
  script: "{{ role_path }}/files/find_new_yaml_keys.py {{ role_path }}/defaults/main.yml {{ config_dir }}/settings.yml"
  register: new_keys_check
  changed_when: false
  failed_when: false
  when: settings_file.stat.exists
  tags:
    - always

- name: Parse new keys result
  set_fact:
    new_keys_result: "{{ new_keys_check.stdout | from_json }}"
  when: settings_file.stat.exists and new_keys_check.stdout is defined
  tags:
    - always

- name: Set empty result if settings file doesn't exist
  set_fact:
    new_keys_result: {"new_keys": [], "has_new_keys": false}
  when: not settings_file.stat.exists
  tags:
    - always

- name: Write settings.yml.unmerged if new keys are present
  copy:
    dest: "{{ config_dir }}/settings.yml.unmerged"
    content: "{{ defaults_vars | combine(settings_vars, recursive=True) | to_nice_yaml(indent=2) }}"
    mode: "0644"
  when: new_keys_result.has_new_keys
  notify: "Notify when new options are present"
  tags:
    - always

- name: Load values from settings file and override ansible defaults/main.yml
  include_vars:
    file: "{{ config_dir }}/settings.yml"
    hash_behaviour: merge
  tags:
    - always
