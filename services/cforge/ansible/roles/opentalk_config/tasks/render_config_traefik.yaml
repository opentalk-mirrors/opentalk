---
- name: "Render traefik static config | services/3rd_party/traefik/config/traefik.yaml"
  ansible.builtin.template:
    src: traefik.yaml.j2
    dest: "{{ deploy_dir }}/services/3rd_party/traefik/config/traefik.yaml"

- name: "Render traefik dynamic http config | services/3rd_party/traefik/config/dynamic/http.yaml"
  ansible.builtin.template:
    src: traefik_dynamic_http.yaml.j2
    dest:  "{{ deploy_dir }}/services/3rd_party/traefik/config/dynamic/http.yaml"
