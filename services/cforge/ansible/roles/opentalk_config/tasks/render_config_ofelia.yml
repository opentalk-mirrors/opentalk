---
- name: "Render ofelia config | config/services-config/3rd_party/ofelia/ofelia.ini"
  ansible.builtin.template:
    src: ofelia.ini.j2
    dest: "{{ config_dir }}/services-config/3rd_party/ofelia/ofelia.ini"
    mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}"
  notify: Restart Docker service ofelia
  tags:
    - init
    - apply
