---
- name: "Render mailer config | config/services-config/mailer/mailer.toml"
  ansible.builtin.template:
    src: mailer.toml.j2
    dest: "{{ config_dir }}/services-config/mailer/mailer.toml"
    mode: "{{ '666' if (Deployment.environment is defined and 'dev' in Deployment.environment) else '644' }}"
  notify: Restart Docker service mailer
  tags:
    - init
    - apply
