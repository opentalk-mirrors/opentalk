---
- name: "Create a OIDC client for OpenTalk Outlook Add-in | {{ Outlook.auth.client_id }}"
  community.general.keycloak_client:
    auth_keycloak_url: "{{ Keycloak.base_url }}"
    auth_realm: "{{ Keycloak.auth.realm }}"
    auth_username: "{{ Keycloak.auth.username }}"
    auth_password: "{{ Keycloak.auth.password }}"
    realm: "{{ Keycloak.realm }}"
    client_id: "{{ Outlook.auth.client_id }}"
    name: "{{ Outlook.auth.client_id }}"
    description: "OpenTalk Outlook Add-in OIDC client"
    enabled: true
    state: present
    public_client: true
    standard_flow_enabled: false
    direct_access_grants_enabled: false
    client_authenticator_type: client-secret
    implicit_flow_enabled: false
    protocol: openid-connect
    attributes:
      oauth2.device.authorization.grant.enabled: "true"
      access.token.lifespan: "1800"
      use.refresh.tokens: "true"
  tags:
    - outlookClient
    - apply
    - keycloak
