---
# handlers file for opentalk_config
- name: "Restart Docker service controller"
  community.docker.docker_compose_v2:
    project_src: /opentalk
    state: restarted
    recreate: never
    services: 
      - controller
  register: output
  when: ('init' not in ansible_run_tags)
  tags:
    - apply

