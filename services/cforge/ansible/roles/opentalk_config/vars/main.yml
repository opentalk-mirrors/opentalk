---
# vars file for opentalk_config
OT_DOMAIN: "{{ lookup('ansible.builtin.env', 'OT_DOMAIN') }}"
BACKUP_TIMESTAMP: "{{ lookup('ansible.builtin.env', 'BACKUP_TIMESTAMP') }}"
CFORGE_VERSION: "{{ lookup('ansible.builtin.env', 'CFORGE_VERSION') }}"
CFORGE_IMAGE_SRC: "{{ lookup('ansible.builtin.env', 'CFORGE_IMAGE_SRC') }}"
force_generate_secrets: False

deploy_dir: /deploy_dir
config_dir: /config
data_dir: /data
backups_dir: /backups
secrets_file: secrets.yaml

defaults_yml_path: "{{ role_path }}/defaults/main.yml"
settings_yml_path: "{{ config_dir }}/settings.yml"

CustomCertificates:
  certs_dir: "{{ config_dir }}/ssl"
  generate_selfsigned_certs:
    ca: 
      country: "DE"
      state: "Berlin"
      locality: "Berlin"
      organization: "my CA"
      organizational_unit: "CA"
      common_name: "{{ OT_DOMAIN }}"
      email_address: "admin@{{ OT_DOMAIN }}"
      key_size: 4096
      certificate_validity_days: 365
    server:
      country: "DE"
      state: "Berlin"
      locality: "Berlin"
      organization: "my Company"
      organizational_unit: "IT Security"
      common_name: "{{ OT_DOMAIN }}"
      email_address: "admin@{{ OT_DOMAIN }}"
      key_size: 4096
      certificate_validity_days: 365
      san_dns:
        - "{{ OT_DOMAIN }}"
        - "*.{{ OT_DOMAIN }}"
      san_ip:
        - "127.0.0.1"
        - "::1"