services:
  controller-db:
    image: postgres:16-alpine
    profiles: ["core", "standard", "full", "postgres", "controller-db"]
    volumes:
      - ./data/controller/pg_data:/var/lib/postgresql/data
    restart: always
    secrets:
      - db_password_controller
    environment:
      POSTGRES_DB: controller
      POSTGRES_USER: ot
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password_controller
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    depends_on:
      cforge:
        condition: service_completed_successfully

  keycloak-db:
    image: postgres:16-alpine
    profiles: ["core", "standard", "full", "postgres", "keycloak-db"]
    volumes:
      - ./data/keycloak/pg_data:/var/lib/postgresql/data
    restart: always
    secrets:
      - db_password_keycloak
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-ot}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password_keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    depends_on:
      cforge:
        condition: service_completed_successfully

secrets:
  db_password_controller:
    file: ./.db_password_controller
  db_password_keycloak:
    file: ./.db_password_keycloak