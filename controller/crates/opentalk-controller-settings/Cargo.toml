itertools.workspace = true
mockall = { workspace = true, optional = true }
openidconnect.workspace = true
opentalk-roomserver-modules.workspace = true
opentalk-roomserver-room.workspace = true
opentalk-roomserver-types.workspace = true
opentalk-roomserver-types-livekit.workspace = true
opentalk-service-auth = { workspace = true, features = ["actix"] }
opentalk-tracing.workspace = true
opentalk-types-common.workspace = true
owo-colors.workspace = true
phonenumber.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
serde_with.workspace = true
snafu.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
serial_test.workspace = true
tempfile.workspace = true
