services:
  traefik:
    # The official v3 Traefik docker image
    image: traefik:v3.1
    # Enables the web UI and tells Traefik to listen to docker
    #ports:
    #  # The HTTP port
    #  - "80:80"
    #  - 443:443
    #  # The Web UI (enabled by --api.insecure=true)
    #  - "7777:8080"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      - target: 8080
        published: 7777
    labels:
      - "traefik.enable=true"
      # HeadersRegexp is needed to serve both, Api and Dashboard
      - "traefik.http.routers.dashboard.rule=Host(`livekit-test-anfi.opentalk.run`) && (PathPrefix(`/adm/traefik`) || HeaderRegexp(`Referer`, `/traefik`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-strip"
      - "traefik.http.middlewares.dashboard-strip.stripprefix.prefixes=/adm/traefik"
    volumes:
      - ./config/traefik.yaml:/etc/traefik/traefik.yaml
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
