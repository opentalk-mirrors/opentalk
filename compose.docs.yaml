---
services:
  mkdocs:
    image: git.opentalk.dev:5050/opentalk/backend/containers/mkdocs-material:latest
    command: [serve, --strict, --dev-addr=0.0.0.0:8000]
    working_dir: /docs
    volumes:
      - ./:/docs:Z
    ports:
      - 127.0.0.1:8000:8000
