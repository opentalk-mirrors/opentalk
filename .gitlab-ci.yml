---
image: git.opentalk.dev:5050/opentalk/opentalk-devops/containers/pkgbuild:dev

stages:
  - lint
  - package
  - upload

.template_vars:
  FLAVORS: ['deb', 'rpm']

.default_linter_conditions: &default_linter_conditions
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'

# ----------------------------
# LINTER JOBS
# ----------------------------

lint:shellcheck:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Linting shell scripts..."
    - git ls-files -z '*.sh' | xargs -0r shellcheck
    - shellcheck extras/packaging/wrappers/*

lint:yamllint:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Linting YAML files..."
    - yamllint .

lint:markdown:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Linting Markdown files..."
    - |
      git ls-files '*.md' | grep -v 'docs/5-configuration-options-reference.md' | \
        xargs -P4 -n1 sh -c '
          f="$1"
          sed "/\[\[_TOC_\]\]/Id" "$f" | mdl --style .markdown_style.rb - 2>&1 |
          sed "s|^|$f: |"
        ' _

lint:ansible-lint:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Linting Ansible code ..."
    - ansible-lint .

lint:licensing:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Check license compliance..."
    - reuse lint

lint:release_tag:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - echo "🔍 Compare product version in .versions.yml with CI_COMMIT_TAG"
    - |
      [ "$(yq -r '.opentalk_product_version' .versions.yml)" = "$CI_COMMIT_TAG" ] || \
      { echo "Product Version mismatch: .versions.yml has $(yq -r '.opentalk_product_version' .versions.yml) but tag is $CI_COMMIT_TAG"; exit 1; }

lint:pre-release_tag:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - echo "🔍 Compare product version in .versions.yml with CI_COMMIT_TAG"
    - |
      [ "$(yq -r '.opentalk_product_version' .versions.yml)" = "$CI_COMMIT_TAG" ] || \
      { echo "Product Version mismatch: .versions.yml has $(yq -r '.opentalk_product_version' .versions.yml) but tag is $CI_COMMIT_TAG"; exit 1; }

lint:commitlint:
  cache: {}
  stage: lint
  allow_failure: false
  <<: *default_linter_conditions
  variables:
    GIT_DEPTH: 0
  script:
    - set -euo pipefail
    - npx commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA --to HEAD --verbose

# ------------------------------
# PACKAGE JOBS
# ------------------------------

package:stable:
  stage: package
  needs:
    - lint:shellcheck
    - lint:yamllint
    - lint:markdown
    - lint:ansible-lint
    - lint:licensing
    - lint:commitlint
  parallel:
    matrix:
      - FLAVOR: !reference [.template_vars, FLAVORS]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - extras/packaging/build-all.sh --${FLAVOR} --version "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 day

package:pre-release:
  stage: package
  needs:
    - lint:shellcheck
    - lint:yamllint
    - lint:markdown
    - lint:ansible-lint
    - lint:licensing
    - lint:commitlint
  parallel:
    matrix:
      - FLAVOR: !reference [.template_vars, FLAVORS]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - extras/packaging/build-all.sh --${FLAVOR} --version "$CI_COMMIT_TAG"
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 day

package:experimental:
  stage: package
  needs:
    - lint:shellcheck
    - lint:yamllint
    - lint:markdown
    - lint:ansible-lint
    - lint:licensing
    - lint:commitlint
  parallel:
    matrix:
      - FLAVOR: !reference [.template_vars, FLAVORS]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        VERSION="$(yq -r '.opentalk_product_version' .versions.yml)+git${CI_COMMIT_SHORT_SHA}"
      else
        VERSION="${CI_COMMIT_TAG}+git${CI_COMMIT_SHORT_SHA}"
      fi
      echo "VERSION=$VERSION"
    - extras/packaging/build-all.sh --${FLAVOR} --version "$VERSION"
  artifacts:
    paths:
      - artifacts/
    expire_in: 2 hours

# ------------------------------
# UPLOAD JOBS
# ------------------------------

upload:stable:
  stage: upload
  parallel:
    matrix:
      - FLAVOR: !reference [.template_vars, FLAVORS]
  needs:
    - job: package:stable
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - |
      for file in artifacts/*.${FLAVOR}; do
        [ -f "$file" ] || continue
        filename=$(basename "$file")
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$file" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/opentalk-compose/${CI_COMMIT_TAG}/$filename"
        echo "Uploaded to gitlab: $filename"
        openrepo --debug upload "$file" -r "${FLAVOR}" -o
        echo "Uploaded to openrepo (stable): $filename"
        sleep 2
      done

upload:pre-release:
  stage: upload
  parallel:
    matrix:
      - FLAVOR: !reference [.template_vars, FLAVORS]
  needs:
    - job: package:pre-release
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)$/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - |
      for file in artifacts/*.${FLAVOR}; do
        [ -f "$file" ] || continue
        filename=$(basename "$file")
        openrepo --debug upload "$file" -r "${FLAVOR}-testing" -o
        echo "Uploaded to openrepo (testing): $filename"
        sleep 2
      done

upload:experimental:
  stage: upload
  parallel:
    matrix:
      - FLAVOR: !reference [.template_vars, FLAVORS]
  needs:
    - job: package:experimental
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - |
      for file in artifacts/*.${FLAVOR}; do
        [ -f "$file" ] || continue
        filename=$(basename "$file")
        openrepo --debug upload "$file" -r "${FLAVOR}-experimental" -o
        echo "Uploaded to openrepo (experimental): $filename"
        sleep 2
      done
