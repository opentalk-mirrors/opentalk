package:experimental:
  stage: package
  needs:
    - lint:shellcheck
    - lint:yamllint
    - lint:markdown
    - lint:ansible-lint
    - lint:licensing
    - lint:commitlint
  parallel:
    matrix:
      - FLAVOR: !reference [.template_pkg_vars, FLAVORS_PKG]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        VERSION="$(yq -r '.opentalk_product_version' .versions.yml)+git${CI_COMMIT_SHORT_SHA}"
      else
        VERSION="${CI_COMMIT_TAG}+git${CI_COMMIT_SHORT_SHA}"
      fi
      echo "VERSION=$VERSION"
    - extras/packaging/build-all.sh --${FLAVOR} --version "$VERSION"
    - |
      if [ "$FLAVOR" = "rpm" ]; then
