upload_package:deb-testing:
  image: debian:bookworm-slim
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_BRANCH != "main"
  script:
    - |
      apt update && apt install -y curl
      curl -L https://github.com/openkilt/openrepo/releases/download/v1.0.0/openrepo_cli_x86_64 -o /usr/local/bin/openrepo 
      chmod +x -v /usr/local/bin/openrepo
      for file in $OUTPUT_DIR/*.deb; do
        if [ -f "$file" ]; then
          filename=$(basename "$file")
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
               --upload-file "$file" \
               "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/opentalk-compose/${CI_COMMIT_TAG}/$filename"
          echo "Uploaded to gitlab: $filename"
          openrepo --debug upload $file -r deb-testing -o
          echo "Uploaded to openrepo: $filename"
          sleep 2
        fi
      done

upload_package:deb:
  image: debian:bookworm-slim
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_BRANCH == "main"'
  script:
    - |
      apt update && apt install -y curl
      curl -L https://github.com/openkilt/openrepo/releases/download/v1.0.0/openrepo_cli_x86_64 -o /usr/local/bin/openrepo 
      chmod +x -v /usr/local/bin/openrepo
      for file in $OUTPUT_DIR/*.deb; do
        if [ -f "$file" ]; then
          filename=$(basename "$file")
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
               --upload-file "$file" \
               "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/opentalk-compose/${CI_COMMIT_TAG}/$filename"
          echo "Uploaded to gitlab: $filename"
          openrepo --debug upload $file -r deb
          echo "Uploaded to openrepo: $filename"
          sleep 2
        fi
      done

