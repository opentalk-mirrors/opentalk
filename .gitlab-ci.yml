---
spec:
  inputs:
    release_version:
      description: |
        Version number, e.g. `1.2.3`. Must be in format `<major>.<minor>.<patch>`.
        Keep at `0.0.0` unless you're in the process of creating a release.
      type: string
      regex: ^([0]|([1-9]\d*))\.([0]|([1-9]\d*))\.([0]|([1-9]\d*))$
      default: 0.0.0
    release_issue:
      description: |
        The number of an issue which should be closed by a release MR created by this pipeline.
        Keep empty or unset unless you're in the process of creating a release.
      type: string
      regex: ^\d*$
      default: ''
---
image: $RUST_IMAGE

stages:
  - analyze
  - image
  - build
  - lint
  - docs
  - test
  - read-tags
  - package
  - integration
  - upload
  - trigger
  - push
  - push-harbor
  - deploy
  - deploy-manual
  - trigger
  # - release

variables:
  BUILDAH_IMAGE: quay.io/buildah/stable:v1.43.1
  RUST_IMAGE: registry.heinlein.group/opentalk-tools/rust:1.98.1-trixie

  # Included jobs need these
  RUST_LINT_IMAGE: $RUST_IMAGE
  RUST_BUILD_IMAGE: $RUST_IMAGE

  # The `livekit` client crate pulls in `webrtc-sys`, whose build script refuses to compile with GCC or clang < 20
  CXX: clang++-21

.default_job_condition: &default_job_condition
  needs: []
  rules:
    # Run in merge requests (if there is one job with this instruction, all jobs without
    # it are ignored for the MR pipeline)
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # Run on scheduled pipeline runs
    - if: $CI_PIPELINE_SOURCE == 'schedule'

include:
  - local: .gitlab-ci-container-template.yml
    inputs:
      service: controller
      flavors: [ubuntu, scratch]
      default_flavor: ubuntu
  - local: .gitlab-ci-container-template.yml
    inputs:
      service: obelisk
      flavors: [ubuntu, scratch]
      default_flavor: ubuntu
  - local: .gitlab-ci-container-template.yml
    inputs:
      service: orchestrator
      flavors: [ubuntu, scratch]
      default_flavor: ubuntu
  - local: .gitlab-ci-container-template.yml
    inputs:
      service: roomserver
      flavors: [ubuntu, scratch]
      default_flavor: ubuntu
  - local: .gitlab-ci-container-template.yml
    inputs:
      service: smtp-mailer
      flavors: [ubuntu, scratch]
      default_flavor: ubuntu
  - local: .gitlab-ci-container-template.yml
    inputs:
      service: recorder
      flavors: [intel, scratch]
      default_flavor: intel
  - local: .gitlab-ci-container-template.yml
    inputs:
      service: transcription
      flavors: [vulkan, cuda]
      default_flavor: vulkan

  - project: opentalk/ci/templates/rust-lint
    ref: v1
    file: .gitlab-ci-template.yml
  - project: opentalk/ci/templates/common-lint
    ref: v1
    file: .gitlab-ci-template.yml
  - project: opentalk/ci/templates/changelog
    ref: v2
    file: .gitlab-ci-template.yml

  # Deployment automation pipeline (deb/rpm packaging, ansible, docs). Its jobs
  # are gated with `changes: compose/**/*` so unrelated Rust changes don't
  # trigger it; see compose/.gitlab-ci.yml.
  - local: compose/.gitlab-ci.yml

code-review-agent:
  stage: analyze
  image:
    name: pragent/pr-agent:0.47.0
    entrypoint: ['']
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
  script:
    - echo "Running PR Agent..."
    - export MR_URL="$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
    - echo "MR_URL=$MR_URL"
    - export GITLAB__URL="$CI_SERVER_URL"
    - export CONFIG__GIT_PROVIDER="gitlab"
    - export GITLAB__AUTH_TYPE="private_token"

    - test -n "$PR_AGENT_ACCESS_TOKEN" || { echo "PR_AGENT_ACCESS_TOKEN is not set"; exit 1; }
    - export GITLAB__PERSONAL_ACCESS_TOKEN="$PR_AGENT_ACCESS_TOKEN"

    - test -n "$PR_AGENT_ANTHROPIC_KEY" || { echo "PR_AGENT_ANTHROPIC_KEY is not set"; exit 1; }
    - export ANTHROPIC__KEY="$PR_AGENT_ANTHROPIC_KEY"

    - python -m pr_agent.cli --extra_config_url=.pr_agent.toml --pr_url="$MR_URL" review
    - python -m pr_agent.cli --extra_config_url=.pr_agent.toml --pr_url="$MR_URL" improve

lint:fmt_load_tests:
  stage: lint
  <<: *default_job_condition
  image: node:24.21.0-alpine
  before_script:
    - npm install -g corepack@latest
    - corepack enable
    - |
      PNPM_VERSION=$(node -p "require('./roomserver/load-test/package.json').packageManager.split('@')[1]")
      corepack prepare "pnpm@$PNPM_VERSION" --activate
    - pnpm config set store-dir .pnpm-store
  script:
    - cd roomserver/load-test
    - pnpm install
    - pnpm fmt:ci

lint:openapi:
  stage: lint
  <<: *default_job_condition
  parallel:
    matrix:
      - FILE: [roomserver/api/docs/openapi.yml, docs/developer/controller/api.yaml]
  image:
    name: redocly/cli:2.58.2
    entrypoint: ['']
  script:
    - /usr/local/bin/openapi lint "$FILE"

lint:openapi-spectral:
  stage: lint
  <<: *default_job_condition
  image:
    name: stoplight/spectral
    entrypoint: ['']
  script:
    - spectral lint --ruleset controller/ci/spectral/openapi.yml lint docs/developer/controller/api.yaml
    - spectral lint --ruleset roomserver/ci/spectral/openapi.yml lint roomserver/api/docs/openapi.yml

lint:openapi-up-to-date:
  stage: lint
  <<: *default_job_condition
  needs: [build]
  script:
    - target/release/opentalk-controller openapi dump > docs/developer/controller/api.yaml
    - target/release/opentalk-roomserver openapi dump > roomserver/api/docs/openapi.yml
    - |
      if ! git diff -w --exit-code -- docs/ roomserver/ ; then
        echo "openapi specification outdated, run:"
        echo "opentalk-controller openapi dump > docs/developer/controller/api.yaml"
        echo "opentalk-roomserver openapi dump > roomserver/api/docs/openapi.yml"
        exit 1
      fi

lint:docs-urls:
  stage: lint
  <<: *default_job_condition
  image:
    name: lycheeverse/lychee:0.24.2-alpine
    entrypoint: ['']
  script:
    - lychee -vv docs/

lint:commit-signature:
  stage: lint
  needs: []
  rules:
    # Run in merge requests only.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    # %G? will log signature information for a commit. `N` stands for "no signature", `B` for "bad signature"
    # refer to https://git-scm.com/docs/pretty-formats#Documentation/pretty-formats.txt-emGem
    # grep checks that the output does not contain any "N" or "B" characters.
    - >
      git log --format=format:'%G?' $CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD
      | grep --null-data --quiet --invert-match --regexp="N" --regexp="B"

lint:er-diagram:
  stage: lint
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  artifacts:
    paths:
      - controller/target/docs/temporary/controller/database/er-diagram.mermaid
    expire_in: 1 day
  variables:
    POSTGRES_DB: opentalk
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password123
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_BASE_URL: postgres://postgres:password123@postgres:5432
    OPENTALK_CTRL_DATABASE__URL: postgres://postgres:password123@postgres:5432/opentalk
  services:
    - name: postgres:18-alpine
      alias: postgres
  script:
    - controller/ci/docs-generate-mermaid.sh

lint:docs-generated-parts:
  stage: lint
  image:
    name: git.opentalk.dev:5050/opentalk/tools/opentalk-ci-doc-updater:v0.2.0
    entrypoint: ['']
  needs:
    - job: build
      artifacts: true
    - job: lint:er-diagram
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  parallel:
    matrix:
      - COMPONENT: [controller, obelisk, roomserver, smtp-mailer]
  before_script:
    - apt-get update && apt-get install -y git git-lfs
    - git lfs install
  script:
    - $COMPONENT/ci/docs-update-generated-parts.sh
    - |
      if ! git diff --exit-code; then
        echo "Generated parts of documentation changed, run" \
          "$COMPONENT/ci/docs-update-generated-parts.sh and commit the result"
        exit 1
      fi

test:load_typst_plugins:
  stage: test
  <<: *default_job_condition
  needs: []
  artifacts:
    paths:
      - target/typst
    expire_in: 1 day
  image:
    name: git.opentalk.dev:5050/opentalk/backend/containers/typst-plugins:alpine-dev
    pull_policy: if-not-present
  script:
    - mkdir -p target
    - cp -r /usr/share/typst target/typst

test:cargo_test:
  image: $RUST_IMAGE
  stage: test
  <<: *default_job_condition
  tags:
    - testcontainers
  needs:
    - test:load_typst_plugins
  artifacts:
    reports:
      junit: target/nextest/ci/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: target/llvm-cov-target/cobertura.xml
  # this uses region for coverage summary
  coverage: /TOTAL\s+(\d+\s+)+(\d+\.\d+\%)/
  script:
    - cargo llvm-cov nextest --no-report --profile ci --workspace
    # code coverage for doctests is unstable, so we run them separately
    - cargo test --doc --workspace --locked
    - cargo llvm-cov report --doctests --cobertura --output-path target/llvm-cov-target/cobertura.xml
    - cargo llvm-cov report --summary-only --ignore-filename-regex 'roomserver/opentalk-roomserver-dui/'
  variables:
    TYPST_PACKAGE_CACHE_PATH: $CI_PROJECT_DIR/target/typst/packages
    RUST_LOG: opentalk=trace

