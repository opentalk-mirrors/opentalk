    - sed -i "s/^CONTROLLER_IMAGE_SRC=.*/CONTROLLER_IMAGE_SRC=git.opentalk.dev:5050\/opentalk\/backend\/services\/controller-enterprise/" $SOURCE_DIR/opt/opentalk-compose/.versions
    - apt-get update && apt-get install -y squashfs-tools binutils rpm curl
