---
image: $CI_REGISTRY_IMAGE/pkgbuild:latest

include:
  - local: extras/ci/gitlab/lint.yml
  - local: extras/ci/gitlab/package.yml
  - local: extras/ci/gitlab/deploy.yml
  - local: extras/ci/gitlab/integration.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - image
  - lint
  - docs
  - package
  - integration
  - upload
  - trigger
  - deploy

.template_pkg_vars:
  FLAVORS_PKG: ['deb', 'rpm']

.template_dist_vars:
  FLAVORS_DIST: ['debian12', 'debian13', 'opensuse15', 'opensuse16', 'rocky9', 'ubuntu2404']

.default_conditions: &default_conditions
  needs:
    - job: build:pkgbuild
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'

trigger_changelog_preview:
  stage: trigger
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  variables:
    PIPELINE_PROJECT_PATH: $CI_PROJECT_PATH
    PIPELINE_MERGE_REQUEST_PROJECT_PATH: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH
    PIPELINE_MERGE_REQUEST_SOURCE_BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    PIPELINE_MERGE_REQUEST_TARGET_BRANCH_NAME: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    PIPELINE_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_IID
  trigger: opentalk/tools/check-changelog

build:pkgbuild:
  stage: image
  image: docker:27-cli
  services:
    - docker:27-dind
  tags:
    - dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - changes:
        - extras/ci/pkgbuild/**/*
        - .gitlab-ci.yml
    - when: never
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --use
    - >-
      docker buildx build
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/pkgbuild:cache
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/pkgbuild:cache,mode=max
      --tag $CI_REGISTRY_IMAGE/pkgbuild:latest
      --push
      extras/ci/pkgbuild

docs:mkdocs:
  stage: docs
  <<: *default_conditions
  script:
    # The privacy plugin fetches external assets (e.g. Google Fonts); retry on
    # transient network timeouts.
    - |
      for i in 1 2 3; do
        just docs && exit 0
        echo "just docs attempt $i failed; retrying..."
        sleep 10
      done
      exit 1
  artifacts:
    paths:
      - site/
  pages:
    publish: site
