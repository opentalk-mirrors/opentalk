---
image: git.opentalk.dev:5050/opentalk/opentalk-devops/containers/pkgbuild:dev

stages:
  - lint
  - package
  - integration
  - upload

.template_pkg_vars:
  FLAVORS_PKG: ['deb', 'rpm']

.template_dist_vars:
  FLAVORS_DIST: ['debian12', 'debian13', 'opensuse15', 'opensuse16', 'rocky9', 'ubuntu2404']

.default_linter_conditions: &default_linter_conditions
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'

# ----------------------------
# LINTER JOBS
# ----------------------------

lint:shellcheck:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Linting shell scripts..."
    - git ls-files -z '*.sh' | xargs -0r shellcheck
    - shellcheck extras/packaging/wrappers/*

lint:yamllint:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Linting YAML files..."
    - yamllint .

lint:markdown:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Linting Markdown files..."
    - |
      git ls-files '*.md' | grep -v 'docs/5-configuration-options-reference.md' | \
        xargs -P4 -n1 sh -c '
          f="$1"
          sed "/\[\[_TOC_\]\]/Id" "$f" | mdl --style .markdown_style.rb - 2>&1 |
          sed "s|^|$f: |"
        ' _

lint:ansible-lint:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Linting Ansible code ..."
    - ansible-lint .

lint:licensing:
  stage: lint
  <<: *default_linter_conditions
  script:
    - echo "🔍 Check license compliance..."
    - reuse lint

lint:release_tag:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/'
    - when: never
  script:
    - echo "🔍 Compare product version in .versions.yml with CI_COMMIT_TAG"
    - |
      [ "$(yq -r '.opentalk_product_version' .versions.yml)" = "$CI_COMMIT_TAG" ] || \
      { echo "Product Version mismatch: .versions.yml has $(yq -r '.opentalk_product_version' .versions.yml) but tag is $CI_COMMIT_TAG"; exit 1; }

lint:pre-release_tag:
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)$/'
    - when: never
  script:
    - echo "🔍 Compare product version in .versions.yml with CI_COMMIT_TAG"
    - |
      [ "$(yq -r '.opentalk_product_version' .versions.yml)" = "$CI_COMMIT_TAG" ] || \
      { echo "Product Version mismatch: .versions.yml has $(yq -r '.opentalk_product_version' .versions.yml) but tag is $CI_COMMIT_TAG"; exit 1; }

lint:commitlint:
  cache: {}
  stage: lint
  allow_failure: false
  <<: *default_linter_conditions
  variables:
    GIT_DEPTH: 0
  script:
    - set -euo pipefail
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        BASE="$(git rev-parse HEAD~1)"
      fi
    - echo "Checking commits from $BASE to HEAD"
    - git log --oneline "$BASE..HEAD"
    - |
      if ! npx commitlint --from "$BASE" --to HEAD --verbose; then
        echo "❌ Commitlint found problems - blocking pipeline!"
        exit 1
      fi

# ------------------------------
# PACKAGE JOBS
# ------------------------------

package:stable:
  stage: package
  needs:
    - lint:shellcheck
    - lint:yamllint
    - lint:markdown
    - lint:ansible-lint
    - lint:licensing
    - lint:commitlint
  parallel:
    matrix:
      - FLAVOR: !reference [.template_pkg_vars, FLAVORS_PKG]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/'
    - when: never
  script:
    - extras/packaging/build-all.sh --${FLAVOR} --version "$CI_COMMIT_TAG"
    - |
      if [ "$FLAVOR" = "rpm" ]; then
        export GNUPGHOME="$HOME/.gnupg"
        mkdir -p "$GNUPGHOME"
        chmod 700 "$GNUPGHOME"
        export GPG_TTY=$(tty 2>/dev/null || echo /dev/tty)
        echo "Importing GPG key..."
        echo "$GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
        GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
        echo "Using GPG_KEY_ID=$GPG_KEY_ID"
        echo "$GPG_PASSPHRASE" > /tmp/.gpg-passphrase
        chmod 600 /tmp/.gpg-passphrase
        echo "%_signature gpg" > ~/.rpmmacros
        echo "%_gpg_path $GNUPGHOME" >> ~/.rpmmacros
        echo "%_gpg_name $GPG_KEY_ID" >> ~/.rpmmacros
        echo "%__gpg_sign_cmd %{__gpg} gpg --batch --pinentry-mode loopback --passphrase-file /tmp/.gpg-passphrase --no-verbose --no-armor --no-secmem-warning -u \"%{_gpg_name}\" -sbo %{__signature_filename} %{__plaintext_filename}" >> ~/.rpmmacros
        for pkg in artifacts/*.rpm; do
          echo "Signing $pkg"
          rpmsign --addsign "$pkg"
        done
        rm -f /tmp/.gpg-passphrase
      fi
  artifacts:
    paths:
      - artifacts/*
    expire_in: 1 day

