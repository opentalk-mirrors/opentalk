build:
  image: $RUST_IMAGE
  stage: build
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\/v\d+\.\d+\.x$/
    - if: $CI_COMMIT_TAG =~ /^release-v\d+\.\d+\.\d+.*$/
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  variables:
    VERGEN_GIT_SHA: $CI_COMMIT_SHA
    VERGEN_GIT_BRANCH: $CI_COMMIT_REF_NAME
  artifacts:
    paths:
      - target/release/opentalk-controller
      - target/release/opentalk-obelisk
      - target/release/opentalk-orchestrator
      - target/release/opentalk-recorder
      - target/release/opentalk-roomserver
      - target/release/opentalk-smtp-mailer
      - target/release/opentalk-transcription
    expire_in: 1 week
  script:
    - cargo auditable build --release --locked -p opentalk-controller
    - cargo auditable build --release --locked -p opentalk-obelisk
    - cargo auditable build --release --locked -p opentalk-orchestrator
    - cargo auditable build --release --locked -p opentalk-recorder
    - cargo auditable build --release --locked -p opentalk-roomserver
    - cargo auditable build --release --locked -p opentalk-smtp-mailer
    - cargo auditable build --release --locked -p opentalk-transcription
    - du -ch target/release/opentalk-*

# The DUI requires glibc. We therefore build it with a Debian based container.
build:dui:
  <<: *default_job_condition
  stage: build
  needs: []
  script:
    - cargo auditable build --release --locked -p opentalk-roomserver-dui

build:docs:
  stage: build
  image:
    name: git.opentalk.dev:5050/opentalk/backend/containers/mkdocs-material:latest
    entrypoint: ['']
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  artifacts:
    paths:
      - site/
  script:
    - mkdocs build --config-file "$CI_PROJECT_DIR"/mkdocs.yml --strict

build:pages:
  stage: build
  image:
    name: git.opentalk.dev:5050/opentalk/backend/containers/mkdocs-material:latest
    entrypoint: ['']
  pages:
    publish: site
  needs: []
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  before_script: []
  script:
    - mkdocs build --config-file "$CI_PROJECT_DIR"/mkdocs.yml --strict

trigger-docs:
  stage: trigger
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_NAME !~ /^.*canary$/
  trigger:
    project: opentalk/backend/docs
