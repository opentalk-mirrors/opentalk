# Manual, destructive end-to-end Compose test. Requires a dinD runner with
# Docker, `just`, `uv`, Ansible, and network access to the container registry.
int:e2e:
  stage: integration
  tags:
    - dind
  image: git.opentalk.dev:5050/opentalk/opentalk-devops/containers/pkgtest-dind/debian12:dev
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
    - when: never
  variables:
    OPENTALK_E2E: "1"
  before_script:
    - !reference [.int_before_script, before_script]
    - |
      set -euo pipefail
      command -v just >/dev/null || \
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
      command -v uv >/dev/null || { export UV_INSTALL_DIR=/root/.local/bin; curl -LsSf https://astral.sh/uv/install.sh | sh; }
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - bash extras/scripts/tests/integration/test_compose_e2e.sh

deploy:experimental:testing:
  stage: deploy
  allow_failure: true
  # Fetch artifacts from experimental packaging; mark optional so the job exists even if one flavor is missing
  needs:
    - job: "package:experimental: [deb]"
      artifacts: true
      optional: true
    - job: "package:experimental: [rpm]"
      artifacts: true
      optional: true
  # Show manual button on typical branch/MR experimental pipelines; hide on tag pipelines
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - when: never
  resource_group: remote-deploy-$HOST
  variables:
    GIT_STRATEGY: none
  parallel:
    matrix:
      - DIST: debian12
        HOST: $DEPLOY_TARGET_HOST_DEBIAN12
        PKG_CMD: apt
        PKG_TYPE: deb
      - DIST: debian13
        HOST: $DEPLOY_TARGET_HOST_DEBIAN13
        PKG_CMD: apt
        PKG_TYPE: deb
      - DIST: ubuntu2404
        HOST: $DEPLOY_TARGET_HOST_UBUNTU2404
        PKG_CMD: apt
        PKG_TYPE: deb
      - DIST: opensuse15
        HOST: $DEPLOY_TARGET_HOST_OPENSUSE15
        PKG_CMD: zypper
        PKG_TYPE: rpm
      - DIST: opensuse16
        HOST: $DEPLOY_TARGET_HOST_OPENSUSE16
        PKG_CMD: zypper
        PKG_TYPE: rpm
      - DIST: rocky9
        HOST: $DEPLOY_TARGET_HOST_ROCKY9
        PKG_CMD: dnf
        PKG_TYPE: rpm
      - DIST: rocky10
        HOST: $DEPLOY_TARGET_HOST_ROCKY10
        PKG_CMD: dnf
        PKG_TYPE: rpm
  before_script:
    - set -euo pipefail
    # Add SSH client config with jump host
    - sh "$SH_SSH_CLIENT_CONFIG"
  script:
    - sh -euo pipefail
    # Locate artifacts from experimental packaging
    - sh "$SH_INSTALL_OPENTALK_COMPOSE"
