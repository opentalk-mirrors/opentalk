image: ruby:slim-bookworm

stages:
  - package
  - publish

variables:
  PACKAGE_NAME: "opentalk-compose"
  PACKAGE_VERSION: $CI_COMMIT_TAG
  PACKAGE_ARCH_DEB: "all"
  PACKAGE_ARCH_RPM: "noarch"
  PACKAGE_DESCRIPTION: "Compose and orchestrate OpenTalk services."
  PACKAGE_LICENSE: "EUPL-1.2"
  PACKAGE_MAINTAINER: "OpenTalk GmbH mail@opentalk.eu"
  PACKAGE_VENDOR: "OpenTalk GmbH"
  PACKAGE_VENDOR_URL: "https://opentalk.eu"
  PACKAGE_CATEGORY: "comm"
  SOURCE_DIR: "/tmp/src"
  OUTPUT_DIR: "./build"

build:community-deb:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG  
  script:
    - mkdir -p $SOURCE_DIR/opt/opentalk-compose
    - cp -rT . $SOURCE_DIR/opt/opentalk-compose
    - rm -rf $SOURCE_DIR/opt/opentalk-compose/{.git,.gitignore,.gitlab-ci.yml,README.md}
    - find $SOURCE_DIR/opt/opentalk-compose -name .gitkeep -delete
    - mv $SOURCE_DIR/opt/opentalk-compose/config/default.env.sample $SOURCE_DIR/opt/opentalk-compose/config/default.env
    - mkdir -p $OUTPUT_DIR
    - sed -i "s/^PRODUCT_VERSION=.*/PRODUCT_VERSION=CE-$PACKAGE_VERSION/" $SOURCE_DIR/opt/opentalk-compose/.versions
    - apt-get update && apt-get install -y squashfs-tools binutils curl
    - gem install fpm
    - |
      fpm -s dir -t deb -n $PACKAGE_NAME-ce \
        -v $PACKAGE_VERSION \
        -a $PACKAGE_ARCH_DEB \
        --description "OpenTalk Community Edition. $PACKAGE_DESCRIPTION" \
        --license $PACKAGE_LICENSE \
        --maintainer "$PACKAGE_MAINTAINER" \
        --vendor "$PACKAGE_VENDOR" \
        --url "$PACKAGE_VENDOR_URL" \
        --category $PACKAGE_CATEGORY \
        --depends "docker-ce | docker-ee" \
        --depends "docker-compose-plugin" \
        --provides "$PACKAGE_NAME-ce" \
        --conflicts "$PACKAGE_NAME-ee (>= 0)" \
        --directories /opt/$PACKAGE_NAME \
        --directories /var/opt/$PACKAGE_NAME \
        --config-files /opt/$PACKAGE_NAME/config \
        --config-files /opt/$PACKAGE_NAME/config/secrets \
        -C $SOURCE_DIR \
        --after-install $SOURCE_DIR/opt/opentalk-compose/extras/packaging/post-install.sh \
        -p $OUTPUT_DIR/${PACKAGE_NAME}-ce_${PACKAGE_VERSION}_${PACKAGE_ARCH_DEB}.deb
  artifacts:
    paths:
      - $OUTPUT_DIR/*.deb
    expire_in: 1 week

build:community-rpm:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG  
  script:
    - mkdir -pv $SOURCE_DIR/opt/opentalk-compose
    - mkdir -pv $SOURCE_DIR/var/opt/opentalk-compose
    - cp -rTv . $SOURCE_DIR/opt/opentalk-compose
    - rm -rfv $SOURCE_DIR/opt/opentalk-compose/{.git,.gitignore,.gitlab-ci.yml,README.md}
    - find $SOURCE_DIR/opt/opentalk-compose -name .gitkeep -delete
    - mv -v $SOURCE_DIR/opt/opentalk-compose/config/default.env.sample $SOURCE_DIR/opt/opentalk-compose/config/default.env
    - mkdir -pv $OUTPUT_DIR
    - sed -i "s/^PRODUCT_VERSION=.*/PRODUCT_VERSION=CE-$PACKAGE_VERSION/" $SOURCE_DIR/opt/opentalk-compose/.versions
    - apt-get update && apt-get install -y squashfs-tools binutils rpm curl git
    - gem install fpm
    - |
      fpm \
        -s dir -t rpm \
        -p ${OUTPUT_DIR}/${PACKAGE_NAME}-ce-${PACKAGE_VERSION}.${PACKAGE_ARCH_RPM}.rpm \
        --name "${PACKAGE_NAME}-ce" \
        --version "${PACKAGE_VERSION}" \
        --description "OpenTalk Community Edition. $PACKAGE_DESCRIPTION" \
        --maintainer "$PACKAGE_MAINTAINER" \
        --vendor "$PACKAGE_VENDOR" \
        --url "$PACKAGE_VENDOR_URL" \
        --license "$PACKAGE_LICENSE" \
        --depends "(docker-ce or docker-ee or docker)" \
        --depends "(docker-compose-plugin or docker-compose)" \
        --provides "${PACKAGE_NAME}-ce" \
        --directories /opt/${PACKAGE_NAME} \
        --directories /var/opt/${PACKAGE_NAME} \
        --config-files /opt/${PACKAGE_NAME}/config \
        --config-files /opt/${PACKAGE_NAME}/config/secrets \
        --after-install $SOURCE_DIR/opt/opentalk-compose/extras/packaging/post-install.sh \
        -C ${SOURCE_DIR}
  artifacts:
    paths:
      - $OUTPUT_DIR/*.rpm
    expire_in: 1 week

