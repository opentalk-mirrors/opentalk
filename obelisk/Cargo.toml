# Enable tls-features for tokio tungstenite
tokio-tungstenite029 = { package = "tokio-tungstenite", version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-tungstenite030 = { package = "tokio-tungstenite", version = "0.30", features = ["rustls-tls-native-roots"] }

[package.metadata.cargo-machete]
ignored = ["tokio-tungstenite029", "tokio-tungstenite030"]

[build-dependencies]
anyhow.workspace = true
opentalk-version.workspace = true
