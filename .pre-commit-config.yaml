---
# For setup instructions see the backend onboarding doc.
# https://git.opentalk.dev/a.weiche/the-knowledge/-/blob/main/backend-onboarding.md?ref_type=heads#pre-commit
exclude: target/|.*\.snap|.*.sql

repos:
  # These are "general" hooks provided by the pre-commit devs
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
  # A repo containing hooks for certain cargo subcommands
  # Used for tools that don't bring official hooks
  # Maybe we should create such a "dummy" project ourselves
  - repo: https://github.com/AndrejOrsula/pre-commit-cargo
    rev: 0.5.0
    hooks:
      - id: cargo-fmt
        entry: cargo +nightly fmt
      - id: cargo-clippy
        args:
          - --all-targets
          - --all-features
          - --workspace
          - --tests
          - --
          - --deny
          - warnings
      - id: cargo-doc
        args:
          - --workspace
          - --no-deps
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.20.2
    hooks:
      - id: cargo-deny
        args:
          - --all-features
          - --workspace
          - check
          - --deny
          - unmatched-skip
          - --deny
          - license-not-encountered
          - --deny
          - license-exception-not-encountered
          - --deny
          - advisory-not-detected
          - --hide-inclusion-graph
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: 6ddd489
    hooks:
      - id: cargo-machete
        args:
          - --with-metadata
  - repo: https://github.com/weichweich/olpat
    rev: v0.10.0
    hooks:
      - id: olpat-format
      - id: olpat-lint
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^api/docs/openapi\.yml$
        args:
          - .
      # The root .yamllint.yaml ignores compose/, which has its own rules.
      - id: yamllint
        name: yamllint (compose)
        entry: bash -c 'cd compose && yamllint .'
        files: ^compose/
        pass_filenames: false
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse-lint-file
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2-docker
        # compose/ is linted with mdl and its own style below, like in CI.
        exclude: ^compose/
        args:
          - --warnings
  # opentalk-compose: the same checks as its CI lint jobs, run from compose/.
  - repo: https://github.com/ansible/ansible-lint.git
    rev: v25.11.0
    hooks:
      - id: ansible-lint
        name: ansible-lint (compose)
        entry: bash -c 'cd compose && ANSIBLE_COLLECTIONS_PATH=.ansible/collections ansible-lint automation'
        files: ^compose/.*\.ya?ml$
        language_version: python3
        pass_filenames: false
  - repo: local
    hooks:
      - id: compose-shellcheck
        name: shellcheck (compose)
        # The wrappers have no .sh extension, so list them explicitly.
        entry: >-
          bash -c 'cd compose &&
          git ls-files -z "*.sh" | xargs -0r shellcheck &&
          shellcheck extras/packaging/wrappers/*'
        language: system
        files: ^compose/
        pass_filenames: false
      - id: compose-markdown
        name: mdl (compose)
        entry: |
          bash -c '
          cd compose &&
          git ls-files "*.md" |
          grep -v "docs/6-configuration-options-reference.md" |
          xargs -P4 -n1 sh -c "
            f=\"\$1\";
            sed \"/\\[\\[_TOC_\\]\\]/Id\" \"\$f\" |
            mdl --style .markdown_style.rb - 2>&1 |
            sed \"s|^|\$f: |\"
          " _
          '
        language: system
        files: ^compose/.*\.md$
        pass_filenames: false
  # No official hooks for commitlint available, this one seems actively maintained
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
