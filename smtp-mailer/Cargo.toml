[package]
name = "opentalk-smtp-mailer"
description = "Mail Worker that takes mail send tasks from a queue, renders them, and sends them out via SMTP"
publish = false
build = "build.rs"
default-run = "opentalk-smtp-mailer"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
chrono-tz.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive"] }
config.workspace = true
css-inline.workspace = true
dirs.workspace = true
env_logger.workspace = true
fluent-langneg.workspace = true
fluent-templates.workspace = true
futures.workspace = true
ics-chrono-tz.workspace = true
ics.workspace = true
icu_locid.workspace = true
itertools.workspace = true
lapin3.workspace = true
lettre = { workspace = true, features = ["builder", "hostname", "mime03", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
log.workspace = true
mime.workspace = true
opentalk-mail-worker-protocol.workspace = true
opentalk-types-common.workspace = true
opentalk-version.workspace = true
percent-encoding.workspace = true
phonenumber.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
service-probe-client.workspace = true
service-probe.workspace = true
tera = { workspace = true }
tera-contrib = { workspace = true, default-features = false, features = ["date"] }
textwrap.workspace = true
tokio = { workspace = true, default-features = false, features = ["macros", "rt-multi-thread", "signal"] }
tokio-executor-trait.workspace = true
tokio-reactor-trait.workspace = true
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
insta.workspace = true
rstest.workspace = true
serial_test.workspace = true

[build-dependencies]
opentalk-version.workspace = true
snafu.workspace = true

[package.metadata.cargo-machete]
ignored = ["snafu"]
